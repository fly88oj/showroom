[package]
name = "showroomctl"
version = "0.1.0"
edition = "2021"

[dependencies]
showroom-common = { path = "../showroom-common" }
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "sync", "time"] }
futures-util = { version = "0.3", default-features = false }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bcrypt = "0.15"
zstd = "0.13"
flate2 = "1" # gzip 降级路径的魔数自适应解包（default features = 纯 Rust miniz_oxide 后端）
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
