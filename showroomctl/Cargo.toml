[package]
name = "showroomctl"
version = "0.1.0"
edition = "2021"

[dependencies]
showroom-common = { path = "../showroom-common" }
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "sync", "time"] }
futures-util = { version = "0.3", default-features = false }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bcrypt = "0.15"
zstd = "0.13"
flate2 = "1" # gzip 降级路径的魔数自适应解包（default features = 纯 Rust miniz_oxide 后端）
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
# plan-16 §6.2：OPAQUE 登录两端实现收口在 common::opaque（两端同 crate 无互操作缝隙），
# 此处直接依赖仅锚定与 common 一致的版本（服务端注册记录/登录序列经由 common 调用）。
opaque-ke = { version = "3", default-features = false, features = ["ristretto255-voprf"] }
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
