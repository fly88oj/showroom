[package]
name = "showroom"
version = "0.1.0"
edition = "2021"

[dependencies]
showroom-common = { path = "../showroom-common" }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
zstd = "0.13"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4" # plan-18：srtp_id/key_mac 十六进制
# plan-16 §4 login：交互读密码（不回显、不进 argv/env/ps；仅 libc/win 依赖）
rpassword = "7"
