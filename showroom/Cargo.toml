[package]
name = "showroom"
version = "0.1.0"
edition = "2021"

[dependencies]
showroom-common = { path = "../showroom-common" }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
zstd = "0.13"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
