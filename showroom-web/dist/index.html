<!doctype html>
<html lang="zh-CN">
<head>
<link rel="icon" href="data:,">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14161a">
<title>Showroom 控制台</title>
<style>
  html { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0 1rem 3rem; background: #14161a; color: #d7dce3;
    font: 14px/1.6 system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
    touch-action: manipulation;
  }
  h1 { font-size: 18px; margin: 0; }
  h2 { font-size: 15px; margin: 0 0 .6rem; color: #9fc3e8; }
  h3 { font-size: 13px; margin: .8rem 0 .4rem; color: #8fa0b5; }
  header, section {
    background: #1b1f26; border: 1px solid #2a2f39; border-radius: 8px;
    padding: .8rem 1rem; margin-top: 1rem; max-width: 1100px; margin-left: auto; margin-right: auto;
  }
  .row { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; }
  /* 表单一律 label 上、控件下 */
  .field { display: flex; flex-direction: column; gap: .2rem; min-width: 0; }
  .field > span { color: #aeb6c2; font-size: 13px; }
  input[type=text], input[type=number], input[type=file], textarea, select {
    background: #14161a; color: #d7dce3; border: 1px solid #343b47; border-radius: 4px;
    padding: .3rem .45rem; font: inherit; max-width: 100%;
  }
  select option { background: #14161a; color: #d7dce3; } /* 显式配色（下拉展开项） */
  textarea { width: 100%; min-height: 3.2em; font-family: ui-monospace, monospace; font-size: 12px; }
  button {
    background: #2b3d55; color: #e7edf5; border: 1px solid #3d5578; border-radius: 4px;
    padding: .3rem .8rem; font: inherit; cursor: pointer; touch-action: manipulation;
    transition: background-color .15s ease, border-color .15s ease;
  }
  button:hover:not(:disabled) { background: #35507a; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.danger { background: #5a2b2b; border-color: #7a3d3d; }
  /* 可见焦点（全控件；不移除 outline） */
  :focus-visible { outline: 2px solid #79b8ff; outline-offset: 1px; }
  .mono { font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 12px; font-variant-numeric: tabular-nums; }
  .note { color: #8a93a3; font-size: 12px; margin: .4rem 0 0; }
  .pub { color: #7fd88f; word-break: break-all; }
  .hidden { display: none; }
  /* 滚动容器不外溢滚动链 */
  .tbl-wrap, pre.out, dialog pre, textarea, select[size] { overscroll-behavior: contain; }
  #msg {
    max-width: 1100px; margin: 1rem auto 0; padding: .5rem .8rem; border-radius: 6px;
    display: none; font-size: 13px; white-space: pre-wrap; word-break: break-all;
  }
  #msg.err { display: block; background: #3a2226; border: 1px solid #6b3a42; color: #ffb3bd; }
  #msg.ok { display: block; background: #21362a; border: 1px solid #3a6b4c; color: #a9e8b8; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: .3rem .5rem; border-bottom: 1px solid #2a2f39; white-space: nowrap; }
  th { color: #8fa0b5; font-weight: 600; position: sticky; top: 0; background: #1b1f26; }
  td .act { margin-right: .25rem; padding: .1rem .5rem; font-size: 12px; }
  td.wrap { white-space: normal; word-break: break-all; }
  .tbl-wrap { overflow: auto; max-height: 60vh; border: 1px solid #2a2f39; border-radius: 6px; }
  form .grid { display: flex; flex-wrap: wrap; gap: .8rem; align-items: flex-end; }
  dialog {
    background: #1b1f26; color: #d7dce3; border: 1px solid #3d5578; border-radius: 8px;
    padding: 1rem; max-width: 80vw; width: 720px;
  }
  dialog::backdrop { background: rgba(0,0,0,.55); }
  dialog pre, pre.out {
    background: #14161a; border: 1px solid #2a2f39; border-radius: 6px; padding: .6rem;
    max-height: 50vh; overflow: auto; white-space: pre-wrap; word-break: break-all; font-size: 12px;
  }
  progress { width: 100%; height: 14px; }
  .status-ok { color: #7fd88f; } .status-bad { color: #ff9aa5; } .status-mid { color: #e8c37f; }
  /* §12.1 一键部署状态条：四段步骤 / 失败标红 / 完成大字 URL；§12.2 管理标签 */
  .wz-step.done { background: #21362a; border-color: #3a6b4c; color: #a9e8b8; }
  .wz-step.err { background: #3a2226; border-color: #6b3a42; color: #ffb3bd; }
  .wz-step.skip { opacity: .45; }
  #dp-bar.err #dp-text { color: #ff9aa5; }
  .dp-url { font-size: 20px; font-weight: 700; color: #7fd88f; word-break: break-all; }
  .ad-owner-row td { background: #14161a; border-bottom: 1px solid #343b47; }
  a { color: #79b8ff; }
  fieldset { border: 1px solid #2a2f39; border-radius: 6px; margin: 0 0 .6rem; }
  legend { color: #8fa0b5; font-size: 12px; padding: 0 .3rem; }
  /* 标签页导航（role=tablist/tab/tabpanel + aria-selected 同步） */
  #tabs { display: flex; gap: .4rem; flex-wrap: wrap; margin-bottom: .6rem; }
  #tabs button { background: #1b1f26; border-color: #2a2f39; color: #aeb6c2; }
  #tabs button.on, #tabs button[aria-selected="true"] { background: #2b3d55; border-color: #3d5578; color: #e7edf5; }
  /* 登录向导（§10.1）：步骤条 + 三步面板 */
  .wz-step {
    color: #8fa0b5; font-size: 12px; padding: .1rem .6rem;
    border: 1px solid #2a2f39; border-radius: 999px; background: #1b1f26;
  }
  .wz-step.on { background: #2b3d55; border-color: #3d5578; color: #e7edf5; }
  .wz-pane { margin-top: .6rem; }
  #wz-key-choices { display: flex; flex-direction: column; gap: .45rem; }
  #wz-key-choices label { cursor: pointer; }
  #wz-pub { font-size: 16px; letter-spacing: .4px; user-select: all; }
  /* 行内反馈（操作后就近显示，错误另走顶部条） */
  .fb { font-size: 12px; color: #a9e8b8; min-height: 1.2em; margin: .3rem 0 0; }
  .fb.warn { color: #e8c37f; }
  .sep { border-top: 1px dashed #2a2f39; margin: .9rem 0 .6rem; }
  dl.help dt { color: #9fc3e8; font-weight: 600; margin-top: .5rem; }
  dl.help dd { margin: 0 0 0 1rem; color: #aeb6c2; }
  /* 字段级内联错误（首错聚焦；API 错误另走顶部条） */
  .ferr { color: #ff9aa5; font-size: 12px; margin: .1rem 0 0; min-height: 0; }
  /* §13.1 三入口并存提示徽记 */
  .badge { color: #8fa0b5; font-size: 12px; border: 1px dashed #2a2f39; border-radius: 999px; padding: 0 .5rem; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>

<div id="msg" role="alert" aria-live="polite"></div>

<!-- ———— 登录向导（SPEC §10.1：线性三步；签名自测通过前只渲染本区块，不渲染任何管理 UI） ———— -->
<section id="login">
  <h1>Showroom 控制台</h1>
  <p class="note">服务器（同源代理，经 <span class="mono">/_api/*</span> 签名调用）：<span class="mono" id="lg-srv"></span></p>
  <div class="row" style="gap:.4rem;margin-top:.6rem">
    <span class="wz-step" id="wz-s1">1/3 你是谁</span>
    <span class="wz-step" id="wz-s2">2/3 选择密钥</span>
    <span class="wz-step" id="wz-s3">3/3 验证</span>
  </div>

  <!-- 步骤 1「你是谁」：唯一控件 = 账号输入 + 下一步 -->
  <div class="wz-pane" id="wz-p1">
    <label class="field" for="wz-owner"><span>账号（发布者账号）</span>
      <input type="text" id="wz-owner" placeholder="如 alice…" size="14" pattern="[a-z0-9][a-z0-9-]{0,30}" autocomplete="username" aria-describedby="wz-owner-err"></label>
    <p class="ferr" id="wz-owner-err" aria-live="polite"></p>
    <div class="row" style="margin-top:.6rem"><button id="wz-next1">下一步</button></div>
  </div>

  <!-- 步骤 2「选择密钥」：自动检测本机存量，单选三选一（导入时才出现粘贴框） -->
  <div class="wz-pane hidden" id="wz-p2">
    <fieldset>
      <legend>为账号 <span class="mono" id="wz-ownerEcho"></span> 选择密钥</legend>
      <div id="wz-key-choices">
        <label class="row" id="wz-l-use" for="wz-r-use" style="gap:.4rem"><input type="radio" name="wz-key" id="wz-r-use"><span>使用本机已有密钥（指纹 <span class="mono" id="wz-fp"></span>）</span></label>
        <label class="row" for="wz-r-new" style="gap:.4rem"><input type="radio" name="wz-key" id="wz-r-new"><span id="wz-new-text">生成新密钥</span></label>
        <label class="row" for="wz-r-import" style="gap:.4rem"><input type="radio" name="wz-key" id="wz-r-import"><span>导入密钥种子</span></label>
      </div>
      <label class="field hidden" id="wz-import-box" for="wz-seed" style="margin-top:.5rem"><span>粘贴 64 位十六进制密钥种子（showroom keygen 产物 / 其他设备导出）</span>
        <textarea id="wz-seed" class="mono" spellcheck="false" placeholder="64 位十六进制字符（32 字节）…" aria-describedby="wz-seed-err"></textarea></label>
      <p class="ferr hidden" id="wz-seed-err" aria-live="polite" style="margin-top:.3rem"></p>
    </fieldset>
    <div class="row" style="margin-top:.6rem">
      <button id="wz-back2">上一步</button>
      <button id="wz-next2">下一步</button>
    </div>
    <p class="note">密钥即身份：32 字节 seed 以十六进制存于浏览器 localStorage——<b>属试验性存储</b>，换设备/清缓存即失效；正式场景请用 CLI <span class="mono">showroom keygen</span>。</p>
  </div>

  <!-- 步骤 3「验证」：自动签名自测；未登记 → 展示公钥串等待登记，点【重新检测】循环；通过 → 自动进入管理界面 -->
  <div class="wz-pane hidden" id="wz-p3">
    <p class="note">账号 <span class="mono" id="wz-v-owner"></span> · 密钥指纹 <span class="mono" id="wz-v-fp"></span></p>
    <p class="fb" id="wz-v-fb" aria-live="polite"></p>
    <div id="wz-pubbox" class="hidden">
      <p class="note">尚未登记：把下方公钥串发给管理员登记（<span class="mono">showroomctl owner-add &lt;账号&gt; --pubkey &lt;公钥串&gt;</span>），登记后点【重新检测】。</p>
      <div class="row" style="align-items:center;gap:.6rem;flex-wrap:nowrap">
        <code id="wz-pub" class="pub"></code>
        <button id="wz-copypub">复制公钥</button>
      </div>
    </div>
    <div class="row" style="margin-top:.6rem">
      <button id="wz-recheck">重新检测</button>
    </div>
  </div>
</section>

<!-- ———— 管理壳（模板：惰性，登录成功后才克隆进文档流；SPEC §3「登录成功前不加载管理资源」） ———— -->
<template id="app-tpl">
  <header>
    <div class="row" style="justify-content:space-between">
      <h1>Showroom 控制台</h1>
      <span class="row" style="gap:.8rem">
        <span class="note">账号 <span class="mono" id="hd-owner"></span></span>
        <span class="note">服务器 <span class="mono" id="hd-srv"></span></span>
        <button id="btn-logout">退出登录</button>
      </span>
    </div>
    <label class="field" for="hd-pempub" style="margin-top:.6rem"><span>平台公钥 PEM（管理员分发的 <span class="mono">platform_rsa.pub</span>；镜像上传与数据库恢复的加密信封公钥，存 localStorage）</span>
      <textarea id="hd-pempub" class="mono" placeholder="-----BEGIN PUBLIC KEY-----&#10;…&#10;-----END PUBLIC KEY-----…"></textarea>
    </label>
    <nav id="tabs" role="tablist" aria-label="控制台功能分区">
      <button data-tab="proj" class="on" role="tab" id="tabbtn-proj" aria-selected="true" aria-controls="tab-proj">展项管理</button>
      <button data-tab="db" role="tab" id="tabbtn-db" aria-selected="false" aria-controls="tab-db">数据库</button>
      <button data-tab="status" role="tab" id="tabbtn-status" aria-selected="false" aria-controls="tab-status">状态监控</button>
      <button data-tab="help" role="tab" id="tabbtn-help" aria-selected="false" aria-controls="tab-help">帮助</button>
    </nav>
  </header>

  <!-- ———— 标签页 1：展项管理 ———— -->
  <section id="tab-proj" role="tabpanel" aria-labelledby="tabbtn-proj">
    <h2>展项列表</h2>
    <div class="row" style="margin-bottom:.4rem">
      <button id="btn-refresh">刷新列表</button>
      <span class="fb" id="proj-fb" aria-live="polite" style="margin:0"></span>
    </div>
    <div class="tbl-wrap">
      <table id="proj-tbl">
        <thead><tr>
          <th>名称</th><th>镜像标签</th><th>状态</th><th>访问地址</th><th>更新时间</th><th>操作</th>
        </tr></thead>
        <tbody><tr><td colspan="6" class="note">未加载</td></tr></tbody>
      </table>
    </div>
    <p class="note">仅展示对外可见信息；主机端口等内部细节不在此显示。删除会一并移除容器/路由/数据库与凭据。</p>

    <div class="sep"></div>
    <!-- §13.1 发布入口三存：一键部署（快捷路径）/ 仅上传（择时部署）/ 部署（下方独立表单选已有镜像）——一键不取代分步 -->
    <h2>发布新版本 <span class="badge">三入口并存：一键部署 · 仅上传 · 部署（见下方）</span></h2>
    <form id="pub-form">
      <div class="grid">
        <label class="field" for="pub-project"><span>项目（留空自动生成随机 8 位名；也可手输或点「换一个」/从已有项目选择）</span>
          <span class="row" style="flex-wrap:nowrap">
            <input type="text" id="pub-project" list="dl-projects" size="12" pattern="[a-zA-Z0-9][a-zA-Z0-9-]{0,30}" aria-describedby="pub-project-err">
            <button type="button" id="pub-shuffle" title="重新生成随机项目名">换一个</button>
          </span></label>
        <label class="field" for="pub-tag"><span>镜像标签（必填）</span>
          <input type="text" id="pub-tag" required size="10" aria-describedby="pub-tag-err"></label>
        <label class="field" for="pub-mem"><span>内存需求</span>
          <input type="text" id="pub-mem" value="256m" list="dl-mem" size="6"></label>
        <label class="field" for="pub-cport"><span>Demo 服务监听端口（容器内）</span>
          <input type="number" id="pub-cport" value="8080" min="1" max="65535" size="5"></label>
        <label class="field" for="pub-file"><span>镜像 tar 文件（可选；不选则直接发布，选择后自动压缩并分片上传再发布）</span>
          <input type="file" id="pub-file" aria-describedby="pub-file-err"></label>
        <button type="submit" id="pub-submit">一键部署</button>
        <button type="button" id="btn-upload-only" title="同一 tar：只压缩上传入库，不部署；稍后可从下方「部署」入口选择发布">仅上传</button>
      </div>
      <p class="ferr" id="pub-project-err" aria-live="polite"></p>
      <p class="ferr" id="pub-tag-err" aria-live="polite"></p>
      <p class="ferr" id="pub-file-err" aria-live="polite"></p>
    </form>
    <!-- §12.1 一键部署状态条：①压缩 → ②上传 → ③发布 → ④完成（大字 URL + 复制）；任一步失败标红可重试；
         「仅上传」走①②并在成功时把③④标记为跳过（镜像已入库，可稍后从下方部署入口选择） -->
    <div id="dp-bar" class="hidden" style="margin-top:.6rem">
      <div class="row" style="gap:.4rem">
        <span class="wz-step" id="dp-s1">① 压缩</span>
        <span class="wz-step" id="dp-s2">② 上传</span>
        <span class="wz-step" id="dp-s3">③ 发布</span>
        <span class="wz-step" id="dp-s4">④ 完成</span>
        <button type="button" id="dp-retry" class="hidden">重试</button>
      </div>
      <div style="margin-top:.5rem">
        <progress id="dp-prog" max="1" value="0"></progress>
        <div id="dp-text" class="note" aria-live="polite">（未开始）</div>
        <div id="dp-done" class="hidden" style="margin-top:.4rem">
          <div class="row" style="align-items:center;gap:.6rem;flex-wrap:nowrap">
            <a id="dp-url" class="dp-url" target="_blank" rel="noopener"></a>
            <button type="button" id="dp-copy">复制地址</button>
          </div>
        </div>
      </div>
    </div>
    <p class="fb" id="pub-fb" aria-live="polite"></p>
    <p class="note">
      一键部署 = 压缩 → 分片上传 → 发布 → 展示访问地址（恒为 <span class="mono" id="pub-url">/&lt;project&gt;/</span>）；任一步失败状态条标红，可重试（上传失败自动从断点续传）。
      「仅上传」只把镜像送入 registry（①②两段，不发布），适合先备好镜像、稍后再部署。
      命名规则：<span class="mono">^[a-zA-Z0-9][a-zA-Z0-9-]{0,30}$</span>（随机名 8 位字母数字，降低被字典遍历发现的门槛；项目留空即自动生成并回填），保留名 <span class="mono">v2 _api _bootstrap _console</span>；项目归属首个创建者。
      未选择文件时「一键部署」直接发布（要求镜像已在 registry 中）；镜像 tar 上传前自动经 <span class="mono">zstd-19</span> 压缩再加密（已是 <span class="mono">.tar.zst</span> 则原样上传）。
    </p>

    <fieldset style="margin-top:.8rem">
      <legend>部署（§13.1 第三入口：从镜像库选择 · 旧版本单独部署走这里）</legend>
      <div class="row">
        <label class="field" for="dep-image"><span>镜像（ComboBox：输入前缀过滤；清单来自 <span class="mono">/_api/images</span>，进入本页时自动加载，可点「刷新镜像清单」重取）</span>
          <span class="row" style="flex-wrap:nowrap">
            <input type="text" id="dep-image" list="dl-images" size="34" class="mono" placeholder="输入前缀过滤，如 alice/demo:…" aria-describedby="dep-image-err">
            <button type="button" id="dep-images-refresh">刷新镜像清单</button>
          </span></label>
        <span class="fb" id="dep-images-fb" aria-live="polite" style="margin:0"></span>
      </div>
      <p class="ferr" id="dep-image-err" aria-live="polite"></p>
      <datalist id="dl-images"></datalist>
      <form id="dep-form" class="grid" style="margin-top:.5rem">
        <label class="field" for="dep-project"><span>项目（选中镜像后自动带出，可改）</span>
          <input type="text" id="dep-project" size="12" pattern="[a-zA-Z0-9][a-zA-Z0-9-]{0,30}" aria-describedby="dep-project-err"></label>
        <label class="field" for="dep-tag"><span>镜像标签（选中镜像后自动带出，可改）</span>
          <input type="text" id="dep-tag" required size="10" aria-describedby="dep-tag-err"></label>
        <label class="field" for="dep-mem"><span>内存需求</span>
          <input type="text" id="dep-mem" value="256m" list="dl-mem" size="6"></label>
        <label class="field" for="dep-cport"><span>Demo 服务监听端口（容器内）</span>
          <input type="number" id="dep-cport" value="8080" min="1" max="65535" size="5"></label>
        <button type="submit" id="dep-submit">发布</button>
      </form>
      <p class="ferr" id="dep-project-err" aria-live="polite"></p>
      <p class="ferr" id="dep-tag-err" aria-live="polite"></p>
      <p class="fb" id="dep-fb" aria-live="polite"></p>
      <p class="note">默认仅列出您名下的镜像；管理员钥匙可见全部账号的镜像并标注「管理员视图」。选中镜像后项目与标签自动带出（仍可修改），填写内存需求与监听端口后即可发布——旧版本单独部署、或对「仅上传」入库的镜像择时部署都从此入口。</p>
    </fieldset>

    <fieldset style="margin-top:.8rem">

<script type="module">
// ———— showroom-web 控制台（SPEC §9.1）：原生 JS + showroom-common wasm 垫片 ————
// 零框架 / 零构建 / 零外部资源；登录门内只有登录 UI，管理壳放在 <template> 里惰性克隆。

// —— 常量（与 showroom-common 信封常量一致，用于前端进度/总长核算）——
const SEG = 4 * 1024 * 1024;      // AES-GCM 段明文 4MiB
const WRAP = 384;                  // RSA-3072 wrap 头
const NONCE = 12, TAG = 16;
const CHUNK = 8 * 1024 * 1024;    // 上传分片粒度（§8.1）
const DUMP_CHUNK = 4 * 1024 * 1024; // 备份下载分片粒度（§10.4，服务端上限 4MB）
const NAME_RE = /^[a-z0-9][a-z0-9-]{0,30}$/;        // 账号（owner）
const PROJ_RE = /^[a-zA-Z0-9][a-zA-Z0-9-]{0,30}$/;  // 项目（§11 放宽：允许大写）
const RESERVED = new Set(['v2', '_api', '_bootstrap', '_console']);

// §6 环境变量 → 中文用途（帮助页与环境变量模态共用）
const ENV_DESC = {
  DB_HOST: 'PostgreSQL 数据库主机名（平台内置）',
  DB_PORT: 'PostgreSQL 端口',
  DB_NAME: '本展项数据库名',
  DB_USER: '数据库用户名',
  DB_PASSWORD: '数据库密码（发布时随机生成）',
  DATABASE_URL: '完整 PostgreSQL 连接串',
  REDIS_HOST: 'Redis 主机名（平台内置）',
  REDIS_PORT: 'Redis 端口',
  REDIS_DB: '分配的 Redis 逻辑库编号（每项目一库，池上限见平台 policy）',
  REDIS_URL: '完整 Redis 连接串',
  SHOWROOM_PROJECT: '展项名',
  SHOWROOM_BASE_PATH: '对外子路径前缀（恒为 /<项目名>/；镜像内应据此适配或使用相对 URL）',
};

// —— wasm 加载 ——
const $ = (id) => document.getElementById(id);
const enc = new TextEncoder(), dec = new TextDecoder();
let ex = null;
async function loadWasm() {
  const paths = ['./showroom_bg.wasm', '/_console/showroom_bg.wasm'];
  let lastErr = null;
  for (const p of paths) {
    try { return (await WebAssembly.instantiateStreaming(fetch(p), {})).instance.exports; }
    catch (e) { lastErr = e; try { return (await WebAssembly.instantiate(await (await fetch(p)).arrayBuffer(), {})).instance.exports; } catch (e2) { lastErr = e2; } }
  }
  throw lastErr;
}
ex = await loadWasm();
// wasm 内存可能随分配增长而换代：任何 wasm 调用后都重取 view
const mem = () => new Uint8Array(ex.memory.buffer);
const alloc = (n) => { const p = ex.sr_alloc(n); if (!p) throw new Error(`sr_alloc(${n}) 失败`); return p; };
const put = (b) => { if (!b.length) return [0, 0]; const p = alloc(b.length); mem().set(b, p); return [p, b.length]; }; // 空缓冲：空指针+0 长度（ABI 合法空切片）

// —— SR-SIG1 签名请求（SPEC §1/§3：所有 /_api 一律签名）——
function nonceHex() {
  const b = new Uint8Array(16); crypto.getRandomValues(b);
  return toHex(b);
}
/** 对 wasm 内存中 [ptr,ptr+len) 的 body 签名（分片上传零拷贝路径）。 */
function signHeaderPtr(method, pathQ, bodyPtr, bodyLen) {
  const nonce = nonceHex();
  const ts = BigInt(Math.floor(Date.now() / 1000));
  const [sp, spl] = put(Buffer_fromHex(state.seed));
  const [op, ol] = put(enc.encode(state.owner)), [mp, ml] = put(enc.encode(method));
  const [pp, pl] = put(enc.encode(pathQ)), [np, nl] = put(enc.encode(nonce));
  const auth = shimCStr((out, cap) =>
    ex.sr_sign_header(sp, op, ol, mp, ml, pp, pl, ts, np, nl, bodyPtr, bodyLen, out, cap), 640);
  for (const [p, l] of [[sp, spl], [op, ol], [mp, ml], [pp, pl], [np, nl]]) unput(p, l);
  return auth;
}
/** 统一 API 调用：json 传对象 → JSON body；Uint8Array → 原始 body；null → 空 body。signal 供流式 GET 中止。 */
async function apiDo(method, pathQ, body, signal) {
  if (!state.seed || !state.owner) throw { error: 'E_STATE', msg: '未配置密钥或账号' };
  let bodyBytes = new Uint8Array(0), isJson = false;
  if (body && typeof body === 'object' && !(body instanceof Uint8Array)) {
    bodyBytes = enc.encode(JSON.stringify(body)); isJson = true;
  } else if (body instanceof Uint8Array) bodyBytes = body;
  const [bp, bl] = put(bodyBytes);
  const auth = signHeaderPtr(method, pathQ, bp, bl);
  unput(bp, bl);
  const resp = await fetch(pathQ, {
    method,
    headers: { Authorization: auth, ...(isJson ? { 'Content-Type': 'application/json' } : {}) },
    body: method === 'GET' || method === 'HEAD' ? undefined : bodyBytes,
    signal,
  });
  return resp;
}
async function api(method, pathQ, body) {
  return checkResp(await apiDo(method, pathQ, body));
}
async function checkResp(resp) {
  const text = await resp.text();
  let j = null;
  try { j = JSON.parse(text); } catch { /* 非 JSON */ }
  if (resp.ok) return j ?? {};
  throw { error: j?.error || 'E_NET', msg: j?.msg || `HTTP ${resp.status}` };
}

/** 非 JSON 响应（octet-stream 分片等）的错误解析：统一 {error,msg} 抛出。 */
async function respErr(resp) {
  let j = null;
  try { j = JSON.parse(await resp.text()); } catch { /* 非 JSON */ }
  return { error: j?.error || 'E_NET', msg: j?.msg || `HTTP ${resp.status}` };
}
/** §10.4 ndjson 流式消费：流式 GET（空 body 签名=空串哈希，与普通签名 GET 相同）；
 *  行缓冲跨 chunk 拼行、逐行 JSON 回调（非法行静默丢弃）；reader 按消费节奏拉取（天然背压）；
 *  signal 中止 → fetch/reader 随之中断并抛 AbortError。 */
async function consumeNdjson(url, onLine, signal) {
  const resp = await apiDo('GET', url, null, signal);
  if (!resp.ok) throw await respErr(resp);
  const reader = resp.body.getReader();
  const td = new TextDecoder();
  let buf = '';
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += td.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf('\n')) >= 0) {
      const line = buf.slice(0, i);
      buf = buf.slice(i + 1);
      if (line.trim()) { try { onLine(JSON.parse(line)); } catch { /* 非法行丢弃 */ } }
    }
  }
  buf += td.decode();
  if (buf.trim()) { try { onLine(JSON.parse(buf)); } catch { /* 同上 */ } }
}

function randomProject() {
  const A = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  let s = '';
  while (s.length < 8) {
    const b = new Uint8Array(32);
    crypto.getRandomValues(b);

}

// —— §12.1/§13.1 一键部署与仅上传（同一状态条）：①压缩 → ②分片上传 →（部署）③发布 → ④完成 ——
const deploy = { busy: false, intent: 'deploy', file: null, blob: null, project: '', tag: '', uploadId: null, failAt: null };
const PHASE_CN = { compress: '压缩', upload: '上传', publish: '发布' };
function dpSet(i, cls) { // cls：'on' 进行中 / 'done' 完成 / 'err' 失败 / 'skip' 跳过
  const el = $(`dp-s${i}`);
  el.classList.remove('on', 'done', 'err', 'skip');
  if (cls) el.classList.add(cls);
}
const dpText = (t) => { $('dp-text').textContent = t; };
function dpReset() {
  $('dp-bar').classList.remove('hidden', 'err');
  for (const i of [1, 2, 3, 4]) dpSet(i, null);
  $('dp-done').classList.add('hidden');
  $('dp-retry').classList.add('hidden');
  $('dp-url').textContent = '';
  $('dp-url').removeAttribute?.('href');
  $('dp-prog').max = 1; $('dp-prog').value = 0;
  dpText('准备中…');
  deploy.failAt = null;
}
/** 部署主流程：mode = fresh 全新 / resume 断点续传（沿用 uploadId 会话）/ publish 仅重发发布。
 *  终点由 deploy.intent 决定：'deploy' 上传后自动发布（③④），'upload' 仅上传入库（③④ 标 skip）。 */
async function deployRun(mode) {
  deploy.busy = true; upBusy = true;
  $('dp-retry').classList.add('hidden');
  $('dp-bar').classList.remove('err');
  const { project, tag, file } = deploy;
  let phase = mode === 'publish' ? 'publish' : (mode === 'resume' ? 'upload' : 'compress');
  try {
    if (mode === 'fresh') { // ① 压缩（未选文件则①②一并跳过）
      if (file) {
        dpSet(1, 'on'); dpText('① 压缩中：读取文件…');
        $('dp-prog').max = file.size; $('dp-prog').value = 0;
        const { blob, zstd: pre } = await uploadPayload(file, (done, raw) => {
          dpText(`① 压缩中：${((done / raw) * 100).toFixed(1)}%（${done} / ${raw} 字节，zstd-${ZSTD_LEVEL}）`);
          $('dp-prog').max = raw; $('dp-prog').value = done;
        });
        deploy.blob = blob; deploy.pre = pre;
        dpSet(1, 'done');
        dpText(`压缩完成：${pre ? '文件已是 zstd，原样进入上传' : `压缩后 ${blob.size} / 原 ${file.size} 字节`}`);
      } else {
        dpSet(1, 'skip'); dpSet(2, 'skip');
        dpText('未选镜像文件：跳过压缩与上传，直接发布（要求镜像已在 registry 中）');
      }
    }
    if (file && mode !== 'publish') { // ② 上传（失败重试走断点续传，§8.1）
      phase = 'upload';
      dpSet(2, 'on');
      if (deploy.uploadId) {
        await resumeUploadCore(deploy.uploadId, {
          compNote: (done, raw) => { dpSet(1, 'on'); dpText(`① 重新压缩（断点续传重建产物）：${done} / ${raw} 字节…`); $('dp-prog').max = raw; $('dp-prog').value = done; },
          onRec: (rec) => dpText(`② 上传中：断点续传（服务端已收 ${rec} 片），重新压缩后补传…`),
          upNote: dpUploadNote,
        });
        dpSet(1, 'done');
      } else {
        await deployUpload(project, tag);
      }
      deploy.uploadId = null;
      dpSet(2, 'done');
      if (deploy.intent === 'upload') { // 入口二「仅上传」：到②即完成，不发布（③④ 跳过）
        dpSet(3, 'skip'); dpSet(4, 'skip');
        dpText('② 完成：镜像已入库。可稍后从下方「部署（选择已有镜像）」入口选择发布。');
        showMsg(`仅上传完成：镜像 ${project}:${tag} 已入库，可稍后从「部署」入口选择发布。`, 'ok');
        deploy.failAt = null;
        ensureImages(true); // 清单立刻补上新镜像
        return;
      }
      dpText('上传完成：镜像已导入 registry。');
    }
    phase = 'publish'; // ③ 发布（参数取自表单）
    dpSet(3, 'on');
    dpText('③ 发布中…');
    const body = { project, tag, container_port: parseInt($('pub-cport').value, 10) || 8080 };
    const memv = $('pub-mem').value.trim();
    if (memv) body.mem = memv;
    const j = await api('POST', '/_api/publish', body);
    dpSet(3, 'done'); dpSet(4, 'done'); // ④ 完成：大字 URL + 复制
    const url = j.url || `/${project}/`;
    dpText('④ 完成：部署成功。');
    $('dp-url').textContent = url;
    $('dp-url').setAttribute?.('href', url);
    $('dp-done').classList.remove('hidden');
    showMsg(`一键部署成功，访问地址：${url}`, 'ok');
    refreshProjects();
    deploy.failAt = null;
  } catch (e) {
    deploy.failAt = phase;
    $('dp-bar').classList.add('err');
    dpSet(phase === 'compress' ? 1 : phase === 'upload' ? 2 : 3, 'err');
    dpText(`「${PHASE_CN[phase]}」步骤失败：${errText(e)}${phase === 'upload' && deploy.uploadId ? '；点「重试」将从断点续传（保留已传分片）。' : '；可点「重试」再次执行。'}`);
    $('dp-retry').classList.remove('hidden');
    apiFail(`一键部署（${PHASE_CN[phase]}）`, e);
    if (phase === 'compress') deploy.blob = null;
  } finally { deploy.busy = false; upBusy = false; }
}
/** 校验并填充公共发布参数（项目留空自动生成回填；标签必填）；返回 null=校验未过。 */
function collectPubFields(requireFile) {

/** ② 上传段进度：已传 / 压缩后总长（同时镜像到「镜像分片上传」区的进度条）。 */

/** 全新上传（一键部署②段）：import-begin → 本地会话登记 → 逐片加密上传 → 收尾。 */
async function deployUpload(project, tag) {
  const pem = platformPem();
  if (!pem.startsWith('-----BEGIN PUBLIC KEY-----')) throw { error: 'E_STATE', msg: '请先在页首配置平台公钥 PEM（管理员分发的 platform_rsa.pub）' };
  const zb = deploy.blob, file = deploy.file;
  const total = sealedTotal(zb.size);
  dpUploadNote(0, total); // 状态条切入②上传段（已传 0 / 压缩后总长）
  const sessSeed = new Uint8Array(32); crypto.getRandomValues(sessSeed);
  let uploadId;
  try {
    const j = await api('POST', '/_api/import-begin', { project, tag, image_id: file.name, total_bytes: total });
    uploadId = j.upload_id;
  } catch (e) {
    if (e.error === 'E_QUOTA') e.msg += `（信封总长 ${total} 字节）`;
    throw e;
  }
  deploy.uploadId = uploadId; // 失败重试凭此断点续传
  localStorage.setItem('sr.up.' + uploadId, JSON.stringify({ seed: toHex(sessSeed), project, tag, size: file.size, zsize: zb.size, name: file.name }));
  refreshUpIds();
  $('up-id').value = uploadId;
  const sid = sealBegin(pem, sessSeed);
  await uploadRest(uploadId, sid, zb, 0, 0, total, dpUploadNote);
}

// —— §8.1 分片上传 + §2 信封（保留进度/重试/续传）——
const sealedTotal = (n) => WRAP + n + Math.ceil(n / SEG) * (NONCE + TAG); // 信封总长（用于 import-begin total_bytes）
let upBusy = false;
function upProgress(sent, total) {
  $('up-prog').max = total; $('up-prog').value = sent;
  const pct = total ? ((sent / total) * 100).toFixed(1) : 0;
  $('up-status').textContent = `已上传 ${sent} / ${total} 字节（${pct}%）`;
}
function refreshUpIds() {
  $('up-ids').innerHTML = Object.keys(localStorage)
    .filter((k) => k.startsWith('sr.up.')).map((k) => `<option value="${esc(k.slice(6))}">`).join('');
}
function sealBegin(pem, seedBytes) {
  const [pemp, peml] = put(enc.encode(pem));
  const [ssp, ssl] = put(seedBytes);
  const sid = ex.sr_seal_begin_seed(pemp, peml, ssp);
  unput(pemp, peml); unput(ssp, ssl);
  if (sid <= 0) throw { error: 'E_NET', msg: `加密会话创建失败（${sid}）：请检查平台公钥 PEM` };
  return sid;
}
function pushSlice(sid, bytes) { // 返回 [written, outPtr, outCap]（调用方负责 sr_free）
  const [ip, il] = put(bytes);
  const cap = WRAP + NONCE + TAG + bytes.length + (Math.ceil(bytes.length / SEG) + 2) * (NONCE + TAG) + 64;
  const ob = alloc(cap);
  const w = ex.sr_seal_push(sid, ip, il, ob, cap);
  unput(ip, il);
  if (w < 0) { unput(ob, cap); throw { error: 'E_NET', msg: `加密分片失败（${w}）` }; }
  return [w, ob, cap];
}
function pushFlush(sid) { // 流结束（len=0）：写出尾段；返回 [written, outPtr, outCap]
  const cap = WRAP + SEG + NONCE + TAG + 64;
  const ob = alloc(cap);
  const w = ex.sr_seal_push(sid, 0, 0, ob, cap);
  if (w < 0) { unput(ob, cap); throw { error: 'E_NET', msg: `加密收尾失败（${w}）` }; }
  return [w, ob, cap];
}
async function postChunk(uploadId, seq, ptr, len, attempt = 1) {
  const pathQ = `/_api/import-chunk?upload=${encodeURIComponent(uploadId)}&seq=${seq}`;
  // 签名必须覆盖上传的确切字节：body 直读 wasm 内存 [ptr, ptr+len)
  const auth = signHeaderPtr('POST', pathQ, ptr, len);
  const body = len ? new Uint8Array(mem().buffer, ptr, len).slice() : new Uint8Array(0); // 拷贝脱离 wasm 内存（防后续增长失联）
  try {
    const resp = await fetch(pathQ, { method: 'POST', headers: { Authorization: auth, 'Content-Type': 'application/octet-stream' }, body });
    return await checkResp(resp);
  } catch (e) {
    if (attempt < 3 && (!e.error || e.error === 'E_NET')) { // 网络类失败重试（服务端 seq 连续性保证不双计）
      await new Promise((r) => setTimeout(r, 1000 * attempt));
      return postChunk(uploadId, seq, ptr, len, attempt + 1);
    }
    throw e;
  }
}

// —— 上传压缩（全链路 zstd 统一）：先全量压缩成 Blob（两遍法第一遍），再从压缩 Blob 分片 seal ——
const ZSTD_LEVEL = 19;
const isZstdHead = (b) => b && b.length >= 4 && b[0] === 0x28 && b[1] === 0xb5 && b[2] === 0x2f && b[3] === 0xfd;
function zPush(sid, bytes) { // 返回 [written, outPtr, outCap]（独立完整 zstd 帧；调用方负责 sr_free）
  const [ip, il] = put(bytes);
  const cap = bytes.length + (bytes.length >> 3) + 4096; // ≥ 垫片输出上界 len+len/256+64 的安全余量
  const ob = alloc(cap);
  const w = ex.sr_zstd_push(sid, ip, il, ob, cap);
  unput(ip, il);
  if (w < 0) { unput(ob, cap); throw { error: 'E_NET', msg: `压缩分片失败（${w}）` }; }
  return [w, ob, cap];
}
/** 全量压缩为 Blob（两遍法第一遍）：逐 8MB 片压成独立完整 zstd 帧（服务端流式解码跨帧续解）。
 *  压缩产物确定性（同输入 + 同 level ⇒ 逐字节相同）是断点续传重放的前提；每片输出立即
 *  拷贝脱离 wasm 内存后交给 Blob（浏览器 Blob 由磁盘句柄支撑，不占 JS 堆——大文件压缩
 *  阶段内存曲线仍平坦）。 */
async function compressToBlob(file, note) {
  const sid = ex.sr_zstd_begin(ZSTD_LEVEL);
  if (sid <= 0) throw { error: 'E_NET', msg: `压缩会话创建失败（${sid}）` };
  const parts = [];
  try {
    for (let o = 0; o < file.size; o += CHUNK) {
      const end = Math.min(o + CHUNK, file.size);
      const bytes = new Uint8Array(await file.slice(o, end).arrayBuffer());
      const [w, ob, cap] = zPush(sid, bytes);
      if (w > 0) parts.push(new Uint8Array(mem().subarray(ob, ob + w)));
      unput(ob, cap);
      if (note) note(end, file.size);
    }
  } finally { ex.sr_zstd_end(sid); }
  return new Blob(parts);
}
/** 上传载荷统一入口：文件头已是 zstd 魔数 → 原样（避免二次压缩）；否则压缩后上传。
 *  服务端按魔数自适应解包，两种形态都正确。返回 { blob, zstd }。 */
async function uploadPayload(file, note) {
  const head = new Uint8Array(await file.slice(0, 4).arrayBuffer());
  if (isZstdHead(head)) return { blob: file, zstd: true };
  return { blob: await compressToBlob(file, note), zstd: false };
}
/** 从 startSeq 继续上传（fresh 与 resume 共用；已 push 过的分片由调用方先行重放）。
 *  blob 为压缩产物 Blob（或已是 zstd 的原文件——Blob/File 分片读法一致）；note 进度回调（缺省走 upProgress）。 */
async function uploadRest(uploadId, sid, blob, startSeq, sent0, total, note) {
  const slices = Math.ceil(blob.size / CHUNK) || 1;
  let sent = sent0;
  for (let i = startSeq; i < slices; i++) {
    const part = blob.slice(i * CHUNK, Math.min((i + 1) * CHUNK, blob.size));
    const bytes = new Uint8Array(await part.arrayBuffer());
    const [w, ob, cap] = pushSlice(sid, bytes);
    try { await postChunk(uploadId, i, ob, w); } finally { unput(ob, cap); }
    sent += w; (note || upProgress)(sent, total);
  }
  { // flush（len=0 尾段）——也作为一个分片上传（0 字节片合法，保证 seq 与 push 一一对应）
    const [w, ob, cap] = pushFlush(sid);
    try { await postChunk(uploadId, slices, ob, w); } finally { unput(ob, cap); }
    sent += w; (note || upProgress)(sent, total);
  }
  if (sent !== total) throw { error: 'E_STATE', msg: `信封总长校验失败：本地 ${sent} ≠ 预计 ${total}（不上传收尾，请重试）` };
  ex.sr_seal_end(sid);
  await api('POST', `/_api/import-end?upload=${encodeURIComponent(uploadId)}`, null);
  localStorage.removeItem('sr.up.' + uploadId);
  refreshUpIds();
}
/** 断点续传核心（手动「恢复」与一键部署重试共用，§8.1）：查已收分片 → 重新压缩重建产物
 *  （压缩确定性 ⇒ 信封逐字节一致）→ 重放已收分片推进加密会话 → 补传剩余 → import-end 收尾。
 *  opts：compNote 压缩进度 / onRec(rec) 已收片数提示 / upNote 上传进度。返回 { pre, zsize }。 */
async function resumeUploadCore(id, opts = {}) {
  const saved = JSON.parse(localStorage.getItem('sr.up.' + id) || 'null');
  if (!saved) throw { error: 'E_STATE', msg: '本地无该会话记录（浏览器数据被清则无法续传，请重新发起）' };
  const file = $('pub-file').files[0];
  if (!file || file.size !== saved.size) throw { error: 'E_STATE', msg: `续传需在发布表单选择同一文件（${saved.name}，${saved.size} 字节）` };
  const pem = platformPem();
  if (!pem.startsWith('-----BEGIN PUBLIC KEY-----')) throw { error: 'E_STATE', msg: '请先在页首配置平台公钥 PEM（管理员分发的 platform_rsa.pub）' };
  const st = await api('GET', `/_api/import-status?upload=${encodeURIComponent(id)}`);
  const rec = (st.received || []).length;
  opts.onRec?.(rec);
  // 重建压缩产物（确定性 ⇒ 与原会话逐字节相同）；旧会话记录（无 zsize）按原样直传兼容
  const { blob: zb, zstd: pre } = await uploadPayload(file, opts.compNote);
  if (saved.zsize !== undefined && saved.zsize !== zb.size) {
    throw { error: 'E_STATE', msg: `压缩产物长度与上次不符（${zb.size} ≠ ${saved.zsize}），请确认选择的是同一文件` };
  }
  const total = sealedTotal(zb.size);
  const slices = Math.ceil(zb.size / CHUNK) || 1;
  const sid = sealBegin(pem, Buffer_fromHex(saved.seed));
  let sent = 0;
  for (let i = 0; i < Math.min(rec, slices); i++) { // 重放已收分片（同 seed+同产物 ⇒ 密文一致，只推进会话状态不再上传）
    const part = zb.slice(i * CHUNK, Math.min((i + 1) * CHUNK, zb.size));
    const bytes = new Uint8Array(await part.arrayBuffer());
    const [w, ob, cap] = pushSlice(sid, bytes);
    sent += w; unput(ob, cap);
  }
  (opts.upNote || upProgress)(sent, total);
  const flushBytes = (zb.size % SEG) ? (zb.size % SEG) + NONCE + TAG : 0; // 尾段输出量（重放计数公式）
  if (rec < slices) { // 还有数据片未收：从断点补传（uploadRest 内部完成收尾与会话清理）
    await uploadRest(id, sid, zb, rec, sent, total, opts.upNote);
    return { pre, zsize: zb.size };
  }
  if (rec === slices) { // 数据片齐，仅缺收尾片
    const [w, ob, cap] = pushFlush(sid);
    try { await postChunk(id, slices, ob, w); } finally { unput(ob, cap); }
    sent += w;
  } else sent += flushBytes; // rec === slices+1：收尾片也已收到，只补计数
  if (sent !== total) throw { error: 'E_STATE', msg: `重放长度不符（${sent}/${total}），请重新发起` };
  ex.sr_seal_end(sid);
  await api('POST', `/_api/import-end?upload=${encodeURIComponent(id)}`, null);
  localStorage.removeItem('sr.up.' + id);
  refreshUpIds();
  return { pre, zsize: zb.size };
}
async function onResumeUpload() {
  if (upBusy || deploy.busy) return showMsg('已有上传或部署进行中');
  const id = $('up-id').value.trim();
  if (!id) return showMsg('请填入要恢复的上传编号（开始上传后自动记录）');
  if (!localStorage.getItem('sr.up.' + id)) return showMsg('本地无该会话记录（浏览器数据被清则无法续传，请重新上传）');
  upBusy = true;
  try {
    const r = await resumeUploadCore(id, {
      onRec: (rec) => { $('up-status').textContent = `会话 ${id}：服务端已收 ${rec} 片，重建压缩产物…`; },
      compNote: (done, raw) => { $('up-status').textContent = `重新压缩中 ${done} / ${raw} 字节（恢复续传需先重建压缩产物）…`; },
    });
    $('up-status').textContent = '恢复完成：镜像导入完成。';
    $('proj-fb').textContent = `镜像续传完成（${r.pre ? '原文已是 zstd' : `压缩后 ${r.zsize} 字节`}），可在上方「一键部署」直接发布。`;
  } catch (e) {
    apiFail('恢复上传', e);
    $('up-status').textContent = `恢复中断：${errText(e)}`;
  } finally { upBusy = false; }
}

async function onDbTables() {

const DANGEROUS_SQL = /\b(drop|truncate|delete)\b/i;
async function onDbSql() {
  const t = dbTarget();
  if (!t) return;
  const sql = $('db-sql').value;
  if (!sql.trim()) return showMsg('请输入要执行的 SQL 语句');
  let confirmFlag = false;
  if (DANGEROUS_SQL.test(sql)) {
    if (!confirm('检测到 DROP / TRUNCATE / DELETE 等危险语句，确认要在数据库上执行吗？')) return;
    confirmFlag = true;
  }
  busy($('btn-db-sql'), true, '执行中…');
  dbOut('正在执行…');
  try {
    const j = await api('POST', '/_api/db-sql', { project: t.project, sql, confirm: confirmFlag });
    dbOut(j.out ?? '（无输出）');
    $('db-fb').textContent = '执行完成';
  } catch (e) { $('db-fb').textContent = ''; apiFail('执行 SQL', e); }
  busy($('btn-db-sql'), false);
}

// —— 备份下载：一次性 RSA-3072 对 → 公钥上行 → wasm 解信封 → 下载 ——
/** 生成一次性 RSA-3072 密钥对（优先 WebCrypto；非安全上下文（如局域网 HTTP）回落 wasm 垫片）。 */
async function oneTimeRsaPemPair() {
  if (crypto.subtle) {
    try {
      const kp = await crypto.subtle.generateKey(
        { name: 'RSA-OAEP', modulusLength: 3072, publicExponent: [1, 0, 1], hash: 'SHA-256' },
        true, ['encrypt', 'decrypt']); // extractable：需导出 PEM 交 wasm 解封
      const spki = new Uint8Array(await crypto.subtle.exportKey('spki', kp.publicKey));
      const pkcs8 = new Uint8Array(await crypto.subtle.exportKey('pkcs8', kp.privateKey));
      return { pub: derToPem(spki, 'PUBLIC KEY'), priv: derToPem(pkcs8, 'PRIVATE KEY') };
    } catch { /* 落到 wasm 垫片路径 */ }
  }
  const sid = ex.sr_keygen_rsa();
  if (sid <= 0) throw { error: 'E_NET', msg: `一次性密钥生成失败（${sid}）` };
  return {
    pub: shimCStr((p, c) => ex.sr_rsa_pub_pem(sid, p, c), 1024),    // SPKI
    priv: shimCStr((p, c) => ex.sr_rsa_priv_pem(sid, p, c), 4096),  // PKCS#8
  };
}
function bytesToB64(bytes) {
  let bin = '';
  for (const b of bytes) bin += String.fromCharCode(b);
  return btoa(bin);
}
/** DER → PEM（WebCrypto 只出 DER，需自行包 PEM 头尾）。 */
function derToPem(der, label) {
  const b64 = bytesToB64(der).replace(/(.{64})/g, '$1\n').trim();
  return `-----BEGIN ${label}-----\n${b64}\n-----END ${label}-----\n`;
}
/** 信封流式解封会话（§2）：sr_open_begin + push（分片可任意边界，内部按段缓冲）+ flush + end。
 *  返回 {push(bytes)→明文分段|null, end()}；每段输出立即拷贝脱离 wasm 内存。 */
function openSession(privPem) {
  const [pp, pl] = put(enc.encode(privPem));
  const sid = ex.sr_open_begin(pp, pl);
  unput(pp, pl);
  if (sid <= 0) throw { error: 'E_NET', msg: `解封会话创建失败（${sid}）：私钥 PEM 无效` };
  return {
    push(bytes) {
      const [ip, il] = bytes.length ? put(bytes) : [0, 0];
      let cap = bytes.length + SEG + 64, ob = alloc(cap);
      let w = ex.sr_open_push(sid, ip, il, ob, cap);
      if (w < 0 && w <= -40) { unput(ob, cap); cap = -w; ob = alloc(cap); w = ex.sr_open_push(sid, ip, il, ob, cap); }
      const out = w > 0 ? new Uint8Array(mem().subarray(ob, ob + w)) : null; // 立即拷贝脱离 wasm 内存
      unput(ip, il); unput(ob, cap);
      if (w < 0) throw { error: 'E_NET', msg: `解封失败（${w}）：数据损坏或私钥不匹配` };
      return out;
    },
    end() { ex.sr_open_end(sid); },
  };
}
// —— 备份下载（§10.4 三段式）：begin → status 轮询 → 4MB chunk 边下边解密 → Blob 下载 ——
let dumpBusy = false;
function dbDumpProgress(cur, total, txt) {
  $('db-prog').max = total || 1;
  $('db-prog').value = Math.min(cur, total || 1);
  $('db-prog-txt').textContent = txt;
}
async function onDbDump() {
  const t = dbTarget();
  if (!t) return;
  if (dumpBusy) return showMsg('已有备份任务进行中，请等待完成');
  dumpBusy = true;
  busy($('btn-db-dump'), true, '备份中…');
  dbDumpProgress(0, 1, '正在生成一次性 RSA-3072 密钥…');
  try {
    const pair = await oneTimeRsaPemPair();
    dbDumpProgress(0, 1, '已发起备份（服务端后台 pg_dump 加密导出）…');
    // ① begin：仅公钥上行，立即返回 dump_id
    const j = await api('POST', '/_api/db-dump-begin', { project: t.project, client_pub_pem: pair.pub });
    const dumpId = j.dump_id;
    // ② 轮询 status：1s 间隔，5 分钟上限（failed 即时报错）
    const t0 = Date.now();
    let total = 0;
    for (;;) {
      const st = await api('GET', `/_api/db-dump-status?dump=${encodeURIComponent(dumpId)}`);
      if (st.error) throw { error: 'E_STATE', msg: `服务端备份失败：${st.error}` };
      if (st.ready) { total = Number(st.total) || 0; break; }
      if (Date.now() - t0 > 5 * 60 * 1000) throw { error: 'E_STATE', msg: '备份超时（5 分钟未就绪），请稍后重试' };
      dbDumpProgress(0, 1, `服务端正在导出（已等待 ${Math.round((Date.now() - t0) / 1000)} 秒）…`);
      await sleep(1000);
    }
    // ③ chunk 循环：分片字节一到即推入解封会话（内存占用与分片大小成正比，明文分段累积为 Blob 源）
    const opener = openSession(pair.priv);
    const parts = [];
    let offset = 0;
    try {
      while (offset < total) {
        const len = Math.min(DUMP_CHUNK, total - offset);
        const resp = await apiDo('GET', `/_api/db-dump-chunk?dump=${encodeURIComponent(dumpId)}&offset=${offset}&len=${len}`, null);
        if (!resp.ok) throw await respErr(resp);
        const hTotal = Number(resp.headers?.get?.('X-Sr-Total'));
        if (Number.isFinite(hTotal) && hTotal !== total) throw { error: 'E_STATE', msg: `分片总长不一致（响应头 ${hTotal} ≠ 状态 ${total}）` };
        const buf = new Uint8Array(await resp.arrayBuffer());
        if (!buf.length || offset + buf.length > total) throw { error: 'E_STATE', msg: `分片长度异常（offset=${offset}，收到 ${buf.length} / 总 ${total}）` };
        const out = opener.push(buf);
        if (out) parts.push(out);
        offset += buf.length;
        dbDumpProgress(offset, total, `分片下载中：${offset} / ${total} 字节（第 ${parts.length ? Math.ceil(offset / DUMP_CHUNK) : 0} 片）`);
      }
      const tail = opener.push(new Uint8Array(0)); // len=0 = 流结束：解出尾段
      if (tail) parts.push(tail);
    } finally { opener.end(); }
    const plain = parts.reduce((n, p) => n + p.length, 0);
    const blob = new Blob(parts, { type: 'application/octet-stream' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${t.project}.dump`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    $('db-fb').textContent = `备份已下载：${t.project}.dump（解密后 ${plain} 字节）`;
    dbDumpProgress(total, total, `完成：信封 ${total} 字节（${Math.max(1, Math.ceil(total / DUMP_CHUNK))} 片）→ 解密 ${plain} 字节。`);
    dbOut(`pg_dump -Fc 三段式下载完成：信封 ${total} 字节（${Math.max(1, Math.ceil(total / DUMP_CHUNK))} 片 × ≤4MB）→ 本地解密 ${plain} 字节。`);
  } catch (e) {
    $('db-fb').textContent = '';
    dbDumpProgress(0, 1, '备份失败或中断（可重新发起）');
    apiFail('备份下载', e);
  } finally { dumpBusy = false; busy($('btn-db-dump'), false); }
}
async function onDbRestore() {
  const t = dbTarget();
  if (!t) return;
  const file = $('db-restore-file').files[0];
  if (!file) return showMsg('请先选择要恢复的 .dump 文件（「备份下载」的产物）');
  const pem = platformPem();
  if (!pem.startsWith('-----BEGIN PUBLIC KEY-----')) return showMsg('恢复需先在页首配置平台公钥 PEM（管理员分发的 platform_rsa.pub）');
  if (!confirm(`确认将 ${file.name}（${file.size} 字节）恢复到 ${t.project}？当前数据将被替换。`)) return;
  busy($('btn-db-restore'), true, '恢复中…');
  $('db-fb').textContent = '正在压缩并加密文件…';
  try {
    // 魔数分支：已是 zstd（备份下载产物即服务端 zstd-19 包裹的 -Fc）原样上传；
    // 原生 -Fc / 其他未压缩形态先压缩——服务端按魔数自适应解包，两态都正确。
    const { blob: payload, zstd: pre } = await uploadPayload(file, (done, raw) => {
      $('db-fb').textContent = `压缩中 ${done} / ${raw} 字节（zstd-${ZSTD_LEVEL}）…`;
    });
    const sid = sealBegin(pem, crypto.getRandomValues(new Uint8Array(32)));
    const parts = [];
    const CHUNK2 = 4 * 1024 * 1024;
    for (let o = 0; o < payload.size; o += CHUNK2) {
      const bytes = new Uint8Array(await payload.slice(o, Math.min(o + CHUNK2, payload.size)).arrayBuffer());
      const [w, ob, cap] = pushSlice(sid, bytes);
      parts.push(new Uint8Array(mem().subarray(ob, ob + w))); // 立即拷贝脱离 wasm 内存
      unput(ob, cap);
    }
    { const [w, ob, cap] = pushFlush(sid); parts.push(new Uint8Array(mem().subarray(ob, ob + w))); unput(ob, cap); }
    ex.sr_seal_end(sid);
    const envelope = new Uint8Array(parts.reduce((n, p) => n + p.length, 0));
    { let off = 0; for (const p of parts) { envelope.set(p, off); off += p.length; } }
    $('db-fb').textContent = '正在上传恢复（服务端解密并 pg_restore）…';
    const j = await api('POST',
      `/_api/db-restore?project=${encodeURIComponent(t.project)}&confirm=true`, envelope);
    $('db-fb').textContent = '恢复完成';
    dbOut(j.out || `pg_restore --clean --if-exists 完成：信封 ${envelope.length} 字节（${pre ? `文件已是 zstd（${payload.size} 字节）原样上传` : `压缩后 ${payload.size} / 原文件 ${file.size} 字节`}）。`);
  } catch (e) { $('db-fb').textContent = ''; apiFail('恢复上传', e); }
  busy($('btn-db-restore'), false);
}
async function onDbReset() {
  const t = dbTarget();
  if (!t) return;
  if (!confirm(`确认重置 ${t.project} 的数据库？全部表与数据将被删除并重建（连接凭据不变），不可恢复。`)) return;
  busy($('btn-db-reset'), true, '重置中…');
  dbOut('正在重置…');
  try {
    const j = await api('POST', '/_api/db-reset', { project: t.project, confirm: true });
    $('db-fb').textContent = '重置完成';
    dbOut(j.out || '数据库已删除并重建，凭据保持不变。');
  } catch (e) { $('db-fb').textContent = ''; apiFail('重置数据库', e); }
  busy($('btn-db-reset'), false);
}

// ================ 标签页 3：状态监控 ================
// —— §10.4 日志实时流：ndjson 追加渲染 + 1000 行环形 + 断开 5 秒重连 ——
const LOGS_MAX = 1000;
const logsLive = { ac: null, timer: null, project: null, lines: [], want: true }; // want 与 HTML 默认 checked 一致
const tsCn = (t) => Number.isFinite(t)
  ? new Date(t).toLocaleTimeString('zh-CN', { hour12: false }) : '--:--:--';
function logsRender() {
  $('st-logs').textContent = logsLive.lines.length ? logsLive.lines.join('\n') : '（暂无日志）';
}
function logsAppend(t, l) {
  logsLive.lines.push(`${tsCn(t)} ${l}`); // 每行带服务端时间戳（unix ms → 本地 HH:MM:SS）
  if (logsLive.lines.length > LOGS_MAX) logsLive.lines.splice(0, logsLive.lines.length - LOGS_MAX); // 超帽丢头部
  logsRender();
}
function stopLogsStream(fbText) {
  clearTimeout(logsLive.timer); logsLive.timer = null;
  if (logsLive.ac) { logsLive.ac.abort(); logsLive.ac = null; } // 开关关闭 → AbortController 停流
  if (fbText) $('st-logs-fb').textContent = fbText;
}
async function startLogsStream() {
  if (!logsLive.want || !logsLive.project || logsLive.ac) return;
  const project = logsLive.project;
  logsLive.ac = new AbortController();
  const ac = logsLive.ac;
  $('st-logs-fb').textContent = '已连接（实时跟随中）';
  try {
    await consumeNdjson(`/_api/logs-stream?project=${encodeURIComponent(project)}&tail=100`, (j) => {
      if (j && typeof j.l === 'string') logsAppend(j.t, j.l);
    }, ac.signal);
    if (ac.signal.aborted) return;
    logsLive.ac = null;
    $('st-logs-fb').textContent = '流已结束（容器可能已被删除）'; // 容器 EOF 正常收尾：不再重连
  } catch (e) {
    if (ac.signal.aborted) return; // 主动停止不算断线
    logsLive.ac = null;
    $('st-logs-fb').textContent = `连接断开（${errText(e)}），5 秒后自动重连…`;
    clearTimeout(logsLive.timer);
    logsLive.timer = setTimeout(() => { if (logsLive.want && logsLive.project === project) startLogsStream(); }, 5000);
  }
}
function pickLogs(project) {
  logsLive.project = project;
  logsLive.lines = [];
  logsRender();
  $('st-logs-target').textContent = project;
  stopLogsStream();
  if (logsLive.want) startLogsStream();
  else $('st-logs-fb').textContent = '实时跟随已关闭（勾选后重连）';
}

// —— §10.4 平台事件流：sr- 前缀过滤 + 最近 20 条滚动 + 心跳忽略 + 健康列表去抖刷新 ——
const EV_MAX = 20;
const EV_CN = { start: '启动', stop: '停止', die: '退出', destroy: '销毁',
  'health_status: healthy': '转为健康', 'health_status: unhealthy': '转为不健康', 'health_status: starting': '健康检查中' };
const evLive = { ac: null, timer: null, want: false, rows: [], debounce: null };
function evRender() {
  $('st-events').textContent = evLive.rows.length ? evLive.rows.join('\n') : '（暂无事件）';
}
function evPush(t, e, actor) {
  evLive.rows.push(`${tsCn(t)}  ${EV_CN[e] || e}  ${actor}`); // 时间 + 动作 + 容器名
  if (evLive.rows.length > EV_MAX) evLive.rows.splice(0, evLive.rows.length - EV_MAX);
  evRender();
  if (evLive.debounce) clearTimeout(evLive.debounce); // 事件到达 → 2 秒去抖自动刷新健康列表
  evLive.debounce = setTimeout(() => { evLive.debounce = null; if (state.loggedIn) refreshStatus(); }, 2000);
}
function stopEventsStream() {
  evLive.want = false;
  clearTimeout(evLive.timer); evLive.timer = null;
  if (evLive.debounce) { clearTimeout(evLive.debounce); evLive.debounce = null; }
  if (evLive.ac) { evLive.ac.abort(); evLive.ac = null; }
  $('ev-state').textContent = '未连接（进入本页自动订阅）';
}
async function startEventsStream() {
  if (!evLive.want || evLive.ac || !state.loggedIn) return;
  evLive.ac = new AbortController();
  const ac = evLive.ac;
  $('ev-state').textContent = '已连接';
  try {
    await consumeNdjson('/_api/events', (j) => {
      // 仅展示 sr- 开头的展项容器；心跳（{"hb":true}）与缺字段行静默忽略
      if (j && typeof j.actor === 'string' && j.actor.startsWith('sr-')) evPush(j.t, j.e, j.actor);
    }, ac.signal);
    if (ac.signal.aborted) return;
    reconnectEvents(`流结束`);
  } catch (e) {
    if (ac.signal.aborted) return;
    reconnectEvents(`断开（${errText(e)}）`);
  }
}
function reconnectEvents(why) {
  evLive.ac = null;
  $('ev-state').textContent = `${why}，5 秒后自动重连…`;
  clearTimeout(evLive.timer);
  evLive.timer = setTimeout(() => { if (evLive.want && state.loggedIn) startEventsStream(); }, 5000);
}

function wireStatusTab() {
  $('st-refresh').addEventListener('click', refreshStatus);
  $('st-auto').addEventListener('change', () => {
    clearInterval(stTimer); stTimer = null;
    if ($('st-auto').checked) { refreshStatus(); stTimer = setInterval(refreshStatus, 10000); }
  });
  logsLive.want = $('st-logs-live').checked; // 与勾选框初始状态同步
  $('st-logs-live').addEventListener('change', () => {
    logsLive.want = $('st-logs-live').checked;
    if (logsLive.want && logsLive.project) startLogsStream();
    else if (!logsLive.want) stopLogsStream('已停止实时跟随（勾选后重连）');
  });
  $('st-tbl').addEventListener('click', (ev) => {
    const btn = ev.target.closest('button[data-logs]');
    if (btn) pickLogs(btn.dataset.p);
  });
  // Redis 浏览（§10.3）
  $('rd-refresh').addEventListener('click', refreshRedisKeys);
  $('rd-q').addEventListener('keydown', (ev) => { if (ev.key === 'Enter') { ev.preventDefault(); refreshRedisKeys(); } });
  $('rd-keys').addEventListener('change', onRedisKeyPick);
}
async function refreshStatus() {
  const tb = $('st-tbl').querySelector('tbody');
  tb.innerHTML = '<tr><td colspan="4" class="note">加载中…</td></tr>';
  try {
    const j = await api('GET', '/_api/projects');
    state.projects = j.projects || [];
    tb.innerHTML = state.projects.length ? state.projects.map((p) => `<tr>
      <td class="mono">${esc(p.project)}</td>
      <td class="${statusCls(p.status)}">${esc(statusCn(p.status))}</td>
      <td class="mono">${esc(p.updated)}</td>
      <td><button class="act" data-logs data-p="${esc(p.project)}">查看日志</button></td>
    </tr>`).join('') : '<tr><td colspan="4" class="note">暂无展项</td></tr>';
    $('st-fb').textContent = `已刷新（${new Date().toLocaleTimeString()}）`;
  } catch (e) { tb.innerHTML = ''; apiFail('健康列表刷新', e); }
}

// —— Redis 浏览（SPEC §13.2/13.3：DB 下拉仅列自己的（admin 全量标注「管理员视图」）；错误一律走顶部条）——
let rdDbsLoaded = false;
async function ensureRedisDbs() {
  if (rdDbsLoaded) return;
  try {
    const j = await api('GET', '/_api/redis-dbs'); // 服务端已按用户过滤（§13.2：请求 db ∈ 名下项目集合）
    const dbs = (j.dbs ?? []).map(Number).filter(Number.isInteger);
    if (!dbs.length) {
      $('rd-db').innerHTML = '';
      $('rd-scope').textContent = '';
      $('rd-count').textContent = '您名下暂无可浏览的逻辑库（发布项目后自动分配）';
      return;
    }
    $('rd-db').innerHTML = dbs.map((n) => `<option value="${n}">${n}</option>`).join('');
    const adminView = j.admin_view ?? state.admin; // 服务端标注优先，回退 whoami 结论
    $('rd-scope').textContent = adminView ? '管理员视图' : ''; // §13.2：admin 全量时显式标注
    rdDbsLoaded = true;
  } catch (e) { apiFail('Redis 库编号获取', e); }
}
async function refreshRedisKeys() {
  await ensureRedisDbs();
  if (!rdDbsLoaded) return;
  const db = $('rd-db').value;
  const q = $('rd-q').value.trim();
  $('rd-keys').innerHTML = '<option value="">加载中…</option>';
  try {
    const j = await api('GET', `/_api/redis-keys?db=${encodeURIComponent(db)}&q=${encodeURIComponent(q)}&limit=200`);
    const keys = j.keys || [];
    $('rd-keys').innerHTML = keys.length
      ? keys.map((k) => `<option value="${esc(k)}">${esc(k)}</option>`).join('')
      : '<option value="">（无匹配 key）</option>';
    $('rd-count').textContent = `共 ${keys.length} 个 key（可能截断）`;
    $('rd-meta').textContent = '（点击左侧 key 查看类型 / 剩余生存时间 / 值）';
    $('rd-val').textContent = '（未选择 key）';
  } catch (e) {
    $('rd-keys').innerHTML = ''; $('rd-count').textContent = '';
    apiFail('Redis key 列表获取', e);
  }
}
async function onRedisKeyPick() {
  const key = $('rd-keys').value;
  if (!key) return;
  const db = $('rd-db').value;
  $('rd-meta').textContent = `${key}：读取中…`;
  try {
    const j = await api('GET', `/_api/redis-get?db=${encodeURIComponent(db)}&key=${encodeURIComponent(key)}`);
    const ttl = Number(j.ttl_ms ?? j.ttl); // 服务端字段 ttl_ms（PTTL 毫秒；-1=永久）
    const ttlCn = Number.isFinite(ttl) ? (ttl === -1 ? '永久（-1）' : `${ttl} ms`) : '未知';
    let v = j.value;
    if (Array.isArray(v)) v = v.join('\n');
    else if (v != null && typeof v !== 'string') v = JSON.stringify(v, null, 2);
    else v = v ?? '';
    const cut = v.length >= 4096; // 服务端按 4KB 截断：达到阈值即提示
    $('rd-meta').textContent = `${key} · 类型 ${j.type ?? '未知'} · 剩余生存 ${ttlCn}${cut ? ' · 值已截断（≥4KB）' : ''}`;
    $('rd-val').textContent = v === '' ? '（空值）' : v;
  } catch (e) { $('rd-meta').textContent = ''; apiFail('Redis 值读取', e); }
}

// —— 初始化（SPEC §10.1）：本机已有「账号+种子」→ 直达第 3 步自测；否则从第 1 步走完整向导 ——
state.owner = localStorage.getItem('sr.owner') || '';
loadSeed();
$('wz-owner').value = state.owner;
if (state.seed && NAME_RE.test(state.owner)) enterStep3(true);
else gotoStep(1);
</script>
