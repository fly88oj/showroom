<!doctype html>
<html lang="zh-CN">
<head>
<link rel="icon" href="data:,">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#12141a">
<title>Showroom 控制台</title>
<style>
  html { color-scheme: dark; scroll-padding-top: 116px; }
  * { box-sizing: border-box; }
  /* —— 设计 token：间距 / 圆角 / 边框 / 配色（全站唯一定义处） —— */
  :root {
    --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-6: 24px; --sp-8: 32px;
    --r: 8px;         /* 圆角 */
    --bd: #2a2f39;    /* 边框色 */
    --bg-card: #1a1e25; --bg-page: #12141a;
    --fg: #d7dae0; --fg-dim: #8b92a0; --fg-head: #6fa8dc;
    --bg-input: #12141a; --bd-input: #343b47;
    --accent: #2b3d55; --accent-hi: #35507a; --accent-bd: #3d5578;
    --ok: #7fd88f; --bad: #ff9aa5; --warn: #e8c37f; --focus: #79b8ff;
    --control-h: 32px; /* 视觉QA P1-4：统一控件高度（输入框/下拉/主按钮/文件按钮同一基线）；行内小按钮 .act 不受限 */
    --fg-bright: #e7edf5;   /* 实底按钮/选中态文字 */
    --ok-bg: #21362a; --ok-bd: #3a6b4c; --ok-fg: #a9e8b8;     /* 成功条/内联反馈 */
    --bad-bg: #3a2226; --bad-bd: #6b3a42; --bad-fg: #ffb3bd;  /* 错误条 */
    --warn-bg: #3a3222; --warn-bd: #6b5f3a;                   /* 警示黄条 */
    --danger-bg: #5a2b2b; --danger-bd: #7a3d3d; --danger-hi: #6d3535; /* 危险按钮（C1：hover 保持红色系） */
  }
  body {
    margin: 0; padding: 0 1rem 3rem; background: var(--bg-page); color: var(--fg);
    font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 14px; line-height: 1.6;
    touch-action: manipulation;
  }
  /* —— 字号刻度：页面标题 18 / 卡片标题 14 semibold / 正文与控件 14 / 辅助 12 dim / 等宽 12 —— */
  h1 { font-size: 18px; font-weight: 700; margin: 0; color: var(--fg); }
  h2 { font-size: 14px; font-weight: 600; margin: 0 0 var(--sp-3); color: var(--fg-head); } /* plan-17 §7 卡片题；第1轮UI审查P3：15px→14px 与正文/控件同级（原 h2 { font-size: 15px; font-weight: 600; }） */
  h3 { font-size: 14px; font-weight: 600; margin: 28px 0 10px; color: var(--fg); }
  /* 视觉QA P0-1：帮助页区块标题（h2）与其他页 H3 区块同为 28px 上距——全局 h2 margin-top:0 在此页造成间距倒挂 */
  #tab-help h2 { margin-top: 28px; }
  /* 视觉QA P1-1：分组/区块题（镜像分片上传、操作输出等）与卡片题（h2）同色 --fg-head，消除 rogue 色 */
  .fs > h3, #tab-db > h3 { color: var(--fg-head); }
  .mono { font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 12px; font-variant-numeric: tabular-nums; }
  .note { color: var(--fg-dim); font-size: 12px; margin: var(--sp-1) 0 0; }
  /* —— 三层层级：顶栏（sticky）/ 标签栏（sticky）/ 内容区（1200px 居中卡片） —— */
  .topbar { position: sticky; top: 0; z-index: 30; background: var(--bg-page); border-bottom: 1px solid var(--bd); }
  .chrome {
    max-width: 1200px; margin: 0 auto; min-height: 52px; padding: var(--sp-2) 0;
    display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; min-width: 0; }
  .user-badge {
    display: inline-flex; align-items: center; gap: var(--sp-1);
    background: var(--bg-card); border: 1px solid var(--bd); border-radius: 999px;
    padding: 0 var(--sp-2); font-size: 12px; color: var(--fg-dim);
  }
  .admin-mark { color: var(--warn); border: 1px solid var(--warn); border-radius: 999px; font-size: 10px; line-height: 1.4; padding: 0 var(--sp-1); }
  .chrome-actions { display: flex; gap: var(--sp-2); flex-wrap: wrap; }
  .srv { color: var(--fg-dim); font-size: 12px; }
  /* 标签页导航（role=tablist/tab/tabpanel + aria-selected 同步）：当前标签实底高亮 */
  #tabs {
    position: sticky; top: 52px; z-index: 29; background: var(--bg-page); border-bottom: 1px solid var(--bd);
    display: flex; gap: var(--sp-2); flex-wrap: wrap; align-items: center;
    padding: var(--sp-2) max(0px, calc((100% - 1200px) / 2));
  }
  #tabs button { background: var(--bg-card); border-color: var(--bd); color: var(--fg-dim); }
  #tabs button.on, #tabs button[aria-selected="true"] { background: var(--accent); border-color: var(--accent-bd); color: var(--fg-bright); }
  /* C5：导航 tab hover 反馈（背景/文字/边框微变；不影响当前选中态） */
  #tabs button:not(.on):hover { background: var(--bg-input); border-color: var(--accent-bd); color: var(--fg); }
  /* —— 内容卡片：全部 section/fieldset 统一卡面 —— */
  section {
    background: var(--bg-card); border: 1px solid var(--bd); border-radius: var(--r);
    padding: var(--sp-4); max-width: 1200px; margin: var(--sp-4) auto var(--sp-6);
  }
  /* plan-17 §7 层级封顶：卡片内禁嵌 fieldset——分组一律 .fs + h3 */
  .fs { border-top: 1px dashed var(--bd); margin: 28px 0 0; padding: 0; min-width: 0; }
  .fs > h3 { margin: 10px 0 10px; }
  #login { max-width: 560px; margin-top: var(--sp-8); }
  /* —— 表单：label 上、控件下；间距走 token —— */
  .row { display: flex; flex-wrap: wrap; gap: var(--sp-2); align-items: center; margin-top: var(--sp-2); }
  /* 视觉QA P2-8：按钮与「label 上、控件下」的字段同行时底对齐——按钮与输入框同一基线（不支持 :has 的旧浏览器回落居中） */
  .row:has(> .field) { align-items: flex-end; }
  .rd-panes:has(> .field) { align-items: stretch; } /* Redis 双栏等高优先于底对齐 */
  .field .row, .grid .row { margin-top: 0; }
  .field { display: flex; flex-direction: column; gap: var(--sp-1); min-width: 0; }
  .field > span { color: var(--fg-dim); font-size: 13px; margin-bottom: var(--sp-1); } /* §7：label/辅助 13 */
  /* 视觉QA P1-4：单行控件统一 --control-h（32px）——输入/下拉与按钮同高同基线；textarea 与多行 listbox 不受限 */
  input[type=text], input[type=password], input[type=number], select {
    width: 100%; background: var(--bg-input); color: var(--fg); border: 1px solid var(--bd-input);
    border-radius: 4px; padding: 0 10px; height: var(--control-h); line-height: calc(var(--control-h) - 2px);
    margin-bottom: var(--sp-2); font: inherit; max-width: 100%; min-width: 0;
  }
  textarea, input[type=file] {
    width: 100%; background: var(--bg-input); color: var(--fg); border: 1px solid var(--bd-input);
    border-radius: 4px; padding: 6px 10px; margin-bottom: var(--sp-2); font: inherit; max-width: 100%; min-width: 0;
  }
  :is(.row, .field, .grid) :is(input[type=text], input[type=password], input[type=number], input[type=file], textarea, select) { margin-bottom: 0; }
  .row > :is(input[type=text], input[type=password], input[type=number], select) { width: auto; flex: 1 1 auto; }
  select option { background: var(--bg-input); color: var(--fg); } /* 显式配色（下拉展开项） */
  select[size] { line-height: 1.6; } /* 多行 listbox 行距复位（单行控件的居中 line-height 不适用列表项） */
  ::placeholder { color: var(--fg-dim); opacity: 1; } /* 深色底下原生占位符过暗 */
  input[type=file]::file-selector-button { /* 原生选择按钮收编 token（否则浅灰刺眼） */
    background: var(--accent); color: var(--fg-bright); border: 1px solid var(--accent-bd);
    border-radius: 4px; padding: 4px 10px; margin-right: var(--sp-2); font: inherit; cursor: pointer;
  }
  input[type=file]::file-selector-button:hover { background: var(--accent-hi); }
  /* 视觉QA P1-5：文件选择汉化——隐藏原生控件（UA 英文「Choose File」不可译），label 触发 + 中文按钮/占位 */
  input.file-hidden { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }
  label.file-btn {
    display: inline-flex; align-items: center; height: var(--control-h); padding: 0 12px; white-space: nowrap;
    background: var(--accent); color: var(--fg-bright); border: 1px solid var(--accent-bd); border-radius: 4px;
    font-size: 14px; cursor: pointer;
  }
  label.file-btn:hover { background: var(--accent-hi); }
  input[type=checkbox], input[type=radio] { accent-color: var(--focus); }
  textarea { min-height: 3.2em; font-family: ui-monospace, monospace; font-size: 12px; }
  button {
    background: var(--accent); color: var(--fg-bright); border: 1px solid var(--accent-bd); border-radius: 4px;
    height: var(--control-h); padding: 0 12px; line-height: 1; font: inherit; font-size: 14px; cursor: pointer; touch-action: manipulation;
    transition: background-color .15s ease, border-color .15s ease;
  }
  button:hover:not(:disabled) { background: var(--accent-hi); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.danger { background: var(--danger-bg); border-color: var(--danger-bd); }
  /* C1：danger hover 保持红色系——button:hover:not(:disabled) 同优先级且按序覆盖（原被通用 hover 压成蓝色） */
  button.danger:hover:not(:disabled) { background: var(--danger-hi); border-color: var(--danger-bd); color: var(--bad-fg); }
  /* 可见焦点（全控件；不移除 outline） */
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  /* —— 间距工具类（HTML 不再写内联 style） —— */
  .mt-1 { margin-top: var(--sp-1); } .mt-2 { margin-top: var(--sp-2); }
  .mt-3 { margin-top: var(--sp-3); } .mt-4 { margin-top: var(--sp-4); } .mt-6 { margin-top: var(--sp-6); }
  .m-0 { margin: 0; } .nowrap { white-space: nowrap; }
  .row .fb, .row .note { margin: 0; }
  .combo { flex-wrap: nowrap; }
  .note-warn { color: var(--warn); }
  .help-list { margin: var(--sp-1) 0 0; padding-left: 1.2rem; }
  .expert-fold { margin-top: var(--sp-4); border-top: 1px dashed var(--bd); padding-top: var(--sp-2); }
  .hidden { display: none; }
  /* —— 表格与滚动容器 —— */
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  /* 视觉QA P1-2：th/td 统一 0 8px 内距与左对齐（列头/数据同轴，消除 20px 偏移）；数值/时间列 .num 右对齐 */
  th, td { text-align: left; padding: 0 8px; border-bottom: 1px solid var(--bd); white-space: nowrap; }
  .num, th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; } /* §7：时间/数字右对齐等宽 */
  th { color: var(--fg-dim); font-size: 12px; font-weight: 600; position: sticky; top: 0; background: var(--bg-card); }
  /* 视觉QA P2-1：行内按钮/链接统一 variant——描边次要样式（表格动作、菜单项、警示条内「设置」与「打开」链接同款） */
  .act {
    display: inline-block; height: auto; padding: 3px 8px; font-size: 12px; line-height: 1.4;
    background: var(--bg-input); color: var(--fg); border: 1px solid var(--bd-input); border-radius: 4px;
    cursor: pointer;
  }
  .act:not(.danger):hover:not(:disabled) { background: var(--accent); border-color: var(--accent-bd); color: var(--fg-bright); }
  a.act { text-decoration: none; }
  td .act { margin-right: var(--sp-1); }
  td.wrap { white-space: normal; overflow-wrap: break-word; word-break: normal; } /* break-word：长串可断但不硬折单词 */
  /* 第1轮UI审查P2：环境变量模态列宽——键 30% / 当前值 40% / 用途 30%（fixed 布局锁定比例；单元格可换行，中文用途说明横排折行不挤列） */
  #env-tbl { table-layout: fixed; }
  #env-tbl th, #env-tbl td { white-space: normal; overflow-wrap: break-word; word-break: normal; }
  #env-tbl th:nth-child(1), #env-tbl td:nth-child(1) { width: 30%; }
  #env-tbl th:nth-child(2), #env-tbl td:nth-child(2) { width: 40%; }
  #env-tbl th:nth-child(3), #env-tbl td:nth-child(3) { width: 30%; }
  /* 第1轮UI审查P2：工具下载表——说明列（第2列）换行收窄，「大小/下载」列锁定宽度完整显示（容器 .tbl-wrap overflow:auto 兜底横滚） */
  #tool-tbl { table-layout: fixed; }
  #tool-tbl td { white-space: normal; overflow-wrap: break-word; word-break: normal; }
  #tool-tbl td:nth-child(3), #tool-tbl td:nth-child(4) { white-space: nowrap; }
  #tool-tbl th:nth-child(1), #tool-tbl td:nth-child(1) { width: 20%; }
  #tool-tbl th:nth-child(2), #tool-tbl td:nth-child(2) { width: 52%; }
  #tool-tbl th:nth-child(3), #tool-tbl td:nth-child(3) { width: 12%; }
  #tool-tbl th:nth-child(4), #tool-tbl td:nth-child(4) { width: 16%; }
  /* 第1轮UI审查P2：非本人项目操作区——灰色文字标签（替代对他人项目必然 E_AUTH 失败的无效按钮） */
  .not-mine { color: var(--fg-dim); font-size: 12px; }
  .tbl-wrap { overflow: auto; max-height: 60vh; border: 1px solid var(--bd); border-radius: var(--r); }
  .tbl-low { max-height: 22vh; } .tbl-mid { max-height: 26vh; }
  /* 展项表页面级滚动：取消容器裁剪——行内「更多 ▾」菜单（absolute）不再被 overflow 截断 */
  .tbl-page { overflow: visible; max-height: none; }
  .tbl-page th { position: static; }
  /* B3：移动端展项表溢出——窄视口表格内横向滚动（外层页面不出横滚条）；≥900px 表格自然放得下，保持 visible 不裁剪「更多 ▾」菜单 */
  .tbl-xwrap { min-width: 0; }
  @media (max-width: 900px) { .tbl-xwrap { overflow-x: auto; } }
  #proj-tbl td.wrap { overflow-wrap: anywhere; } /* B3：URL 列长串可断行 */
  .grid { display: flex; flex-wrap: wrap; gap: var(--sp-4); align-items: flex-end; } /* 不限 form：数据页/管理页 grid 同样横排（原 form .grid 使非表单区竖排堆叠） */
  .grid > .grow { flex: 1 1 20em; min-width: 0; } /* 横排后 field 收缩到 min-content 的字段（如数据页项目名）撑开 */
  /* 滚动容器不外溢滚动链 */
  .tbl-wrap, pre.out, dialog pre, textarea, select[size] { overscroll-behavior: contain; }
  /* 视觉QA P2-2：顶部条/警示条共享 alert 基类规格（同 padding/圆角） */
  #msg {
    max-width: 1200px; margin: var(--sp-4) auto 0; padding: var(--sp-2) var(--sp-3); border-radius: var(--r);
    display: none; font-size: 13px; white-space: pre-wrap; word-break: break-all;
  }
  #msg.err { display: block; background: var(--bad-bg); border: 1px solid var(--bad-bd); color: var(--bad-fg); }
  #msg.ok { display: block; background: var(--ok-bg); border: 1px solid var(--ok-bd); color: var(--ok-fg); }
  dialog {
    background: var(--bg-card); color: var(--fg); border: 1px solid var(--accent-bd); border-radius: var(--r);
    padding: var(--sp-4); max-width: 80vw; width: 720px;
  }
  dialog::backdrop { background: rgba(0,0,0,.55); }
  .dlg-head { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); margin: 0 0 var(--sp-3); }
  .dlg-head h2 { margin: 0; }
  dialog pre, pre.out {
    background: var(--bg-input); border: 1px solid var(--bd); border-radius: 6px; padding: var(--sp-2);
    max-height: 50vh; overflow: auto; white-space: pre-wrap; word-break: break-all; font-size: 12px;
  }
  progress { -webkit-appearance: none; appearance: none; width: 100%; height: 14px;
    background: var(--bg-input); border: 1px solid var(--bd); border-radius: 3px; } /* UA 白灰进度条刺眼，token 化 */
  progress::-webkit-progress-bar { background: var(--bg-input); border-radius: 3px; }
  progress::-webkit-progress-value { background: var(--accent-hi); border-radius: 3px; transition: width .15s ease; }
  progress::-moz-progress-bar { background: var(--accent-hi); border-radius: 3px; }
  .status-ok { color: var(--ok); } .status-bad { color: var(--bad); } .status-mid { color: var(--warn); }
  /* plan-17 §4：7 态状态机——待部署=灰（仅镜像无容器）；重建中=呼吸（reduced-motion 时静止） */
  .st-wait { color: var(--fg-dim); }
  .st-breath { animation: st-pulse 1.6s ease-in-out infinite; }
  @keyframes st-pulse { 50% { opacity: .4; } }
  /* §12.1 一键部署状态条：四段步骤 / 失败标红 / 完成大字 URL；§12.2 管理标签 */
  .wz-step.done { background: var(--ok-bg); border-color: var(--ok-bd); color: var(--ok-fg); }
  .wz-step.err { background: var(--bad-bg); border-color: var(--bad-bd); color: var(--bad-fg); }
  .wz-step.skip { opacity: .45; }
  #dp-bar.err #dp-text { color: var(--bad); }
  .dp-url { font-size: 20px; font-weight: 700; color: var(--ok); word-break: break-all; }
  .ad-user-row td { background: var(--bg-input); border-bottom: 1px solid var(--bd-input); }
  a { color: var(--focus); }
  .pub { color: var(--ok); word-break: break-all; font-size: 16px; letter-spacing: .4px; user-select: all; }
  /* 行内反馈（操作后就近显示，错误另走顶部条） */
  .fb { font-size: 12px; color: var(--ok-fg); min-height: 1.2em; margin: var(--sp-1) 0 0; }
  .fb.warn { color: var(--warn); }
  .sep { border-top: 1px dashed var(--bd); margin: var(--sp-6) 0 var(--sp-3); } /* C8：数据页区块间 ≥24px（与 .fs 的 28px 上距同层级；标题仍紧贴内容） */
  dl.help dt { color: var(--fg-head); font-weight: 600; margin-top: var(--sp-2); }
  dl.help dd { margin: 0 0 0 1rem; color: var(--fg-dim); }
  /* 字段级内联错误（首错聚焦；API 错误另走顶部条） */
  .ferr { color: var(--bad); font-size: 12px; margin: var(--sp-1) 0 0; min-height: 0; }
  /* §13.1 三入口并存提示徽记 */
  .badge { color: var(--fg-dim); font-size: 12px; border: 1px dashed var(--bd); border-radius: 999px; padding: 0 var(--sp-2); }
  /* §15 主机编排：黄条（漂移/池余量提示）与红条（error 级漂移/受影响项目警示） */
  /* 视觉QA P2-2：警示条与顶部条同基类规格（padding/圆角一致） */
  .warnbar { background: var(--warn-bg); border: 1px solid var(--warn-bd); color: var(--warn); border-radius: var(--r); padding: var(--sp-2) var(--sp-3); font-size: 13px; }
  .warnbar.err { background: var(--bad-bg); border-color: var(--bad-bd); color: var(--bad-fg); }
  .warnbar .act { min-height: 25px; } /* C6：警示条内嵌「设置」按钮与行内按钮同档 25px */
  /* 登录向导（§10.1）：步骤条 + 三步面板 */
  .wz-step {
    color: var(--fg-dim); font-size: 12px; padding: .1rem .6rem;
    border: 1px solid var(--bd); border-radius: 999px; background: var(--bg-card);
  }
  .wz-step.on { background: var(--accent); border-color: var(--accent-bd); color: var(--fg-bright); }
  /* B6：原登录向导 .wz-pane/#wz-key-choices/#lg-expert 样式随专家路径折叠一并移除 */
  details > summary { cursor: pointer; color: var(--fg-head); }
  /* 状态监控 */
  #st-events { min-height: 3em; max-height: 9em; }
  #st-logs { min-height: 10em; }
  /* plan-17 S2：行抽屉（日志跟随）——插在展项行后，data-drawer 标注所属项目 */
  .drawer-row > td { background: var(--bg-input); }
  /* plan-17 S6：卡片副题「已加载 N 项 · HH:MM:SS」——整段可点重取（无手动刷新按钮） */
  .sub { background: none; border: none; color: var(--fg-dim); font-size: 12px; font-weight: 400; padding: 2px 6px; height: auto; line-height: inherit; cursor: pointer; }
  .sub:hover { color: var(--fg); background: var(--bg-input); text-decoration: underline; } /* C5：hover 下划线强化可点性 */
  /* plan-17 S4：行内「更多 ▾」菜单（回滚/环境变量/数据/删除） */
  .more-wrap { position: relative; display: inline-block; }
  .more-wrap .menu {
    position: absolute; right: 0; top: calc(100% + 2px); z-index: 20;
    display: flex; flex-direction: column; gap: var(--sp-1); min-width: 10em;
    background: var(--bg-card); border: 1px solid var(--accent-bd); border-radius: var(--r);
    padding: var(--sp-2); box-shadow: 0 4px 16px rgba(0,0,0,.4);
  }
  .more-wrap .menu.hidden { display: none; } /* 双类优先级：显式压过 .more-wrap .menu 的 flex（否则菜单常开遮挡下方行） */
  /* Redis 浏览：左右两栏滚动容器统一高度 */
  /* 视觉QA P2-10：双栏同为 flex column（label 栏与值面板同构对齐），顶对齐等高 */
  .rd-panes { display: flex; align-items: stretch; gap: var(--sp-4); }
  .rd-panes > .field, .rd-panes > label.field { display: flex; flex-direction: column; }
  .rd-keys-pane { flex: 0 0 300px; }
  .rd-val-pane { flex: 1; min-width: 0; }
  #rd-keys, #rd-val { height: min(24rem, 48vh); }
  /* 视觉QA P1-7：镜像页「等待上传」→ 帮助文字间距（原 2px 过紧） */
  #up-help { margin-top: 10px; }
  /* C5：展项表行 hover 背景微变（抽屉行除外） */
  #proj-tbl tbody tr:not(.drawer-row):hover > td { background: rgba(231, 237, 245, .045); }
  /* C7：长说明段折叠（与发布页「高级说明」同款 details/summary；summary 弱化为辅助色） */
  details.fold { margin-top: var(--sp-2); }
  details.fold > summary { font-size: 12px; color: var(--fg-dim); }
  details.fold[open] > summary { margin-bottom: var(--sp-2); }
  /* D4：发布页 radio 组行与同行输入框同高（label 基线对齐） */
  .radio-row { min-height: var(--control-h); align-items: center; }
  /* D3：项目名输入与其余输入框同字号 14px */
  #pub-project { font-size: 14px; }
  @media (max-width: 900px) { .srv { display: none; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>

<div id="msg" role="alert" aria-live="polite"></div>

<!-- ———— 登录（plan-16 §3：一步「账号+密码」；密钥生成/绑定/签名全程后台无感，用户不见
       seed/公钥串；签名自测通过前只渲染本区块，不渲染任何管理 UI） ———— -->
<section id="login">
  <h1>Showroom 控制台</h1>
  <p class="note">服务器（同源代理，签名调用）：<span class="mono" id="lg-srv"></span></p>

  <!-- 主路径：一步登录（OPAQUE → 绑定本机钥匙 → 进入控制台，plan-16 §2.2 报文序列） -->
  <form id="lg-form" class="mt-3">
    <label class="field" for="lg-user"><span>账号（发布者账号）</span>
      <input type="text" id="lg-user" placeholder="如 alice…" size="14" pattern="[a-z0-9][a-z0-9\-]{0,30}" autocomplete="username" aria-describedby="lg-user-err"></label>
    <p class="ferr" id="lg-user-err" aria-live="polite"></p>
    <label class="field mt-2" for="lg-pass"><span>密码（管理员发放；与 docker push 推送镜像用的镜像库密码是两把不同密码）</span>
      <input type="password" id="lg-pass" placeholder="输入账号密码…" size="14" autocomplete="current-password" aria-describedby="lg-pass-err"></label>
    <p class="ferr" id="lg-pass-err" aria-live="polite"></p>
    <div class="row">
      <button type="submit" id="lg-submit">登录</button>
      <button type="button" id="lg-reenter" class="hidden" title="本机钥匙自测通过即可免密码进入">免密码进入</button>
      <span class="fb" id="lg-fb" aria-live="polite"></span>
    </div>
  </form>
  <p class="note">新设备 / 换浏览器：直接输入账号密码登录即可自动绑定本设备（无需迁移密钥）；忘记密码请联系管理员重置。
    本设备登录钥匙由控制台自动生成并保管于浏览器 localStorage（属试验性存储，清除浏览器数据后重新密码登录即可），全程无需人工干预。</p>
  </section>

<!-- ———— 管理壳（模板：惰性，登录成功后才克隆进文档流；SPEC §3「登录成功前不加载管理资源」） ———— -->
<template id="app-tpl">
  <!-- 三层层级·第一层：顶栏（sticky）——品牌 + 账号徽标（管理员角标）+ 服务器地址 | 平台公钥/修改密码/退出 -->
  <header class="topbar">
    <div class="chrome">
      <div class="brand">
        <h1>Showroom 控制台</h1>
        <span class="user-badge"><span class="mono" id="hd-user"></span><span class="admin-mark hidden" id="hd-admin" title="管理员钥匙">管</span></span>
        <span class="badge" id="hd-role" title="当前钥匙的角色（whoami 判定；未回=?)">?</span>
        <span class="srv">服务器 <span class="mono" id="hd-srv"></span></span>
      </div>
      <div class="chrome-actions">
        <button id="btn-new-pub" title="发布新 Demo（跳转发布页）">+ 发布</button>
        <button id="btn-settings" title="对外访问域名 / 平台公钥 PEM / 修改密码">设置</button>
        <button id="btn-logout">退出登录</button>
      </div>
    </div>
  </header>
  <!-- 三层层级·第二层：标签栏（sticky，顶栏正下方）；当前标签实底高亮 -->
  <nav id="tabs" role="tablist" aria-label="控制台功能分区">
    <button data-tab="proj" class="on" role="tab" id="tabbtn-proj" aria-selected="true" aria-controls="tab-proj">我的展项</button>
    <button data-tab="pub" role="tab" id="tabbtn-pub" aria-selected="false" aria-controls="tab-pub">发布</button>
    <button data-tab="img" role="tab" id="tabbtn-img" aria-selected="false" aria-controls="tab-img">镜像库</button>
    <button data-tab="db" role="tab" id="tabbtn-db" aria-selected="false" aria-controls="tab-db">数据</button>
    <button data-tab="help" role="tab" id="tabbtn-help" aria-selected="false" aria-controls="tab-help">帮助</button>
  </nav>
  <!-- 三层层级·第三层：内容区（1200px 居中功能卡片） -->

  <!-- 设置（plan-17 §0-4/§6）：对外访问域名 + 平台公钥 PEM 收纳（whoami platform_pem 自动取+缓存到
       sr.pempub，此处手工粘贴兜底）+ 改密/忘记设备入口聚合；页首不再常驻 PEM -->
  <dialog id="dlg-settings" aria-labelledby="dlg-settings-title">
    <div class="dlg-head">
      <h2 id="dlg-settings-title">设置</h2>
      <button type="button" id="dlg-settings-close">关闭</button>
    </div>
    <label class="field" for="set-base"><span>对外访问域名（展项列表与完成页主链接用它拼接，如 <span class="mono">http://106.55.224.229:10100</span>；留空用当前访问地址）</span>
      <input type="text" id="set-base" class="mono" placeholder="http://…:…"></label>
    <p class="ferr" id="set-base-err" aria-live="polite"></p>
    <label class="field mt-3" for="hd-pempub"><span>平台公钥 PEM（管理员分发的 <span class="mono">platform_rsa.pub</span>；镜像上传与数据库恢复的加密信封公钥。whoami 已自动带回时无需粘贴，此处仅兜底）</span>
      <textarea id="hd-pempub" class="mono" rows="9" placeholder="-----BEGIN PUBLIC KEY-----&#10;…&#10;-----END PUBLIC KEY-----…"></textarea>
    </label>
    <div class="row">
      <button type="button" id="pempub-copy">复制 PEM</button>
    </div>
    <div class="sep"></div>
    <div class="row">
      <button type="button" id="btn-pwchange" title="当前密码校验后替换为新密码（OPAQUE，密码不明文上线）">修改密码…</button>
    </div>
  </dialog>

  <!-- ———— 标签页 1：展项管理 ———— -->
  <section id="tab-proj" role="tabpanel" aria-labelledby="tabbtn-proj">
    <h2>展项列表 <span id="proj-scope" class="badge"></span></h2>
    <div class="warnbar hidden" id="proj-base-note">正在用内网地址展示 URL：可在<button type="button" id="btn-base-note-settings" class="act">设置</button>中配置「对外访问域名」（公网域名）。</div>
    <div class="row">
      <button type="button" id="proj-fb" class="sub" title="点击重新加载展项列表（自动加载；事件到达亦自动刷新）" aria-label="刷新展项列表"></button>
    </div>
    <div class="tbl-wrap tbl-page">
      <div class="tbl-xwrap"><!-- B3：窄视口横向滚动容器 -->
      <table id="proj-tbl">
        <thead><tr>
          <th>名称</th><th>状态</th><th>对外 URL</th><th>标签</th><th class="num">更新</th><th>操作</th><th>详情</th>
        </tr></thead>
        <tbody><tr><td colspan="7" class="note">正在加载…</td></tr></tbody>
      </table>
      </div>
    </div>
    <p class="note">仅展示对外可见信息；主机端口等内部细节不在此显示。删除会一并移除容器/路由/数据库与凭据。</p>
  </section>

  <!-- ———— 标签页 2：发布（plan-17 §5：全站唯一参数输入处） ———— -->
  <section id="tab-pub" class="hidden" role="tabpanel" aria-labelledby="tabbtn-pub">
    <!-- plan-17 §5：发布表单=全站唯一参数输入处。单表单双镜像源：tar→压缩+分片上传+发布；镜像库→①②skip 直接发布 -->
    <h2>发布新版本</h2>
    <form id="pub-form">
      <div class="grid">
        <label class="field" for="pub-project"><span>项目（留空自动生成随机 8 位名；也可手输或点「换一个」/从已有项目选择）</span>
          <span class="row combo">
            <input type="text" id="pub-project" list="dl-projects" size="12" pattern="[a-zA-Z0-9][a-zA-Z0-9-]{0,30}" aria-describedby="pub-project-err">
            <button type="button" id="pub-shuffle" title="重新生成随机项目名">换一个</button>
          </span></label>
      </div>
      <!-- 视觉QA P1-3：镜像源 radio 与其余字段同列栅格（原独立成行脱离列轴，左移 90px） -->
      <div class="grid mt-2">
        <div class="field" role="radiogroup" aria-label="镜像源"><span>镜像源</span>
          <span class="row radio-row">
            <label class="row" for="pub-src-tar"><input type="radio" name="pub-src" id="pub-src-tar" checked>本地 tar 文件</label>
            <label class="row" for="pub-src-registry"><input type="radio" name="pub-src" id="pub-src-registry">镜像库（已入库镜像）</label>
          </span>
        </div>
        <span class="field" id="pub-src-file-box">
          <span>镜像 tar 文件（不选则直接发布，要求镜像已入镜像库；选择后自动压缩并分片上传再发布）</span>
          <span class="row combo">
            <input type="file" id="pub-file" class="file-hidden" aria-describedby="pub-file-err">
            <label for="pub-file" class="file-btn">选择文件</label>
            <span class="note">未选择文件</span>
          </span>
        </span>
        <span class="field hidden" id="pub-src-reg-box">
          <label class="field" for="dep-image"><span>镜像（从已上传的镜像中选择：输入前缀过滤，自动加载）</span>
            <input type="text" id="dep-image" list="dl-images" size="34" class="mono" placeholder="输入前缀过滤，如 alice/demo:…" aria-describedby="dep-image-err"></label>
          <span class="fb" id="dep-images-fb" aria-live="polite"></span>
        </span>
        <label class="field" for="pub-tag"><span>镜像标签（必填；选镜像后自动带出）</span>
          <input type="text" id="pub-tag" required size="10" aria-describedby="pub-tag-err"></label>
        <label class="field" for="pub-mem"><span>内存需求（MiB）</span>
          <input type="text" id="pub-mem" value="256" list="dl-mem" size="6" placeholder="单位 MiB，如 256…"></label>
        <label class="field" for="pub-cport"><span>演示服务端口（容器内）</span>
          <input type="number" id="pub-cport" value="8080" min="1" max="65535" size="5"></label>
        <!-- 视觉QA P2-3：「发布」「仅上传」同一行排列（row 包组，不再随栅格换行分离） -->
        <span class="row" id="pub-actions">
          <button type="submit" id="pub-submit">发布</button>
          <button type="button" id="btn-upload-only" title="同一 tar：只压缩上传入库，不部署；稍后到本页选「镜像库」源发布">仅上传</button>
        </span>
      </div>
      <!-- 第1轮UI审查P1：空间条在发布页可见（镜像 tar 上传发生在本页；与镜像库页 #space-note 同数据同刷新） -->
      <p class="note mt-2" id="pub-space-note" aria-live="polite">可用空间（已扣预留）：…</p>
      <p class="note hidden" id="pub-pref-note" aria-live="polite"></p>
      <p class="ferr" id="pub-project-err" aria-live="polite"></p>
      <p class="ferr" id="pub-tag-err" aria-live="polite"></p>
      <p class="ferr" id="pub-file-err" aria-live="polite"></p>
      <p class="ferr" id="dep-image-err" aria-live="polite"></p>
    </form>
    <!-- plan-17 验收 6：未配置 PEM 时选 tar 发布 → 内联引导「去设置」（whoami 自动带回后永不出现） -->
    <p class="warnbar hidden" id="pub-pem-hint">尚未配置平台公钥 PEM（镜像上传的加密信封公钥）：<button type="button" id="btn-go-settings" class="act">去设置</button>（whoami 自动带回后无需手工粘贴）</p>
    <!-- §12.1 一键部署状态条：①压缩 → ②上传 → ③发布 → ④完成（大字 URL + 复制）；任一步失败标红可重试；
         「仅上传」走①②并在成功时把③④标记为跳过（镜像已入库，可稍后从下方部署入口选择） -->
    <div id="dp-bar" class="hidden mt-3">
      <div class="row">
        <span class="wz-step" id="dp-s1">① 压缩</span>
        <span class="wz-step" id="dp-s2">② 上传</span>
        <span class="wz-step" id="dp-s3">③ 发布</span>
        <span class="wz-step" id="dp-s4">④ 完成</span>
        <button type="button" id="dp-retry" class="hidden">重试</button>
      </div>
      <div class="mt-2">
        <progress id="dp-prog" max="1" value="0"></progress>
        <div id="dp-text" class="note" aria-live="polite">（未开始）</div>
        <div id="dp-done" class="hidden mt-2">
          <div class="row combo">
            <a id="dp-url" class="dp-url" target="_blank" rel="noopener"></a>
            <button type="button" id="dp-copy">复制地址</button>
          </div>
        </div>
      </div>
    </div>
    <p class="fb" id="pub-fb" aria-live="polite"></p>
    <!-- 视觉QA P1-6：页尾 9-10 行长段拆为 3 步列表；技术细节收进折叠（页面密度 3/10 → 可读） -->
    <div class="fs">
      <h3>发布说明</h3>
      <ol class="note help-list">
        <li>选「本地 tar 文件」→ 自动压缩 → 分片上传 → 发布 → 展示访问地址（恒为 <span class="mono" id="pub-url">/&lt;project&gt;/</span>）。</li>
        <li>选「镜像库」→ 直接发布已入库镜像（①②两段自动跳过）。</li>
        <li>任一步失败状态条标红，可点「重试」；「仅上传」只把镜像送入镜像库（不发布），适合先备好镜像、稍后发布。</li>
      </ol>
      <details class="expert-fold">
        <summary>高级说明</summary>
        <ul class="note help-list">
          <li>命名规则：<span class="mono">^[a-zA-Z0-9][a-zA-Z0-9-]{0,30}$</span>（随机名 8 位字母数字，降低被字典遍历发现的门槛；项目留空即自动生成并回填），保留名 <span class="mono">v2 _api _bootstrap _console</span>；项目归属首个创建者。</li>
          <li>命中已有项目时自动沿用上次发布参数（内存取服务端当前配置；标签/端口取本机记忆），可修改。</li>
          <li>未选择文件时「发布」直接发布（要求镜像已入镜像库）；镜像 tar 上传前自动经 <span class="mono">zstd-19</span> 压缩再加密（已是 <span class="mono">.tar.zst</span> 则原样上传）。</li>
          <li>压缩/分片细节：按 8MB 分片逐片加密上传，每片失败自动重试 3 次；上传失败点「重试」自动从断点续传（保留已传分片，恢复时先重新压缩重建产物），详见镜像库页「上传机制说明」。</li>
        </ul>
      </details>
    </div>

    <datalist id="dl-projects"></datalist>
    <datalist id="dl-mem"><option value="128"></option><option value="256"></option><option value="512"></option><option value="1024"></option></datalist>
  </section>

  <!-- ———— 标签页 3：镜像库（plan-17 §1：镜像清单/删除/断点续传收纳） ———— -->
  <section id="tab-img" class="hidden" role="tabpanel" aria-labelledby="tabbtn-img">
    <h2>镜像库 <span id="img-scope" class="badge"></span><button type="button" id="img-sub" class="sub" title="点击重新加载镜像清单（自动加载）" aria-label="重新加载镜像清单"></button></h2>
    <!-- C7：长说明段折叠（details/summary，与发布页「高级说明」同款） -->
    <details class="fold">
      <summary>镜像库说明（可见范围 · 删除语义）</summary>
      <p class="note">镜像清单从已上传入库的镜像加载（发布页选「镜像库」源时下拉同此数据，自动加载）；默认仅列出您名下的镜像，管理员钥匙可见全部账号的镜像并标注「管理员视图」。每行可删除不再使用的旧镜像：删除即触发回收（秒级释放磁盘），正在运行的展项不受影响，但其回滚/重建将失效。</p>
    </details>
    <!-- §14.3 镜像清单：与发布表单「镜像库」下拉同源 /_api/images 数据；每行「删除」走 POST /_api/image-rm（内联 GC，秒级回收磁盘） -->
    <div class="tbl-wrap tbl-low mt-3"><!-- 视觉QA P1-7：介绍段→表头 3px → 12px -->
      <table id="img-list">
        <thead><tr><th>镜像（同发布页下拉清单 · 可删除旧镜像释放磁盘）</th><th>操作</th></tr></thead>
        <tbody><tr><td colspan="2" class="note">正在加载…</td></tr></tbody>
      </table>
    </div>
    <datalist id="dl-images"></datalist>

    <div class="fs">
      <h3>镜像分片上传（压缩后 8MB/片逐片加密 · 服务端拼接解密导入 · 断点续传）</h3>
      <div class="row">
        <button id="btn-resume">恢复 / 查询上传状态</button>
        <label class="field" for="up-id"><span>续传编号（中断的上传凭此恢复）</span>
          <input type="text" id="up-id" list="up-ids" size="34" class="mono" placeholder="中断后填入或从列表选择…"></label>
        <datalist id="up-ids"></datalist>
      </div>
      <!-- §14.1 空间条：常显「可用空间（已扣预留）」；进入本区 / import-end 成功 / 删除镜像后自动刷新，亦可手动刷新 -->
      <div class="row">
        <div id="space-note" class="note" aria-live="polite">可用空间（已扣预留）：…</div>
      </div>
      <div class="mt-3">
        <progress id="up-prog" max="1" value="0"></progress>

    <ul class="note help-list">
      <li>控制台用「账号 + 密码」登录：密码只在登录时使用一次，登录后本设备自动保管专用钥匙，此后全部操作自动签名，无需再输密码。</li>
      <li>新设备 / 换浏览器：直接输入账号密码登录即可，平台自动为本设备绑定新钥匙（旧设备钥匙按平台策略自动回收，回收后该设备重新密码登录）。</li>
      <li>忘记密码：请联系管理员重置（控制台无法自助找回；重置不影响各设备已绑定的钥匙，管理员在「管理」页点「补发密码」即生成新的登录初始密码）。</li>
      <li>修改密码：登录后点顶部「修改密码」自助更换——需先输入当前密码校验，新密码经 OPAQUE 盲化上线、全程不明文；改完请用新密码重新登录（本机钥匙不受影响）。</li>
      <li>登录密码与镜像库密码是两把独立发放的密码：前者登录控制台 / CLI，后者在 docker push 推送镜像时使用。</li>
      <li>本设备钥匙由浏览器自动生成并保存在 localStorage（属试验性存储）：清除浏览器数据即失效，届时重新密码登录即可。</li>
    </ul>

      <li>CLI 与控制台同一模型（统一账号密码认证）：<span class="mono">showroom login &lt;账号&gt;</span> 输一次密码即自动配置本机（含镜像库凭据），此后全部子命令免密码（gh/ssh 模型）；<span class="mono">showroom logout</span> 退出（清本机并远程吊销钥匙）。</li>
      <li>无账号 / 忘记密码：联系管理员发放或重置（<span class="mono">showroomctl user-add &lt;名&gt; --gen-password</span>）。</li>

      <li>建议在 Dockerfile 里配置 <span class="mono">HEALTHCHECK</span>，平台据此判定健康并自愈。</li>
      <li>镜像内配置文件替换推荐 <span class="mono">envsubst &lt; config.tpl &gt; config</span> 模式（占位符由注入的环境变量填充）。</li>

    catch (e) { lastErr = e; try { return (await WebAssembly.instantiate(await (await fetch(p)).arrayBuffer(), {})).instance.exports; } catch (e2) { lastErr = e2; } }

{

}

// —— 消息条（错误统一顶部：「错误码：中文解释（含下一步动作）」）与行内反馈 ——
const ERR_CN = {

  E_NAME: '命名不符合规则或使用了保留名；请按提示修正名称后重试',
  E_QUOTA: '超出平台限额（内存配额/导入体积/磁盘空间不足）；请调低内存配置、精简镜像，磁盘不足时可先删除旧镜像',
  E_NOTFOUND: '对象不存在（展项/会话）；请确认名称或重新发起',
  E_STATE: '当前状态不允许该操作；请检查前置条件（如确认标记、容器状态）后重试',
  E_NET: '网络或服务不可用；请稍后重试，或用 showroom doctor 排查',
};
function showMsg(text, kind = 'err') {
  const el = $('msg');
  el.textContent = text;
  el.className = kind;

}

};

  if (e && e.error === 'E_QUOTA' && (e.msg || '').includes('磁盘空间不足')) {
    if ($('space-note')) refreshSpace(true);
    return showMsg(`${what} 失败 — ${errText(e)}；可到部署区删除旧镜像后重试`); // 第2轮xiaozhi P3：what 与「失败」间补空格（CJK/西文混排间距）
  }
  showMsg(`${what} 失败 — ${errText(e)}`);
};
// —— 界面规范助手：字段级内联错误（显示于字段旁并聚焦首错）与按钮「处理中…」 ——
function fieldErr(id, msg) {
  const err = $(`${id}-err`);
  if (err) { err.textContent = msg || ''; if (msg && err.classList?.contains('hidden')) err.classList.remove('hidden'); }
  if (msg) { const el = $(id); el.focus?.(); }
}
const clearErrs = (...ids) => ids.forEach((id) => fieldErr(id, ''));
/** 提交按钮请求中禁用 + 「处理中…」；完成后恢复原文字。busy(btn, true[, 文案]) / busy(btn, false)。 */
function busy(btn, on, txt = '处理中…') {
  if (!btn) return;
  if (on) { btn.dataset.label = btn.textContent; btn.textContent = txt; btn.disabled = true; }
  else { if (btn.dataset.label !== undefined) btn.textContent = btn.dataset.label; btn.disabled = false; }
}
const fmtTime = (unixSec) => {
  if (!unixSec) return '\u2014';
  try {
    // D1：展项表「更新」列带年份（YYYY/MM/DD HH:MM），跨年项目不再歧义
    return new Intl.DateTimeFormat('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }).format(new Date(unixSec * 1000));
  } catch { return '\u2014'; } // 非法输入（服务端形状为 unix 秒）防御：不因单行时间戳中断整表渲染

  const v = Number(n);
  return Number.isFinite(v) ? `${(v / 1024 ** 3).toFixed(1)} GB` : String(n ?? '—');

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const STATUS_CN = { running: '运行中', exited: '已退出', paused: '已暂停', restarting: '重启中', created: '已创建', dead: '异常终止' }; // 管理页容器列表用（missing 不进 UI）
const statusCn = (s) => STATUS_CN[s] || s || '未知';

// —— plan-17 §4：展项 7 态显示机（服务器真值 5 + 本地在途 2；显示层只出 7 词，后端原词进 tooltip） ——
const PUB_REBUILD_MS = 60000; // 发布成功后「重建中」滚动窗口
const localState = { publishing: new Set(), failedUntil: new Map(), rebuiltUntil: new Map() };
function markPublishing(project) { localState.publishing.add(project); renderProjects(); }
function markPublishDone(project) {
  localState.publishing.delete(project);
  localState.failedUntil.delete(project);
  localState.rebuiltUntil.set(project, Date.now() + PUB_REBUILD_MS);
  setTimeout(() => { if (state.loggedIn) refreshProjects(true); }, PUB_REBUILD_MS + 1000); // 窗口结束回真实态
}
function markPublishFail(project) { localState.publishing.delete(project); localState.failedUntil.set(project, Date.now() + PUB_REBUILD_MS); }
function projState(p) {
  const raw = String(p.status || '');
  const q = p.project;
  const now = Date.now();
  if (localState.publishing.has(q))
    return { label: '发布中…', cls: 'st-wait', breath: false, tip: '发布请求进行中（本地在途）：行操作已禁用，请稍候', act: { update: 0, logs: 0, ss: null, more: 0 } };
  if (deploy.phase === 'upload' && deploy.project === q)

      tip: '镜像分片上传中（本地在途）：完成状态条见发布页；失败可断点续传', act: { update: 0, logs: 0, ss: null, more: 0 } };
  if (raw === 'running')

/** 第1轮UI审查P2：非本人项目判定——p.user 存在且非本人、且既非 whoami 管理员也非密码登录继承管理员时，

const notMine = (p) => !!(p && p.user && state.user && p.user !== state.user && !(state.admin || state.boundAdmin));
function rowActionsHtml(p) {

    return `${open}${b('deploy-row', '部署', ' title="到发布页预填该项目并选择镜像拉起"')}${b('logs', '日志', ' disabled')}${b('rm', '删除')}`;

// —— 对外 URL 展示策略（plan-17 §6）：全站主链接一律 externalUrl()；服务端 p.url 仅作 tooltip ——
// base 解析：① 设置 sr.publicBase（#set-base）→ ② location.origin（host 非私网）→ ③ 兜底 origin + 内网提示条
const PRIV_HOST_RE = /^(localhost|127\.|0\.0\.0\.0|::1|\[::1\]|10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)/i;
function publicBase() {
  const saved = (localStorage.getItem('sr.publicBase') || '').trim().replace(/\/+$/, '');
  return saved || location.origin; // ②/③：公网 origin 直接用；内网 origin 兜底（列表上方出提示条）
}
const usingLanOrigin = () => !localStorage.getItem('sr.publicBase')
  && location.protocol !== 'https:' && PRIV_HOST_RE.test(location.hostname);
const externalUrl = (p) => `${publicBase()}/${p.project}/`;

// —— 数据 TTL 缓存（plan-17 §3）：内存+TTL 单源；写操作/事件强制失效（force 绕过） ——
const DATA_TTL = { projects: 30000, images: 300000, space: 60000 };
const dataAt = { projects: 0, images: 0, space: 0 };
const dataFresh = (k) => Date.now() - dataAt[k] < DATA_TTL[k];
const dataMark = (k) => { dataAt[k] = Date.now(); retryCounts[k] = 0; }; // 成功即复位兜底重试计数
const dataInvalidate = (...ks) => ks.forEach((k) => { dataAt[k] = 0; });
// plan-17 §3/验收 8：失败 3 秒自动重试 1 次；此后每 10s 慢速兜底重试（≤7 次）直至恢复——
// 恢复联网/服务后免刷新自动补齐（online 钩子与事件流重连之外的第三重保障）
const retryCounts = {};
function retryOnce(key, fn, delay = 3000) {
  const n = retryCounts[key] || 0;
  if (n >= 7) return;
  retryCounts[key] = n + 1;
  setTimeout(() => { if (state.loggedIn) fn(); }, n === 0 ? delay : 10000);
}

// —— 密钥状态（localStorage：sr.seed hex64 / sr.user / sr.pempub）——
const state = { seed: null, pub: '', user: '', loggedIn: false, projects: [], kid: '', admin: false, boundAdmin: false };
function Buffer_fromHex(hex) {
  const b = new Uint8Array(hex.length / 2);
  for (let i = 0; i < b.length; i++) b[i] = parseInt(hex.substr(i * 2, 2), 16);
  return b;
}
function toHex(bytes) {
  let s = '';
  for (const b of bytes) s += b.toString(16).padStart(2, '0');
  return s;
}
function loadSeed() {
  const hex = localStorage.getItem('sr.seed');
  state.seed = /^[0-9a-fA-F]{64}$/.test(hex || '') ? hex : null;
  state.pub = '';
  if (state.seed) {
    const [sp, spl] = put(Buffer_fromHex(state.seed));
    state.pub = shimCStr((p, c) => ex.sr_pub_string(sp, p, c), 128);
    unput(sp, spl);
  }
}
// 密钥指纹 = 公钥串载荷（b64）前 8 位（服务端/CLI 侧展示用；B6 后控制台不再展示）

// —— 密钥无感管理（plan-16 §3）：无 sr.seed 即自动生成（登录前也一样），用户全程不可见 ——
function ensureSeed() {
  loadSeed();
  if (state.seed) return;
  const sp = alloc(32);
  try {
    if (ex.sr_generate(sp) !== 0) throw { error: 'E_NET', msg: '密钥生成失败（垫片错误）' };
    localStorage.setItem('sr.seed', toHex(mem().slice(sp, sp + 32)));
  } finally { unput(sp, 32); }
  loadSeed();
}

// —— OPAQUE 客户端适配层（plan-16 §2.2 报文序列 / §6.1 垫片导出）——
// 垫片导出已由服务端侧落入 showroom-common/src/wasm_shim.rs（真实 ABI，下方 real 分支已按其
// 接线）：sr_rwd / sr_login_start(pw,user)→sid / sr_login_ke1(sid)→b64 / sr_login_finish(sid,pw,ke2)→ke3。
// wasm 垫片已含 OPAQUE 导出（sr_login_start 等），OPAQUE_SHIM 探测自动走真分支；
// mock 兜底层仅在探测失败时降级（如 wasm 加载失败），正常永不触发。
// 真分支 ABI 要点（与垫片源码一致）：b64 串进出；输出 NUL 结尾、容量不足 -(所需) ≤ -40；
// finish 一次性消费会话（不做容量探测重试，首给足容量）；密码错误/协议失败 = -7。
const OPAQUE_SHIM = typeof ex.sr_login_start === 'function' && typeof ex.sr_login_ke1 === 'function' && typeof ex.sr_login_finish === 'function';
const MOCK_FP = (s) => { let h = 0x811c9dc5; for (const b of enc.encode(s)) { h ^= b; h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(16).padStart(8, '0'); };
const MOCK_B64 = (o) => bytesToB64(enc.encode(JSON.stringify(o)));
function MOCK_PARSE(b64) { try { return JSON.parse(dec.decode(Uint8Array.from(atob(b64), (c) => c.charCodeAt(0)))); } catch { return null; } }
let mockSidSeq = 0;
const MOCK_SESS = new Map();
/** ① login_start：产出 ke1（真垫片=盲化 OPRF 份额 + 临时份额；mock=形状兼容假报文）。返回 {sid, ke1}。 */
function opaqueStart(user, pass) {
  if (OPAQUE_SHIM) {
    const [pp, pl] = put(enc.encode(pass)), [up, ul] = put(enc.encode(user));
    let sid;
    try { sid = ex.sr_login_start(pp, pl, up, ul); } // rwd 硬化在垫片内部完成
    finally { unput(pp, pl); unput(up, ul); }
    if (sid <= 0) throw { error: 'E_NET', msg: `login_start 失败（${sid}；-6=熵未注入）` };
    const ke1 = shimCStr((p, c) => ex.sr_login_ke1(sid, p, c), 2048); // 幂等可重复取
    return { sid, ke1 };
  }
  const sid = ++mockSidSeq;
  MOCK_SESS.set(sid, { user, r: MOCK_FP(`showroom-opaque-mock|${user}|${pass}`) });
  return { sid, ke1: MOCK_B64({ v: 1, m: 'ke1', u: user, n: nonceHex() }) };
}
/** ② login_finish：以 ke2 在本地完成密钥交换；密码错误在此抛 E_PW_LOCAL（不产生第三请求）。 */
function opaqueFinish(sid, pass, ke2) {
  if (OPAQUE_SHIM) {
    const [pp, pl] = put(enc.encode(pass)), [kp, kl] = put(enc.encode(ke2));
    const cap = 2048, out = alloc(cap); // finish 一次性消费会话：首给足容量，不做探测重试
    const r = ex.sr_login_finish(sid, pp, pl, kp, kl, out, cap);
    unput(pp, pl); unput(kp, kl);
    const ke3 = r > 0 ? readCStr(out, r) : null;
    unput(out, cap);
    if (r === -7) throw { error: 'E_PW_LOCAL', msg: '' }; // 密码错误/协议失败：本地判定
    if (!ke3) throw { error: 'E_NET', msg: `login_finish 失败（${r}）` };
    return ke3;
  }
  const st = MOCK_SESS.get(sid), j = MOCK_PARSE(ke2);
  if (!st || !j || j.m !== 'ke2' || j.mac !== MOCK_FP(`mac|${j.n}|${st.r}`)) throw { error: 'E_PW_LOCAL', msg: '' };
  return MOCK_B64({ v: 1, m: 'ke3', mac: j.mac });
}
function opaqueEnd(sid) { MOCK_SESS.delete(sid); } // 真垫片会话在 finish 时一次性自弃；此处仅清 mock 映射

// —— OPAQUE 注册适配（改密码，plan-16 §2.2 pw 三件序列：m1 → m2 → record）——
// 真垫片导出 sr_reg_start/sr_reg_msg/sr_reg_finish（b64 串进出、finish 一次性消费会话、
// 容量不足 -(所需) ≤ -40）；OPAQUE_SHIM 未就绪时同走「形状兼容 mock」（注册对 m2 不做
// 密码验证——错密码语义只属登录序列，此处任何合法形状 m2 都产出 record）。
const REG_SHIM = typeof ex.sr_reg_start === 'function' && typeof ex.sr_reg_msg === 'function' && typeof ex.sr_reg_finish === 'function';
/** ① reg_start：新密码 + user → m1（真垫片=盲化 OPRF 注册首条；mock=形状兼容假报文）。返回 {sid, m1}。 */
function opaqueRegStart(user, pass) {
  if (REG_SHIM) {
    const [pp, pl] = put(enc.encode(pass)), [up, ul] = put(enc.encode(user));
    let sid;
    try { sid = ex.sr_reg_start(pp, pl, up, ul); }
    finally { unput(pp, pl); unput(up, ul); }
    if (sid <= 0) throw { error: 'E_NET', msg: `reg_start 失败（${sid}；-6=熵未注入）` };
    const m1 = shimCStr((p, c) => ex.sr_reg_msg(sid, p, c), 2048); // 幂等可重复取
    return { sid, m1 };
  }
  const sid = ++mockSidSeq;
  MOCK_SESS.set(sid, { user, r: MOCK_FP(`showroom-opaque-mock|${user}|${pass}`) });
  return { sid, m1: MOCK_B64({ v: 1, m: 'm1', u: user, n: nonceHex() }) };
}
/** ② reg_finish：喂 m2 在本地完成注册 → record（b64，pw-commit 上行）。成功后会话一次性自弃。 */
function opaqueRegFinish(sid, pass, m2) {
  if (REG_SHIM) {
    const [pp, pl] = put(enc.encode(pass)), [mp, ml] = put(enc.encode(m2));
    const cap = 4096, out = alloc(cap); // finish 一次性消费会话：首给足容量，不做探测重试
    const r = ex.sr_reg_finish(sid, pp, pl, mp, ml, out, cap);
    unput(pp, pl); unput(mp, ml);
    const record = r > 0 ? readCStr(out, r) : null;
    unput(out, cap);
    if (!record) throw { error: 'E_NET', msg: `reg_finish 失败（${r}）` };
    return record;
  }
  const st = MOCK_SESS.get(sid), j = MOCK_PARSE(m2);
  if (!st || !j || j.m !== 'm2') throw { error: 'E_NET', msg: '' };
  return MOCK_B64({ v: 1, m: 'record', u: st.user, mac: MOCK_FP(`rec|${j.n}|${st.r}`) });
}
function opaqueRegEnd(sid) { MOCK_SESS.delete(sid); } // 真垫片会话在 finish 时一次性自弃；此处仅清 mock 映射

// —— 一步登录（plan-16 §2.2/§3）：login-begin → 本地 finish → login-finish → key-bind → 进入 ——
async function postAuthJson(path, body) { // /_api/auth/*：唯一应答未签名请求的端点族（§2.3）
  const resp = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  return checkResp(resp);
}
/** key-bind：候选钥匙签名（服务端按 body 内公钥验签而非已登记钥匙）+ 一次性 bind_token。 */
async function apiBind(user, pubkey, bindToken) {
  const body = enc.encode(JSON.stringify({ user, pubkey }));
  const [bp, bl] = put(body);
  const auth = signHeaderPtr('POST', '/_api/auth/key-bind', bp, bl);
  unput(bp, bl);
  const resp = await fetch('/_api/auth/key-bind', {
    method: 'POST',
    headers: { Authorization: auth, 'X-Sr-Bind': bindToken, 'Content-Type': 'application/json' },
    body,
  });
  return checkResp(resp);
}
/** 密码登录全程：密钥生成/绑定无感；密码只在本地参与 OPAQUE 盲化，永不明文上线。 */
async function passwordLogin(user, pass) {
  ensureSeed();               // 无感：无本地钥匙即刻生成（key-bind 的候选钥匙）
  state.user = user;
  state.boundAdmin = false;
  if (!user) throw { error: 'E_STATE', msg: '账号为空，请重新输入' };
  const st = opaqueStart(user, pass);                                    // ① ke1（未签名）
  let r;
  try { r = await postAuthJson('/_api/auth/login-begin', { user: user, ke1: st.ke1 }); }
  catch (e) { opaqueEnd(st.sid); throw e; }
  let ke3;
  try { ke3 = opaqueFinish(st.sid, pass, r.ke2); }                            // ② 本地 finish（错密码即败）
  finally { opaqueEnd(st.sid); }
  const r2 = await postAuthJson('/_api/auth/login-finish', { user: user, ke3: ke3 }); // ③ ke3 → bind_token（60s 单次）
  const kb = await apiBind(user, state.pub, r2.bind_token);                // ④ 绑定（幂等：同钥匙重绑=ok）
  state.kid = kb.kid || '';
  state.boundAdmin = !!kb.admin; // §2.2：账号持 admin 钥匙 → 密码绑定的新钥匙继承 admin（显式提示）
  localStorage.setItem('sr.user', user); // 账号与钥匙一起记忆：下次自测直达（免密码）
}
async function onLoginSubmit(ev) {
  ev.preventDefault();
  clearErrs('lg-user', 'lg-pass');
  const user = $('lg-user').value.trim();
  if (!NAME_RE.test(user)) return fieldErr('lg-user', `账号「${user}」不合法（须匹配 ^[a-z0-9][a-z0-9-]{0,30}$），请修改后重试`);
  const pass = $('lg-pass').value;
  if (!pass) return fieldErr('lg-pass', '请输入密码；忘记密码请联系管理员重置');
  busy($('lg-submit'), true, '登录中…');
  $('lg-fb').textContent = '正在登录…';
  try {
    await passwordLogin(user, pass);
    $('lg-pass').value = ''; // 用后即清，不留在 DOM
    $('lg-fb').textContent = '';
    enterApp();
    if (state.boundAdmin) showMsg('管理员账号：本设备已继承管理员权限（顶部「管理」标签可用）。', 'ok');
  } catch (e) {
    $('lg-fb').textContent = '';
    if (e && e.error === 'E_PW_LOCAL') {
      // 客户端无法也不应区分「密码错」与「未设密码」（防枚举的一致代价，§3）
      fieldErr('lg-pass', '密码错误，或该账号尚未设置密码（请联系管理员重置）');
    } else if (e && e.error === 'E_AUTH') {
      fieldErr('lg-pass', '登录被服务端拒绝（可能为限流或服务暂不可用），请稍后重试；忘记密码请联系管理员重置');
    } else {
      apiFail('登录', e);
      fieldErr('lg-pass', `登录失败（${e && e.msg ? e.msg : '网络异常或服务不可用'}），请稍后重试`);
    }
  } finally { busy($('lg-submit'), false); }
}

/** 复制到剪贴板（优先 Clipboard API，降级 execCommand；均失败提示手动复制）。 */
async function copyText(text, what) {
  try {
    if (navigator.clipboard?.writeText) { await navigator.clipboard.writeText(text); return showMsg(`${what}已复制。`, 'ok'); }
  } catch { /* 降级到 execCommand */ }
  const ta = document.createElement('textarea');
  ta.value = text; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); showMsg(`${what}已复制。`, 'ok'); }
  catch { showMsg(`复制失败，请手动选中${what}复制。`); }
  ta.remove();
}

// —— SR-SIG1 签名请求（SPEC §1/§3：所有 /_api 一律签名）——
function nonceHex() {
  const b = new Uint8Array(16); crypto.getRandomValues(b);
  return toHex(b);
}
/** 对 wasm 内存中 [ptr,ptr+len) 的 body 签名（分片上传零拷贝路径）。 */
function signHeaderPtr(method, pathQ, bodyPtr, bodyLen) {
  const nonce = nonceHex();
  const ts = BigInt(Math.floor(Date.now() / 1000));
  const [sp, spl] = put(Buffer_fromHex(state.seed));
  const [op, ol] = put(enc.encode(state.user)), [mp, ml] = put(enc.encode(method));
  const [pp, pl] = put(enc.encode(pathQ)), [np, nl] = put(enc.encode(nonce));
  const auth = shimCStr((out, cap) =>
    ex.sr_sign_header(sp, op, ol, mp, ml, pp, pl, ts, np, nl, bodyPtr, bodyLen, out, cap), 640);
  for (const [p, l] of [[sp, spl], [op, ol], [mp, ml], [pp, pl], [np, nl]]) unput(p, l);
  return auth;
}
/** 统一 API 调用：json 传对象 → JSON body；Uint8Array → 原始 body；null → 空 body。signal 供流式 GET 中止。 */
async function apiDo(method, pathQ, body, signal) {
  if (!state.seed || !state.user) throw { error: 'E_STATE', msg: '未配置密钥或账号' };
  let bodyBytes = new Uint8Array(0), isJson = false;
  if (body && typeof body === 'object' && !(body instanceof Uint8Array)) {
    bodyBytes = enc.encode(JSON.stringify(body)); isJson = true;
  } else if (body instanceof Uint8Array) bodyBytes = body;
  const [bp, bl] = put(bodyBytes);
  const auth = signHeaderPtr(method, pathQ, bp, bl);
  unput(bp, bl);
  const resp = await fetch(pathQ, {
    method,
    headers: { Authorization: auth, ...(isJson ? { 'Content-Type': 'application/json' } : {}) },
    body: method === 'GET' || method === 'HEAD' ? undefined : bodyBytes,
    signal,

}
async function api(method, pathQ, body) {
  return checkResp(await apiDo(method, pathQ, body));
}
async function checkResp(resp) {

  try { j = JSON.parse(text); } catch { /* 非 JSON */ }

/** 非 JSON 响应（octet-stream 分片等）的错误解析：统一 {error,msg} 抛出。 */
async function respErr(resp) {

  try { j = JSON.parse(await resp.text()); } catch { /* 非 JSON */ }
  return { error: j?.error || 'E_NET', msg: j?.msg || `HTTP ${resp.status}` };
}
// —— 帮助页·工具下载（/_api/tool/*，签名 GET → Blob → a.download）——
// 三件：CLI 二进制（Linux x86_64）/ Agent Skill（SKILL.md）/ 平台公钥（PEM）。
// 大小不预取（简化）：首次下载从 Content-Length / blob.size 回填大小列。
const fmtToolSize = (n) => {
  if (!Number.isFinite(n) || n < 0) return '—';
  if (n < 1024) return `${n} B`;
  if (n < 1024 ** 2) return `${(n / 1024).toFixed(1)} KB`;
  return `${(n / 1024 ** 2).toFixed(1)} MB`;
};
async function onToolDl(ev) {
  const btn = ev.target.closest('button[data-tool-dl]');
  if (!btn) return;
  const name = btn.dataset.toolDl;
  busy(btn, true, '下载中…');
  try {
    const resp = await apiDo('GET', `/_api/tool/${encodeURIComponent(name)}`, null);
    if (!resp.ok) throw await respErr(resp);
    const blob = await resp.blob();
    const sizeCell = document.getElementById(`tool-size-${name}`);
    if (sizeCell) sizeCell.textContent = fmtToolSize(blob.size); // 首次响应回填大小（不预取）
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    showMsg(`已下载 ${name}（${fmtToolSize(blob.size)}）`, 'ok');
  } catch (e) {
    apiFail(`下载 ${name}`, e);
  } finally { busy(btn, false); }
}

/** §10.4 ndjson 流式消费：流式 GET（空 body 签名=空串哈希，与普通签名 GET 相同）；
 *  行缓冲跨 chunk 拼行、逐行 JSON 回调（非法行静默丢弃）；reader 按消费节奏拉取（天然背压）；
 *  signal 中止 → fetch/reader 随之中断并抛 AbortError。 */
async function consumeNdjson(url, onLine, signal) {
  const resp = await apiDo('GET', url, null, signal);
  if (!resp.ok) throw await respErr(resp);
  const reader = resp.body.getReader();
  const td = new TextDecoder();
  let buf = '';
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += td.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf('\n')) >= 0) {
      const line = buf.slice(0, i);
      buf = buf.slice(i + 1);
      if (line.trim()) { try { onLine(JSON.parse(line)); } catch { /* 非法行丢弃 */ } }
    }
  }
  buf += td.decode();
  if (buf.trim()) { try { onLine(JSON.parse(buf)); } catch { /* 同上 */ } }
}

// —— 修改密码（plan-16 §2.2 收口）：当前密码本地校验（复用 OPAQUE 登录序列 login-begin + 本地

//    pw-commit {user,record}（SR-SIG1，服务端原子替换 pass.opaque，不动既有钥匙）→ 提示重新登录 ——
function openPwDlg() {
  $('pw-cur').value = ''; $('pw-new').value = ''; $('pw-new2').value = '';

async function onPwChange() {
  clearErrs('pw-cur', 'pw-new', 'pw-new2');
  const cur = $('pw-cur').value, nw = $('pw-new').value, nw2 = $('pw-new2').value;
  if (!cur) return fieldErr('pw-cur', '请输入当前密码；忘记密码请联系管理员重置');
  if (!nw) return fieldErr('pw-new', '请输入新密码');
  if (nw !== nw2) return fieldErr('pw-new2', '两次输入的新密码不一致，请重新输入');
  if (nw === cur) return fieldErr('pw-new', '新密码与当前密码相同，请换一个');
  busy($('pw-submit'), true, '修改中…');
  $('pw-fb').textContent = '正在校验当前密码…';
  try {
    // ① 当前密码校验：完整 login-begin + 本地 finish（错密码本地即败），不产生登录态
    const st = opaqueStart(state.user, cur);
    let ke2;
    try { ke2 = (await postAuthJson('/_api/auth/login-begin', { user: state.user, ke1: st.ke1 })).ke2; }
    catch (e) { opaqueEnd(st.sid); throw e; }
    try { opaqueFinish(st.sid, cur, ke2); }
    catch (e) { if (e && e.error === 'E_PW_LOCAL') throw { error: 'E_PW_CUR', msg: '' }; throw e; }
    finally { opaqueEnd(st.sid); }
    // ② pw 三件序列（服务端 §16：签名即会话证明，旧密码不再上线；60s 在途注册态一次性消费）
    $('pw-fb').textContent = '当前密码已校验，正在替换…';
    const rs = opaqueRegStart(state.user, nw); // ②-1 m1
    let m2;
    try { m2 = (await api('POST', '/_api/auth/pw-begin', { user: state.user, m1: rs.m1 })).m2; }
    catch (e) { opaqueRegEnd(rs.sid); throw e; }
    let record;
    try { record = opaqueRegFinish(rs.sid, nw, m2); } // ②-2 本地 reg finish → record
    finally { opaqueRegEnd(rs.sid); }
    await api('POST', '/_api/auth/pw-commit', { user: state.user, record }); // ②-3 原子替换
    $('pw-cur').value = ''; $('pw-new').value = ''; $('pw-new2').value = ''; // 用后即清，不留在 DOM
    if ($('dlg-pw').open) $('dlg-pw').close();
    showMsg('密码修改成功：请使用新密码重新登录。', 'ok');
    logout(); // 收口：结束当前会话，引导新密码重登（登出即回收本机钥匙，B2 同语义）
    $('lg-fb').textContent = '密码已修改：请输入新密码重新登录（本机钥匙已随退出回收）。';
  } catch (e) {
    $('pw-fb').textContent = '';
    if (e && e.error === 'E_PW_CUR') fieldErr('pw-cur', '当前密码不正确（或该账号密码已被重置），请重输');
    else apiFail('修改密码', e);
  } finally { busy($('pw-submit'), false); }
}
// —— §11 随机项目名：crypto.getRandomValues 拒绝采样生成 8 位 [a-zA-Z0-9]（降低字典遍历发现门槛） ——
function randomProject() {
  const A = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  let s = '';
  while (s.length < 8) {
    const b = new Uint8Array(32);
    crypto.getRandomValues(b);
    for (const v of b) { if (v < 248 && s.length < 8) s += A[v % 62]; } // 248=62×4：截断去模偏
  }
  return s;
}
// —— plan-16 §1.4 发卡/补发用强密码：crypto.getRandomValues 拒绝采样生成 16 位 [a-zA-Z0-9]
//    （62^16≈2^95 熵；纯字母数字便于人工抄录转交，与 CLI 侧 24 hex 同一强度档位） ——
function randomPassword() {
  const A = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  let s = '';
  while (s.length < 16) {
    const b = new Uint8Array(32);
    crypto.getRandomValues(b);
    for (const v of b) { if (v < 248 && s.length < 16) s += A[v % 62]; } // 248=62×4：截断去模偏
  }
  return s;
}

function activateTab(name) {
  const tabs = ['proj', 'pub', 'img', 'db', 'help']; // plan-17 §1 五标签（管理页动态追加）
  if (adminBuilt) tabs.push('admin');
  for (const b of $('tabs').querySelectorAll('button')) {
    const on = b.dataset.tab === name;
    b.classList.toggle('on', on);
    b.setAttribute?.('aria-selected', on ? 'true' : 'false');
  }
  for (const s of tabs) $(`tab-${s}`).classList.toggle('hidden', s !== name);
  if (name === 'proj') { refreshProjects(); refreshSpace(); } // TTL 内跳过（plan-17 §3）
  if (name === 'pub') { ensureImages(); refreshSpace(true); } // 发布页：镜像下拉数据源（TTL 300s）+ 空间条强制校准（第1轮UI审查P1：tar 上传准入信息在本页可见）
  if (name === 'img') { ensureImages(); refreshSpace(true); } // 镜像库：清单（TTL）+ 空间条强制校准（上传准入关键信息，§14.1 进入本区即刷新）
  if (name === 'proj') { evLive.want = true; startEventsStream(); } // 展项页可见即订阅（§3）
  else stopEventsStream();                                  // 离页退订（服务端收尸 docker events 子进程）
  if (name === 'db') { ensureRedisDbs(); fillDbTargets(); } // Redis 区首次展开惰性拉库号；下拉消费已加载 projects
  if (name === 'admin') { loadAdminUsers(); refreshAdminStatus(); refreshHost(); }
}
function wireTabs() {
  $('tabs').addEventListener('click', (ev) => {
    const btn = ev.target.closest('button[data-tab]');
    if (btn) activateTab(btn.dataset.tab);
  });
  // 方向键在标签间移动焦点并切换（tablist 键盘约定；首尾循环）
  $('tabs').addEventListener('keydown', (ev) => {
    if (ev.key !== 'ArrowRight' && ev.key !== 'ArrowLeft') return;
    const btns = $('tabs').querySelectorAll('button[data-tab]');
    if (!btns.length) return;
    const cur = ev.target.closest?.('button[data-tab]');
    const idx = Math.max(0, Array.from(btns).findIndex((b) => b.dataset.tab === cur?.dataset.tab));
    const next = (idx + (ev.key === 'ArrowRight' ? 1 : -1) + btns.length) % btns.length;
    ev.preventDefault();
    btns[next].focus?.();
    activateTab(btns[next].dataset.tab);
  });
}

  const mw = new Set(Array.isArray(he.MIDDLEWARE) ? he.MIDDLEWARE : String(he.MIDDLEWARE ?? '').split(/\s+/).filter(Boolean));
  for (const n of MW_NAMES) { // 中间件集合：开关 + 启用徽标（仅启用的显示徽标）
    const on = mw.has(n);
    $(`hs-mw-${n}`).checked = on;
    const badge = $(`hs-mw-${n}-badge`);
    badge.textContent = '已启用';
    badge.classList.toggle('hidden', !on);
  }
  const kv = Object.entries(he).filter(([k]) => k !== 'MIDDLEWARE');
  $('hs-kv-tbl').querySelector('tbody').innerHTML = kv.length ? kv.map(([k, v]) =>
    `<tr><td class="mono">${esc(k)}</td><td class="mono wrap">${esc(typeof v === 'object' && v !== null ? JSON.stringify(v) : String(v))}</td></tr>`).join('')
    : '<tr><td colspan="2" class="note">（无其他键）</td></tr>';
  const p = j.policy || {};
  $('hs-p-redisdbs').value = p.REDIS_DBS != null ? String(p.REDIS_DBS) : '';
  $('hs-p-disk').value = p.DISK_RESERVE_GB != null ? String(p.DISK_RESERVE_GB) : '';
  $('hs-p-mem').value = p.RESERVE_MEM_MB != null ? String(p.RESERVE_MEM_MB) : '';
  $('hs-p-factor').value = p.UPLOAD_SPACE_FACTOR != null ? String(p.UPLOAD_SPACE_FACTOR) : '';
  const drift = j.drift || []; // 漂移清单：warn 黄条 / error 红条，附建议命令
  $('hs-drift').innerHTML = drift.length ? drift.map((d) => `<div class="warnbar${d.severity === 'error' ? ' err' : ''}">` +
    `${d.severity === 'error' ? '缺失/停摆' : '漂移'} · <span class="mono">${esc(d.item)}</span>：期望 <span class="mono">${esc(String(d.expected))}</span>，实际 <span class="mono">${esc(String(d.actual))}</span>` +
    `${d.advice ? ` —— 建议：<span class="mono">${esc(d.advice)}</span>` : ''}</div>`).join('')
    : '<p class="note" style="margin:0">（无漂移：期望状态与实际一致）</p>';
  const pool = j.redis_pool, total = Number(pool?.total) || 0;
  const expandOn = !!(pool && total > 0 && pool.suggest_expand);
  if (pool && total > 0 && !expandOn) {
    const used = Number(pool.used) || 0;
    const head = pool.headroom != null ? Number(pool.headroom) : Math.max(0, total - used);
    $('hs-pool-ok').innerHTML = `Redis 逻辑库池：已用 <span class="mono">${used}</span> / 共 <span class="mono">${total}</span>（余 <span class="mono">${head}</span>）。`;
  }
  $('hs-pool-warn').classList.toggle('hidden', !expandOn); // 池黄条两态：<20% 余量才提示扩容
  $('hs-pool-ok').classList.toggle('hidden', expandOn || !pool || total <= 0);
  $('hs-pool-expand').classList.toggle('hidden', !expandOn);
  if (expandOn) $('hs-pool-warn-txt').textContent =
    `Redis 逻辑库余量不足（剩 ${pool.headroom != null ? Number(pool.headroom) : Math.max(0, total - (Number(pool.used) || 0))}/${total}）：建议扩容`;
}
/** 组装 POST /_api/admin/host 提交体：host_env 全量回传（MIDDLEWARE 由开关合成空格集合，其余键含 FRP 原样透传）+ policy 全量回传（三个可编辑参数覆写；REDIS_DBS 只读不走此处）。 */
function hostPostBody(confirm) {
  const he = { ...(hostState?.host_env || {}) };
  delete he.FRP_TOKEN; // P1：GET 回来是打码值 <set>，回传会覆盖真实凭据——剔除不发
  he.MIDDLEWARE = MW_NAMES.filter((n) => $(`hs-mw-${n}`).checked).join(' ');
  // bool 类键：服务端 AdminHostEnvBody 期待字符串（CADDY=yes/no、TUNING=sysctl/none、DEDUP=weekly/none）
  // GET 回来的值可能已是 bool（服务端 to_json 序列化）——统一转回服务端期待的字符串
  const toYesNo = (v, y, n) => (v === true || v === y || v === 'yes' || v === 'true') ? y : n;
  he.CADDY = typeof he.CADDY === 'boolean' ? toYesNo(he.CADDY, 'yes', 'no') : String(he.CADDY ?? 'yes');
  he.TUNING = typeof he.TUNING === 'boolean' ? toYesNo(he.TUNING, 'sysctl', 'none') : String(he.TUNING ?? 'sysctl');
  he.DEDUP = typeof he.DEDUP === 'boolean' ? toYesNo(he.DEDUP, 'weekly', 'none') : String(he.DEDUP ?? 'weekly');
  const policy = { ...(hostState?.policy || {}) };
  for (const [id, key] of [['hs-p-disk', 'DISK_RESERVE_GB'], ['hs-p-mem', 'RESERVE_MEM_MB'], ['hs-p-factor', 'UPLOAD_SPACE_FACTOR']]) {
    const v = $(id).value.trim();
    if (v !== '' && Number.isFinite(Number(v))) policy[key] = Number(v); // 空值保留原值
  }
  return { host_env: he, policy, confirm };
}
/** 两段式第一步「查看变更」：confirm=false 写盘前预演，服务端返回 actions+impact（人读行）；不落盘。 */
async function onHostApply() {
  if (!hostState) return showMsg('期望状态尚未加载，请先点「刷新期望状态」');
  busy($('hs-apply'), true, '预演中…');
  $('hs-fb').textContent = '正在生成变更清单（写盘前预演，未执行）…';
  try {
    const j = await api('POST', '/_api/admin/host', hostPostBody(false));
    hostImpact = j.impact || {};
    const actions = j.actions || [];
    const needed = actions.filter((a) => a.needed !== false);
    $('hs-review-sum').textContent = `预演：共 ${actions.length} 项动作，其中 ${needed.length} 项需执行；尚未写盘，点「确认执行」才会应用。`;
    $('hs-actions-tbl').querySelector('tbody').innerHTML = actions.length ? actions.map((a) =>
      `<tr${a.needed === false ? ' style="opacity:.55"' : ''}><td>${a.needed === false ? '＝' : '＋'} ${esc(kindCn(a.kind))}</td>` +
      `<td class="mono">${esc(a.target ?? '')}</td><td class="wrap">${esc(a.detail ?? '')}</td></tr>`).join('')
      : '<tr><td colspan="3" class="note">（无动作：期望状态已就绪）</td></tr>';
    const rm = hostImpact.removed_middleware || [], aff = hostImpact.affected_projects || [];
    $('hs-impact').innerHTML = (rm.length || aff.length) ? `
      ${rm.length ? `<p class="note" style="margin:.2rem 0 0">将禁用的中间件：<span class="mono">${rm.map(esc).join(' ')}</span>（后续发布不再注入对应变量组）</p>` : ''}
      ${aff.length ? `<div class="warnbar err" style="margin-top:.4rem">红色警示：此变更影响 ${aff.length} 个在用项目 —— ${aff.map((x) => `<span class="mono">${esc(x)}</span>`).join('、')}；这些项目的重启/回滚/新发布将失去该中间件支持，确认执行前需再次确认。</div>` : ''}`
      : '';
    $('hs-report').classList.add('hidden');
    $('hs-review').classList.remove('hidden');
    $('hs-confirm').classList.toggle('hidden', j.confirm_required === false);
    $('hs-fb').textContent = '已列出变更清单：请核对后点「确认执行」';
  } catch (e) { $('hs-fb').textContent = ''; apiFail('查看变更（预演）', e); }
  busy($('hs-apply'), false);
}
/** 两段式第二步「确认执行」：confirm=true 落盘并 apply；impact 含受影响项目时先经二次 confirm。 */
async function onHostConfirmRun() {
  if (!hostState) return;
  const aff = hostImpact?.affected_projects || [];
  if (aff.length && !confirm(`此变更将影响 ${aff.length} 个在用项目（${aff.join('、')}）：相关项目的重启/回滚/新发布将失去该中间件支持。确认继续执行？`)) return;
  busy($('hs-confirm'), true, '执行中…');
  try {
    const j = await api('POST', '/_api/admin/host', hostPostBody(true));
    await refreshHost(); // 重取期望状态：面板数字/漂移/池随之收敛
    const rep = j.report || {};
    const items = rep.actions || rep.items || [];
    const rows = items.map((a) => `<tr><td class="${a.ok === false ? 'status-bad' : 'status-ok'}">${a.ok === false ? '● 失败' : '● 成功'}</td>` +
      `<td>${esc(kindCn(a.kind))}</td><td class="mono">${esc(a.target ?? '')}</td><td class="wrap">${esc(a.result || a.detail || '')}</td></tr>`).join('');
    $('hs-report').innerHTML = `
      <h3 style="margin-top:.2rem">执行报告${j.ok === false ? '（有失败项）' : ''}</h3>
      <p class="note" style="margin:.2rem 0 0">完成 ${Number(rep.changed ?? items.length)} 项变更。</p>
      ${items.length ? `<div class="tbl-wrap" style="max-height:26vh"><table><thead><tr><th>结果</th><th>动作</th><th>目标</th><th>输出</th></tr></thead><tbody>${rows}</tbody></table></div>` : '<p class="note">（无动作）</p>'}
      ${(rep.warnings || []).map((w) => `<div class="warnbar">${esc(w)}</div>`).join('')}`;
    $('hs-report').classList.remove('hidden');
    $('hs-fb').textContent = j.ok === false ? '执行完成（含失败项，详见报告与警告）' : '执行完成';
    showMsg('主机变更已执行。', 'ok');
  } catch (e) { $('hs-fb').textContent = ''; apiFail('确认执行', e); }
  busy($('hs-confirm'), false);
}

/** 读取并校验新 databases 值（16–256 整数；上界受库编号类型承载限制）；非法 → 字段内联错误并返回 null。 */
function redisXVal() {
  const n = Number($('hs-rx-n').value);
  if (!Number.isInteger(n) || n < 16 || n > 256) {
    fieldErr('hs-rx-n', 'databases 须为 16–256 的整数（上限受库编号类型承载限制，且需大于当前已分配的最大库编号），请修正后重试');
    return null;
  }
  return n;
}
async function onRedisXPreview() { // 不动容器：仅取回服务端确认提示原文
  const n = redisXVal();
  if (n == null) return;
  busy($('hs-rx-preview'), true, '获取中…');
  try {
    const j = await api('POST', '/_api/admin/host', { redis_databases: n, confirm: false });
    $('hs-rx-prompt').textContent = j.prompt || '（服务端未返回提示文案）';
    $('hs-rx-prompt').classList.remove('hidden');
    $('hs-rx-run').classList.remove('hidden');
    $('hs-rx-fb').textContent = '请阅读服务端提示原文后，再点「我已了解，执行扩容」。';
  } catch (e) { apiFail('获取扩容确认提示', e); }
  busy($('hs-rx-preview'), false);
}
async function onRedisXRun() { // confirm=true：停旧容器 → 新容器带 --databases N 起来 → 验证 → 回报
  const n = redisXVal();
  if (n == null) return;
  busy($('hs-rx-run'), true, '扩容中…');
  try {
    const j = await api('POST', '/_api/admin/host', { redis_databases: n, confirm: true });
    const secs = j.restart_secs != null ? `（实例重启约 ${j.restart_secs} 秒）` : '';
    $('hs-rx-fb').textContent = `扩容完成：databases → ${j.databases ?? n}${secs}，服务端已自动验证（PING + 库数）。`;
    $('hs-rx-run').classList.add('hidden');
    showMsg(`Redis 逻辑库池已扩容到 ${j.databases ?? n}。`, 'ok');
    refreshHost(); // 池数字与漂移黄条随之收敛（不阻塞对话框回报）
  } catch (e) { apiFail('执行扩容', e); }
  busy($('hs-rx-run'), false);
}

// —— §13.1 镜像清单（ComboBox 数据源）：进入发布区惰性加载；force=true 强制重取 ——

  if (imagesLoaded && !force && dataFresh('images')) return; // plan-17 §3：TTL 300s
  $('dep-images-fb').textContent = '正在加载镜像清单…'; // 镜像库下拉（发布页）反馈
  try {
    const j = await api('GET', '/_api/images');
    const images = (j.images || []).map(String);
    $('dl-images').innerHTML = images.map((s) => `<option value="${esc(s)}">`).join('');
    renderImageList(images); // §14.3：清单容器（删除按钮挂此）与 ComboBox 同源同刷
    imagesLoaded = true;
    dataMark('images');
    const adminView = j.admin_view ?? state.admin; // 服务端标注优先，回退 whoami 结论
    $('img-scope').textContent = adminView ? '管理员视图' : ''; // B4：页标题旁徽章（取代副题文字前缀）
    $('img-sub').textContent = `已加载 ${images.length} 项 · ${new Date().toLocaleTimeString([], { hour12: false })}`; // 副题可点重取
    $('dep-images-fb').textContent = '';

    $('img-sub').textContent = '加载失败，点击重试'; // D2：副题本身可点（点击即强制重取）

  }
}
/** §14.3 镜像清单渲染：部署 ComboBox 同源数据；每行尾「删除」按钮（POST /_api/image-rm，内联 GC 秒级回收）。 */

/** §14.3 删除镜像：confirm 写明镜像名与回滚失效语义 → image-rm → alert 回收量 → 刷新清单+空间条。 */
async function onImageRm(ev) {
  const btn = ev.target.closest('button[data-act="image-rm"]');
  if (!btn || btn.disabled) return;
  const image = btn.dataset.img;
  if (!confirm(`确定删除镜像 ${image} 吗？正在使用该镜像的已发布项目不受影响（容器继续运行），但回滚/重建将失效。`)) return;
  btn.disabled = true;
  try {
    const j = await api('POST', '/_api/image-rm', { image });
    alert(`已回收约 ${Number(j.freed_est_mb ?? 0)} MB`);
    dataInvalidate('images', 'space'); // plan-17 §3：写操作强制失效
    ensureImages(true); // 清单重取：被删 tag 即刻消失
    refreshSpace(true);     // 空间数字同步刷新
  } catch (e) { apiFail(`删除镜像 ${image}`, e); }
  btn.disabled = false;
}
// —— §14.1 空间条：GET /_api/space → 「可用空间（已扣预留）：X GB」（GB 一位小数）；失败静默降级 ——
// 第1轮UI审查P1：空间条双落点——镜像库页 #space-note 与发布页 #pub-space-note（tar 上传发生在发布页，须就地可见）
async function refreshSpace(force = false) {
  if (!force && dataFresh('space')) return; // plan-17 §3：TTL 60s
  let txt;
  try {
    const j = await api('GET', '/_api/space');
    const freeMb = Number(j.available_mb) - Number(j.reserve_mb); // 显示口径＝可用−预留（SPEC §14.1）

    txt = `可用空间（已扣预留）：${(freeMb / 1024).toFixed(1)} GB`;
    dataMark('space');
  } catch { txt = '空间信息不可用'; } // 静默降级：不上顶部条、不阻断上传表单

// —— 镜像库源：选中镜像 → 自动带出项目与标签到发布表单（形如 user/project:tag；可手改） ——
function onImagePick() {

/** plan-17 §5：镜像源 radio（默认 tar）。「镜像库」源发布时 ①压缩②上传自动跳过。 */
const pubSrc = () => ($('pub-src-registry').checked ? 'registry' : 'tar');
function pickPubSource(v) {

/** 命中已有项目名 → 沿用上次发布参数（mem=服务端 conf 行；tag/cport=本机 sr.conf.* 记忆）。 */
// C4：内存输入以 MiB 裸数字为准（如 256）；服务端 parse_mem 把裸数字按字节解释，故提交时补 m 后缀
const memToUi = (v) => String(v ?? '').trim().replace(/^(\d+)[mM]$/, '$1');       // 「256m」→「256」（展示）
const memFromUi = (v) => { const s = String(v ?? '').trim(); return /^\d+$/.test(s) ? `${s}m` : s; }; // 「256」→「256m」（提交）
function onPubProjectChange() {
  const v = $('pub-project').value.trim();
  if (state.projects.some((x) => x.project === v)) pubPrefill(v);
  else $('pub-pref-note')?.classList.add('hidden');
}
function pubPrefill(project, opts = {}) {
  const row = state.projects.find((x) => x.project === project);
  let conf = null;
  try { conf = JSON.parse(localStorage.getItem('sr.conf.' + project) || 'null'); } catch { /* 坏记录忽略 */ }
  let hit = false;
  if (row && row.mem) { $('pub-mem').value = memToUi(row.mem); hit = true; } // 服务端 conf 权威（GET /_api/projects）
  if (conf && conf.cport) { $('pub-cport').value = String(conf.cport); hit = true; } // 响应无 cport 字段 → 本地记忆补（字符串赋值）
  if (conf && conf.tag && !opts.keepTag) { $('pub-tag').value = conf.tag; hit = true; }
  const note = $('pub-pref-note');
  if (note) {
    if (hit) {
      const d = conf && conf.ts ? new Date(conf.ts) : null;
      const md = d && !Number.isNaN(d) ? `（${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}）` : '';
      note.textContent = `沿用上次发布参数${md}，可修改`;
      note.classList.remove('hidden');
    } else note.classList.add('hidden');
  }
}
async function refreshProjects(force = false) {
  if (!force && dataFresh('projects')) return; // plan-17 §3：TTL 内跳过（内存单源）
  const tb = $('proj-tbl').querySelector('tbody');
  if (tb) tb.innerHTML = '<tr><td colspan="7" class="note">加载中…</td></tr>';
  try {
    const j = await api('GET', '/_api/projects');
    state.projects = j.projects || [];
    renderProjects();
    dataMark('projects');
    $('proj-fb').textContent = `已加载 ${state.projects.length} 项 · ${new Date().toLocaleTimeString([], { hour12: false })}`; // 副题可点重取
    fillDbTargets();
  } catch (e) {
    // §3 失败表现：表格内联「加载失败 + 重试」（顶部条不打扰）+ 3s 自动重试 1 次
    if (tb) tb.innerHTML = `<tr><td colspan="7" class="note">加载失败 · ${esc(errText(e))}　<button type="button" class="act" data-act="retry-projects">重试</button></td></tr>`;
    $('proj-fb').textContent = `加载失败 · ${new Date().toLocaleTimeString([], { hour12: false })}`;
    retryOnce('projects', () => refreshProjects(true));
  }
}
function renderProjects() {
  const tb = $('proj-tbl').querySelector('tbody');
  // B4 管理员视图标注兑现：管理员且列表含非本人条目 → 页标题旁徽章（与数据页 #rd-scope 同款）
  $('proj-scope').textContent = ((state.admin || state.boundAdmin) && state.projects.some((p) => p.user && p.user !== state.user)) ? '管理员视图' : '';
  if (!state.projects.length) { tb.innerHTML = '<tr><td colspan="7" class="note">暂无展项——点顶栏「+ 发布」发布新 Demo（选「本地 tar 文件」或「镜像库」源均可）。</td></tr>'; }
  else {
    const acts = state.projects.map((p) => {
      const q = esc(p.project);
      return `<tr data-row="${q}">
      <td class="mono">${q}</td>
      ${rowStatusHtml(p)}
      <td class="wrap"><a href="${esc(externalUrl(p))}" target="_blank" rel="noopener" title="服务器登记地址：${esc(p.url || '—')}">${esc(externalUrl(p))}</a></td>
      <td class="mono">${esc(p.tag)}</td>
      <td class="mono num">${esc(fmtTime(p.updated))}</td>
      <td>${rowActionsHtml(p)}</td>
      <td>${notMine(p)
        ? '<button class="act" disabled title="非本人项目：仅所有者与管理员可查看日志">▾</button>'
        : `<button class="act" data-act="logs" data-p="${q}" title="展开日志抽屉" aria-expanded="false">▾</button>`}</td>
    </tr>`;
    }).join('');
    tb.innerHTML = acts;
  }
  $('proj-base-note')?.classList.toggle('hidden', !usingLanOrigin()); // 兜底 origin 为内网才提示（配置 base 即收敛）
  // 行抽屉常驻：重渲后重新挂回（hidden 状态保持；展开时移到原项目行后不丢抽屉）
  const tbEl = $('proj-tbl')?.querySelector?.('tbody');
  if (tbEl && !tbEl.contains?.(drawerRow)) tbEl.append?.(drawerRow);
  if (drawerRow.dataset.drawer) {
    const r = $('proj-tbl')?.querySelector?.(`tr[data-row="${drawerRow.dataset.drawer}"]`);
    if (r && r.after) r.after(drawerRow);
  }
  // 项目下拉候选 = 已有项目
  $('dl-projects').innerHTML = [...new Set(state.projects.map((p) => p.project))]
    .map((p) => `<option value="${esc(p)}">`).join('');
}
const ACT_CN = { start: '启动', stop: '停止', rollback: '回滚', rm: '删除' };
let moreOpen = null; // 当前展开的「更多 ▾」菜单按钮（单例；翻页/重渲自然收起）
function closeMoreMenu() {
  if (!moreOpen) return;
  const wrap = moreOpen.closest ? moreOpen.closest('.more-wrap') : null;
  const menu = wrap && wrap.querySelector ? wrap.querySelector('.menu') : null;
  if (menu) menu.classList.add('hidden');
  moreOpen.setAttribute?.('aria-expanded', 'false');
  moreOpen = null;
}
function toggleMoreMenu(btn) {
  const wrap = btn.closest ? btn.closest('.more-wrap') : null;
  const menu = wrap && wrap.querySelector ? wrap.querySelector('.menu') : null;
  if (!menu) return;
  const wasOpen = moreOpen === btn;
  closeMoreMenu();
  if (!wasOpen) { menu.classList.remove('hidden'); btn.setAttribute?.('aria-expanded', 'true'); moreOpen = btn; }
}
/** 行「更新」→ 发布页预填同一套（plan-17 §5/验收 7）。 */

async function onProjAction(ev) {
  const btn = ev.target.closest('button[data-act]');
  if (!btn || btn.disabled) return;
  const { act, p: project } = btn.dataset;
  if (act === 'env') return showEnvDlg(project);
  if (act === 'logs') { closeMoreMenu(); return openDrawer(project); } // plan-17 §1：日志随行抽屉展开（J3 ≤2 点击）
  if (act === 'more') return toggleMoreMenu(btn);
  if (act === 'retry-projects') { btn.disabled = true; return refreshProjects(true); } // 内联重试（§3）
  closeMoreMenu();
  if (act === 'update' || act === 'deploy-row') { // 待部署行「部署」=发布页预填项目名（§4）
    const row = state.projects.find((x) => x.project === project);
    if (row) updateViaPub(row);
    return;
  }
  if (act === 'dblink') { // 数据深链：数据页并填项目（复用已加载 projects，不另发请求）
    activateTab('db');
    const el = $('db-project'); if (el) el.value = project;
    return;
  }
  if (act === 'rm' && !confirm(`确认删除展项 ${project}？容器与路由即刻下线，数据库将一并删除，如需保留请先在数据页备份下载 .dump；删除后凭据一并清除，不可恢复。`)) return;
  // B1：停止与删除/重置同款二次确认（危险操作警示对齐：按钮红 + confirm 写明影响）
  if (act === 'stop' && !confirm(`确认停止展项 ${project}？容器即刻停止、对外不可访问（数据与凭据保留，可随时重新「启动」）。`)) return;
  // 第1轮UI审查P3：启停/回滚/删除请求期间按钮就地变「…中」并禁用（busy 状态），完成后恢复
  const ACT_BUSY_CN = { start: '启动中…', stop: '停止中…', rollback: '回滚中…', rm: '删除中…' }[act];
  if (ACT_BUSY_CN) busy(btn, true, ACT_BUSY_CN); else btn.disabled = true;
  try {
    const j = await api('POST', `/_api/${act}`, { project });
    $('proj-fb').textContent = `已${ACT_CN[act]} ${project}${j.url ? `，访问地址 ${externalUrl({ project })}` : ''}`;
    refreshProjects(true); // 写操作强制失效（plan-17 §3）
  } catch (e) { apiFail(`${ACT_CN[act]} ${project}`, e); }
  finally { if (ACT_BUSY_CN) busy(btn, false); else btn.disabled = false; }
}

// —— 发布（可选先走 §8.1 分片上传）——
function checkProj(project) {
  if (!PROJ_RE.test(project) || RESERVED.has(project)) return `项目「${project}」不合法（须匹配 ^[a-zA-Z0-9][a-zA-Z0-9-]{0,30}$，保留名：${[...RESERVED].join(' ')}）`;
  return null;
}
// —— §12.1/§13.1 一键部署与仅上传（同一状态条）：①压缩 → ②分片上传 →（部署）③发布 → ④完成 ——
const deploy = { busy: false, intent: 'deploy', file: null, blob: null, project: '', tag: '', uploadId: null, failAt: null };
const PHASE_CN = { compress: '压缩', upload: '上传', publish: '发布' };
function dpSet(i, cls) { // cls：'on' 进行中 / 'done' 完成 / 'err' 失败 / 'skip' 跳过
  const el = $(`dp-s${i}`);
  el.classList.remove('on', 'done', 'err', 'skip');
  if (cls) el.classList.add(cls);
}
const dpText = (t) => { $('dp-text').textContent = t; };
function dpReset() {
  $('dp-bar').classList.remove('hidden', 'err');
  for (const i of [1, 2, 3, 4]) dpSet(i, null);
  $('dp-done').classList.add('hidden');
  $('dp-retry').classList.add('hidden');
  $('dp-url').textContent = '';
  $('dp-url').removeAttribute?.('href');
  $('dp-prog').max = 1; $('dp-prog').value = 0;
  dpText('准备中…');
  deploy.failAt = null;
}
/** 部署主流程：mode = fresh 全新 / resume 断点续传（沿用 uploadId 会话）/ publish 仅重发发布。
 *  终点由 deploy.intent 决定：'deploy' 上传后自动发布（③④），'upload' 仅上传入库（③④ 标 skip）。 */
async function deployRun(mode) {
  deploy.busy = true; upBusy = true;
  $('dp-retry').classList.add('hidden');
  $('dp-bar').classList.remove('err');
  const { project, tag, file } = deploy;
  let phase = mode === 'publish' ? 'publish' : (mode === 'resume' ? 'upload' : 'compress');
  deploy.phase = phase; // plan-17 §4：本地「上传中」行标记数据源
  try {
    if (mode === 'fresh') { // ① 压缩（未选文件则①②一并跳过）
      if (file) {
        dpSet(1, 'on'); dpText('① 压缩中：读取文件…');
        $('dp-prog').max = file.size; $('dp-prog').value = 0;
        const { blob, zstd: pre } = await uploadPayload(file, (done, raw) => {
          dpText(`① 压缩中：${((done / raw) * 100).toFixed(1)}%（${done} / ${raw} 字节，zstd-${ZSTD_LEVEL}）`);
          $('dp-prog').max = raw; $('dp-prog').value = done;
        });
        deploy.blob = blob; deploy.pre = pre;
        dpSet(1, 'done');
        dpText(`压缩完成：${pre ? '文件已是 zstd，原样进入上传' : `压缩后 ${blob.size} / 原 ${file.size} 字节`}`);
      } else {
        dpSet(1, 'skip'); dpSet(2, 'skip');
        dpText('未选镜像文件：跳过压缩与上传，直接发布（要求镜像已入镜像库）');
      }
    }
    if (file && mode !== 'publish') { // ② 上传（失败重试走断点续传，§8.1）
      phase = 'upload';
      deploy.phase = 'upload';
      renderProjects(); // 行内标记「上传中」（dp-bar 为主显示）
      dpSet(2, 'on');
      if (deploy.uploadId) {
        await resumeUploadCore(deploy.uploadId, {
          compNote: (done, raw) => { dpSet(1, 'on'); dpText(`① 重新压缩（断点续传重建产物）：${done} / ${raw} 字节…`); $('dp-prog').max = raw; $('dp-prog').value = done; },
          onRec: (rec) => dpText(`② 上传中：断点续传（服务端已收 ${rec} 片），重新压缩后补传…`),
          upNote: dpUploadNote,
        });
        dpSet(1, 'done');
      } else {
        await deployUpload(project, tag);
      }
      deploy.uploadId = null;
      dpSet(2, 'done');
      if (deploy.intent === 'upload') { // 入口二「仅上传」：到②即完成，不发布（③④ 跳过）
        dpSet(3, 'skip'); dpSet(4, 'skip');
        dpText('② 完成：镜像已入库。可稍后到本页选「镜像库」源发布。');
        showMsg(`仅上传完成：镜像 ${project}:${tag} 已入库，可稍后到「发布」页选「镜像库」源发布。`, 'ok');
        deploy.failAt = null;
        ensureImages(true); // 清单立刻补上新镜像
        return;
      }
      dpText('上传完成：镜像已导入镜像库。');
    }
    phase = 'publish'; // ③ 发布（参数取自表单）
    deploy.phase = 'publish';
    markPublishing(project); // 行内标记「发布中…」
    dpSet(3, 'on');
    dpText('③ 发布中…');
    const body = { project, tag, container_port: parseInt($('pub-cport').value, 10) || 8080 };
    const memv = memFromUi($('pub-mem').value); // C4：裸数字按 MiB 提交（补 m 后缀，服务端字节语义不变）
    if (memv) body.mem = memv;
    const j = await api('POST', '/_api/publish', body);
    try { localStorage.setItem('sr.conf.' + project, JSON.stringify({ tag, cport: parseInt($('pub-cport').value, 10) || 8080, ts: Date.now() })); } catch { /* 存储不可写忽略 */ } // plan-17 §5：下次发布/「更新」预填
    markPublishDone(project); // 「重建中」60s 滚动窗口（§4）
    dpSet(3, 'done'); dpSet(4, 'done'); // ④ 完成：大字 URL + 复制
    const url = j.url || `/${project}/`;
    dpText('④ 完成：部署成功。');
    const eurl = externalUrl({ project }); // plan-17 §6：完成大字 URL 一律 externalUrl
    $('dp-url').textContent = eurl;
    $('dp-url').setAttribute?.('href', eurl);
    $('dp-done').classList.remove('hidden');
    showMsg(`一键部署成功，访问地址：${eurl}`, 'ok');
    refreshProjects(true);
    deploy.failAt = null;
  } catch (e) {
    deploy.failAt = phase;
    if (phase === 'publish') markPublishFail(project); // 本地「异常」终态标记（§4）
    $('dp-bar').classList.add('err');
    dpSet(phase === 'compress' ? 1 : phase === 'upload' ? 2 : 3, 'err');
    dpText(`「${PHASE_CN[phase]}」步骤失败：${errText(e)}${phase === 'upload' && deploy.uploadId ? '；点「重试」将从断点续传（保留已传分片）。' : '；可点「重试」再次执行。'}`);
    $('dp-retry').classList.remove('hidden');
    apiFail(`一键部署（${PHASE_CN[phase]}）`, e);
    if (phase === 'compress') deploy.blob = null;
  } finally { deploy.busy = false; upBusy = false; deploy.phase = null; deploy.upPct = null; renderProjects(); }
}
/** 校验并填充公共发布参数（项目留空自动生成回填；标签必填）；返回 null=校验未过。 */
function collectPubFields(requireFile) {
  let project = $('pub-project').value.trim();
  if (!project) { // §12.1：项目名为空 = 自动生成随机 8 位并回填表单
    project = randomProject();
    $('pub-project').value = project;
    updatePubUrl();
    showMsg(`项目名为空：已自动生成随机项目名 ${project} 并填入表单。`, 'ok');
  }
  const tag = $('pub-tag').value.trim();
  const badP = checkProj(project);
  if (badP) { fieldErr('pub-project', badP); return null; }
  if (!tag || /\s|\//.test(tag)) { fieldErr('pub-tag', `镜像标签「${tag}」不合法（非空、无空白/斜杠），请填写后再试`); return null; }
  const file = ($('pub-file').files || [])[0] || null;
  if (requireFile && !file) { fieldErr('pub-file', '「仅上传」需要选择镜像 tar 文件（不选文件的直发请用「一键部署」，选已有镜像请用「部署」表单）'); return null; }
  return { project, tag, file };
}
/** 两入口共用：请求期间互斥禁用对方按钮（各自显示「部署中…/上传中…」）。 */
