<!doctype html>
<html lang="zh-CN">
<head>
<link rel="icon" href="data:,">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#12141a">
<title>Showroom 控制台</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="msg" role="alert" aria-live="polite"></div>

<!-- ———— 登录（plan-16 §3：一步「账号+密码」；凭据生成与签名全程后台无感，用户不见
       seed/公钥串；签名自测通过前只渲染本区块，不渲染任何管理 UI） ———— -->
<section id="login">
  <h1>Showroom 控制台</h1>

  <!-- 主路径：一步登录（OPAQUE → 进入控制台，plan-16 §2.2 报文序列） -->
  <form id="lg-form" class="mt-3">
    <label class="field" for="lg-user"><span>账号（发布者账号）</span>
      <input type="text" id="lg-user" placeholder="如 alice…" size="14" autocomplete="username" aria-describedby="lg-user-err"></label>
    <p class="ferr" id="lg-user-err" aria-live="polite"></p>
    <label class="field mt-2" for="lg-pass"><span>密码（非 docker push 用的镜像库密码）</span>
      <input type="password" id="lg-pass" placeholder="输入账号密码…" size="14" autocomplete="current-password" aria-describedby="lg-pass-err"></label>
    <p class="ferr" id="lg-pass-err" aria-live="polite"></p>
    <div class="row">
      <button type="submit" id="lg-submit">登录</button>
      <span class="fb" id="lg-fb" aria-live="polite"></span>
    </div>
  </form>
  <p class="note">忘记密码请联系管理员重置。</p>
  </section>

<!-- ———— 管理壳（模板：惰性，登录成功后才克隆进文档流；SPEC §3「登录成功前不加载管理资源」） ———— -->
<template id="app-tpl">
  <!-- 三层层级·第一层：顶栏（sticky）——品牌 + 账号徽标（管理员角标）| 平台公钥/修改密码/退出 -->
  <header class="topbar">
    <div class="chrome">
      <div class="brand">
        <h1>Showroom 控制台</h1>
        <span class="user-badge"><span class="mono" id="hd-user"></span><span class="admin-mark hidden" id="hd-admin" title="管理员账号">管</span></span>
      </div>
      <div class="chrome-actions">
        <button id="btn-settings">设置</button>
        <button id="btn-logout">退出登录</button>
      </div>
    </div>
  </header>
  <!-- 三层层级·第二层：标签栏（sticky，顶栏正下方）；当前标签实底高亮 -->
  <nav id="tabs" role="tablist" aria-label="控制台功能分区">
    <button data-tab="proj" class="on" role="tab" id="tabbtn-proj" aria-selected="true" aria-controls="tab-proj">我的项目</button>
    <button data-tab="pub" role="tab" id="tabbtn-pub" aria-selected="false" aria-controls="tab-pub">发布</button>
    <button data-tab="img" role="tab" id="tabbtn-img" aria-selected="false" aria-controls="tab-img">镜像库</button>
    <button data-tab="db" role="tab" id="tabbtn-db" aria-selected="false" aria-controls="tab-db">数据</button>
    <button data-tab="help" role="tab" id="tabbtn-help" aria-selected="false" aria-controls="tab-help">帮助</button>
  </nav>
  <!-- 三层层级·第三层：内容区（1200px 居中功能卡片） -->

  <!-- 设置（plan-17 §0-4/§6）：对外访问域名 + 平台公钥 PEM 收纳（whoami platform_pem 自动取+缓存到
       sr.pempub，此处手工粘贴兜底）+ 改密/忘记设备入口聚合；页首不再常驻 PEM -->
  <dialog id="dlg-settings" aria-labelledby="dlg-settings-title">
    <div class="dlg-head">
      <h2 id="dlg-settings-title">设置</h2>
      <button type="button" id="dlg-settings-close">关闭</button>
    </div>
    <label class="field" for="set-base"><span>对外访问域名<span class="q" title="项目列表与完成页主链接用它拼接；留空用当前访问地址">&#63;</span></span>
      <input type="text" id="set-base" class="mono" placeholder="http://…:…"></label>
    <p class="ferr" id="set-base-err" aria-live="polite"></p>
    <label class="field mt-3" for="hd-pempub"><span>平台公钥 PEM（管理员分发的 <span class="mono">platform_rsa.pub</span>；镜像上传与数据库恢复的加密信封公钥。登录后通常已自动配置，无需粘贴，此处仅兜底）</span>
      <textarea id="hd-pempub" class="mono" rows="9" placeholder="-----BEGIN PUBLIC KEY-----&#10;…&#10;-----END PUBLIC KEY-----…"></textarea>
    </label>
    <div class="sep"></div>
    <div class="row">
      <button type="button" id="btn-pwchange" title="当前密码校验后替换为新密码（密码不明文上线）">修改密码…</button>
    </div>
  </dialog>

  <!-- ———— 标签页 1：项目管理 ———— -->
  <section id="tab-proj" role="tabpanel" aria-labelledby="tabbtn-proj">
    <h2>项目列表</h2>
    <div class="warnbar hidden" id="proj-base-note">正在用内网地址展示 URL：可在<button type="button" id="btn-base-note-settings" class="act">设置</button>中配置「对外访问域名」（公网域名）。</div>
    <div class="row">
      <span class="sub" id="proj-fb"></span>
    </div>
    <div class="tbl-wrap tbl-page">
      <div class="tbl-xwrap"><!-- B3：窄视口横向滚动容器 -->
      <table id="proj-tbl">
        <thead><tr>
          <th>名称</th><th>状态</th><th>对外 URL</th><th>标签</th><th class="num">更新</th><th>操作</th><th>日志</th>
        </tr></thead>
        <tbody><tr><td colspan="7" class="note">正在加载…</td></tr></tbody>
      </table>
      </div>
    </div>
  </section>

  <!-- ———— 标签页 2：发布（plan-17 §5：全站唯一参数输入处） ———— -->
  <section id="tab-pub" class="hidden" role="tabpanel" aria-labelledby="tabbtn-pub">
    <!-- plan-17 §5：发布表单=全站唯一参数输入处。单表单双镜像源：tar→压缩+上传+发布；镜像库→①②skip 直接发布 -->
    <h2>发布</h2>
    <form id="pub-form">
      <div class="grid">
        <label class="field" for="pub-project"><span>项目<span class="q" title="可随意修改，或从已有项目选择；清空后发布将自动生成随机名">&#63;</span></span>
          <span class="row combo">
            <input type="text" id="pub-project" size="12" aria-describedby="pub-project-err">
          </span></label>
      </div>
      <!-- 视觉QA P1-3：镜像源 radio 与其余字段同列栅格（原独立成行脱离列轴，左移 90px） -->
      <div class="grid mt-2">
        <div class="field" role="radiogroup" aria-label="镜像源"><span>镜像源</span>
          <span class="row radio-row">
            <label class="row" for="pub-src-tar"><input type="radio" name="pub-src" id="pub-src-tar" checked>本地 tar 文件</label>
            <label class="row" for="pub-src-registry"><input type="radio" name="pub-src" id="pub-src-registry">镜像库（已入库镜像）</label>
          </span>
        </div>
        <span class="field" id="pub-src-file-box">
          <span>镜像 tar 文件<span class="q" title="不选则直接发布，要求镜像已入镜像库；选择后自动压缩并上传再发布">&#63;</span></span>
          <span class="row combo">
            <input type="file" id="pub-file" class="file-hidden" aria-describedby="pub-file-err">
            <label for="pub-file" class="file-btn">选择文件</label>
            <span class="note">未选择文件</span>
          </span>
        </span>
        <span class="field hidden" id="pub-src-reg-box">
          <label class="field" for="dep-image"><span>镜像<span class="q" title="从已上传的镜像中选择：输入前缀过滤，自动加载">&#63;</span></span>
            <input type="text" id="dep-image" size="34" class="mono" placeholder="输入前缀过滤，如 alice/demo:…" aria-describedby="dep-image-err"></label>
          <span class="fb" id="dep-images-fb" aria-live="polite"></span>
        </span>
        <label class="field" for="pub-tag"><span>镜像标签<span class="q" title="必填；选镜像后自动带出">&#63;</span></span>
          <input type="text" id="pub-tag" required size="10" aria-describedby="pub-tag-err"></label>
        <label class="field" for="pub-mem"><span>内存需求（MiB）</span>
          <input type="text" id="pub-mem" value="256" size="6" placeholder="单位 MiB，如 256…"></label>
        <label class="field" for="pub-cport"><span>项目端口（容器内）</span>
          <input type="number" id="pub-cport" value="8080" min="1" max="65535" size="5"></label>
        <!-- 视觉QA P2-3：「发布」「仅上传」同一行排列（row 包组，不再随栅格换行分离） -->
        <span class="row" id="pub-actions">
          <button type="submit" id="pub-submit">发布</button>
          <button type="button" id="btn-upload-only">仅上传</button>
        </span>
      </div>
      <!-- 第1轮UI审查P1：空间条在发布页可见（镜像 tar 上传发生在本页；与镜像库页 #space-note 同数据同刷新） -->
      <p class="note mt-2" id="pub-space-note" aria-live="polite">可用空间：…</p>
      <p class="note hidden" id="pub-pref-note" aria-live="polite"></p>
      <p class="ferr" id="pub-project-err" aria-live="polite"></p>
      <p class="ferr" id="pub-tag-err" aria-live="polite"></p>
      <p class="ferr" id="pub-file-err" aria-live="polite"></p>
      <p class="ferr" id="dep-image-err" aria-live="polite"></p>
    </form>
    <!-- plan-17 验收 6：未配置 PEM 时选 tar 发布 → 内联引导（登录后通常已自动配置，永不出现） -->
    <p class="warnbar hidden" id="pub-pem-hint">尚未完成安全配置：到<button type="button" id="btn-go-settings" class="act">设置</button>完成</p>
    <!-- §12.1 发布状态条：①压缩 → ②上传 → ③发布 → ④完成（大字 URL + 复制）；任一步失败标红可重试；
         「仅上传」走①②并在成功时把③④标记为跳过（镜像已入库，可稍后从下方发布入口选择） -->
    <div id="dp-bar" class="hidden mt-3">
      <div class="row">
        <span class="wz-step" id="dp-s1">① 压缩</span>
        <span class="wz-step" id="dp-s2">② 上传</span>
        <span class="wz-step" id="dp-s3">③ 发布</span>
        <span class="wz-step" id="dp-s4">④ 完成</span>
        <button type="button" id="dp-retry" class="hidden">重试</button>
      </div>
      <div class="mt-2">
        <progress id="dp-prog" max="1" value="0"></progress>
        <div id="dp-text" class="note" aria-live="polite">（未开始）</div>
        <div id="dp-done" class="hidden mt-2">
          <div class="row combo">
            <a id="dp-url" class="dp-url" target="_blank" rel="noopener"></a>
            <button type="button" id="dp-copy">复制地址</button>
          </div>
        </div>
      </div>
    </div>
    <!-- 视觉QA P1-6：页尾 9-10 行长段拆为 3 步列表；技术细节各有归宿或运行时提示（R5：说明折叠整删） -->
    <div class="fs">
      <h3>发布说明</h3>
      <ol class="note help-list">
        <li>选「本地 tar 文件」→ 自动压缩 → 上传 → 发布 → 展示访问地址（恒为 <span class="mono" id="pub-url">/&lt;project&gt;/</span>）。</li>
        <li>选「镜像库」→ 直接发布已入库镜像（①②两段自动跳过）。</li>
        <li>任一步失败状态条标红，可点「重试」；「仅上传」只把镜像送入镜像库（不发布），适合先备好镜像、稍后发布。</li>
      </ol>
    </div>
  </section>

  <!-- ———— 标签页 3：镜像库（plan-17 §1：镜像清单/删除/断点续传收纳） ———— -->
  <section id="tab-img" class="hidden" role="tabpanel" aria-labelledby="tabbtn-img">
    <h2>镜像库 <span class="sub" id="img-sub"></span></h2>
    <!-- §14.3 镜像清单：与发布表单「镜像库」下拉同源 /_api/images 数据；每行「删除」走 POST /_api/image-rm（内联 GC，秒级回收磁盘） -->
    <div class="tbl-wrap tbl-low mt-3"><!-- 视觉QA P1-7：介绍段→表头 3px → 12px -->
      <table id="img-list">
        <thead><tr><th>镜像</th><th>操作</th></tr></thead>
        <tbody><tr><td colspan="2" class="note">正在加载…</td></tr></tbody>
      </table>
    </div>

    <div class="fs hidden" id="fs-resume">
      <h3>断点续传</h3>
      <div class="row">
        <button id="btn-resume">恢复上次上传</button>
        <span class="note">检测到未完成的上传，点击从中断处继续。</span>
      </div>
      <!-- §14.1 空间条：常显「可用空间」；进入本区 / import-end 成功 / 删除镜像后自动刷新 -->
      <div class="row">
        <div id="space-note" class="note" aria-live="polite">可用空间：…</div>
      </div>
      <div class="mt-3">
        <progress id="up-prog" max="1" value="0"></progress>
        <div id="up-status" class="note" aria-live="polite">尚未开始上传：到「发布」页选「本地 tar 文件」点「发布」或「仅上传」即可开始。</div>
      </div>
    </div>
  </section>

  <!-- ———— 标签页 2：数据库（SPEC §9） ———— -->
  <section id="tab-db" class="hidden" role="tabpanel" aria-labelledby="tabbtn-db">
    <h2>目标项目</h2>
    <div class="grid">
      <label class="field grow" for="db-project"><span>项目</span>
        <input type="text" id="db-project" required size="12"></label>
    </div>
    <p class="note">只能操作本人名下项目对应的数据库。</p>

    <div class="sep"></div>
    <h2>表清单与预览</h2>
    <div class="grid">
      <label class="field" for="db-table"><span>表名</span>
        <input type="text" id="db-table" size="14" placeholder="选定项目后自动载入…"></label>
      <label class="field" for="db-limit"><span>预览行数</span>
        <select id="db-limit"><option>50</option><option selected>100</option><option>200</option></select></label>
      <button id="btn-db-preview">预览</button>
    </div>
    <p class="fb" id="db-tbl-fb" aria-live="polite"></p>
    <div class="tbl-wrap hidden" id="db-preview-wrap">
      <table id="db-preview-tbl"></table>
    </div>

    <div class="sep"></div>
    <h2>SQL 编辑器</h2>
    <label class="field" for="db-sql"><span>SQL 语句（多行；服务端直接执行，语句失败即停止）</span>
      <textarea id="db-sql" class="mono" spellcheck="false" placeholder="SELECT * FROM …"></textarea></label>
    <div class="row"><button id="btn-db-sql">执行 SQL</button></div>

    <div class="sep"></div>
    <h2>备份与恢复</h2>
    <p class="note">备份内容用下载专用密码加密，服务器无法解密。</p>
    <div class="grid">
      <button id="btn-db-dump">备份下载（自动生成下载专用密码）</button>
      <span class="field" id="db-restore-box">
        <span>恢复用的 .dump 文件（备份下载的产物）</span>
        <span class="row combo">
          <input type="file" id="db-restore-file" accept=".dump" class="file-hidden">
          <label for="db-restore-file" class="file-btn">选择文件</label>
          <span class="note">未选择文件</span>
        </span>
      </span>
      <button id="btn-db-restore" class="danger">恢复上传（覆盖当前数据）</button>
      <button id="btn-db-reset" class="danger">重置数据库</button>
    </div>
    <div class="mt-2">
      <progress id="db-prog" max="1" value="0"></progress>
      <div id="db-prog-txt" class="note" aria-live="polite">（备份进度：等待发起）</div>
    </div>
    <h3>操作输出</h3>
    <pre class="out mono" id="db-out" aria-live="polite">（尚无输出）</pre>
    <p class="fb" id="db-fb" aria-live="polite"></p>

    <div class="sep"></div>
    <!-- §13.2/13.3（plan-17 S2 自状态页迁入）：DB 下拉来自 /_api/redis-dbs（服务端按用户过滤；admin 全量） -->
    <h2>Redis 浏览</h2>
    <div class="row">
      <label class="field" for="rd-db"><span>逻辑库（DB）</span><select id="rd-db"></select></label>
      <label class="field" for="rd-q"><span>键前缀过滤（回车查询）</span>
        <input type="text" id="rd-q" class="mono" placeholder="如 sr_demo_ 或留空…"></label>
      <!-- 自动加载（选库/输入前缀后回车自动查询 -->
      <span class="note" id="rd-count" aria-live="polite"></span>
    </div>
    <!-- 视觉QA P2-10：key 栏与值面板同构（div.field flex column + 顶部 label 行），双栏对齐 -->
    <div class="row rd-panes">
      <div class="field rd-keys-pane">
        <span>键列表</span>
        <select id="rd-keys" size="12" class="mono" aria-label="键列表">
          <option value="">（选择逻辑库后自动加载）</option>
        </select>
      </div>
      <div class="field rd-val-pane">
        <span id="rd-meta" aria-live="polite">（点击左侧键查看类型 / 剩余生存时间 / 值）</span>
        <pre class="out mono" id="rd-val" aria-live="polite">（未选择键）</pre>
      </div>
    </div>
    <p class="note">每项目一个逻辑库，编号由平台分配<span class="hidden" id="rd-admin-clause">；管理员可见全部逻辑库</span>。键列表单次最多 200 条（可能截断），值超过 4KB 会被服务端截断。</p>
  </section>

  <!-- ———— 标签页 4：帮助 ———— -->
  <section id="tab-help" class="hidden" role="tabpanel" aria-labelledby="tabbtn-help">
    <h2>登录与账号</h2>
    <ul class="note help-list">
      <li>账号与登录密码由管理员发放。</li>
      <li>忘记密码请联系管理员重置（控制台无法自助找回）。</li>
    </ul>

    <h2>CLI 使用</h2>
    <ul class="note help-list">
      <li>CLI 与控制台同一模型（统一账号密码认证）：<span class="mono">showroom login &lt;账号&gt;</span> 输一次密码即自动配置本机（含镜像库凭据），此后全部子命令免密码（gh/ssh 模型）；<span class="mono">showroom logout</span> 退出（清本机并远程吊销钥匙）。</li>
      <li>无账号 / 忘记密码：联系管理员发放或重置（<span class="mono">showroomctl user-add &lt;名&gt; --gen-password</span>）。</li>
    </ul>

    <h2>镜像规范</h2>
    <ul class="note help-list">
      <li>项目须监听容器内 <span class="mono">8080</span> 端口（其他端口在发布表单的端口字段如实填写）。</li>
      <li>项目经子路径对外发布：访问地址恒为 <span class="mono">/&lt;project&gt;/</span>，读 <span class="mono">SHOWROOM_BASE_PATH</span>（值即该前缀）适配，或页面内一律使用相对 URL。</li>
      <li>建议在 Dockerfile 里配置 <span class="mono">HEALTHCHECK</span>，平台据此判定健康并自愈。</li>
      <li>镜像内配置文件替换推荐 <span class="mono">envsubst &lt; config.tpl &gt; config</span> 模式（占位符由注入的环境变量填充）。</li>
    </ul>

    <h2>环境变量清单（发布时自动注入）</h2>
    <div class="tbl-wrap"><table id="help-env-tbl">
      <thead><tr><th>键</th><th>用途</th></tr></thead>
      <tbody></tbody>
    </table></div>
    <p class="note">当前值可随时在项目列表「环境变量」里查看（<span class="mono">showroom env</span> 同）。</p>

    <h2>工具下载</h2>
    <div class="tbl-wrap"><table id="tool-tbl">
      <thead><tr><th>文件</th><th>说明</th><th>大小</th><th>操作</th></tr></thead>
      <tbody>
        <tr>
          <td class="mono">showroom</td>
          <td>CLI 二进制（Linux x86_64）：下载后 <span class="mono">chmod +x showroom</span> 放入 PATH（如 <span class="mono">~/.local/bin</span>）；建议校验完整性——<span class="mono">sha256sum showroom</span> 后与管理员核对校验值。</td>
          <td class="mono" id="tool-size-showroom">—</td>
          <td><button type="button" class="act" data-tool-dl="showroom">下载</button></td>
        </tr>
        <tr>
          <td class="mono">showroom-publisher.md</td>
          <td>Agent Skill（SKILL.md）：AI 助手的 Showroom 发布代理技能文件，存为 <span class="mono">~/.agents/skills/showroom-publisher/SKILL.md</span> 即可交给助手代为发布。</td>
          <td class="mono" id="tool-size-showroom-publisher.md">—</td>
          <td><button type="button" class="act" data-tool-dl="showroom-publisher.md">下载</button></td>
        </tr>
        <tr>
          <td class="mono">platform_rsa.pub</td>
          <td>平台公钥（PEM）：镜像上传与数据库恢复的加密信封公钥（登录后控制台已自动配置，此处供 CLI / 其他设备手工分发）。</td>
          <td class="mono" id="tool-size-platform_rsa.pub">—</td>
          <td><button type="button" class="act" data-tool-dl="platform_rsa.pub">下载</button></td>
        </tr>
      </tbody>
    </table></div>
    <p class="note">文件大小在首次下载后显示。CLI 首次配置见上「CLI 使用」一节。</p>

    <h2>CLI 命令对照</h2>
    <div class="tbl-wrap"><table>
      <thead><tr><th>控制台功能</th><th>CLI 等价命令</th></tr></thead>
      <tbody>
        <tr><td>账号密码登录（自动绑定本机）</td><td class="mono">showroom login &lt;账号&gt;</td></tr>
        <tr><td>退出登录</td><td class="mono">showroom logout</td></tr>
        <tr><td>修改密码（登录态自助）</td><td class="wrap">控制台「设置 → 修改密码」入口（CLI 暂无；管理员可代为重置，见下）</td></tr>
        <tr><td>生成/重置本机签名密钥（调试用）</td><td class="mono">showroom keygen</td></tr>
        <tr class="admin-only hidden"><td>发放新账号（初始密码 / 管理员）</td><td class="mono">showroomctl user-add &lt;账号&gt; --gen-password [--admin]</td></tr>
        <tr class="admin-only hidden"><td>补发 / 重置密码（管理员）</td><td class="mono">showroomctl user-passwd &lt;账号&gt; --gen-password</td></tr>
        <tr><td>项目列表</td><td class="mono">showroom ps</td></tr>
        <tr><td>发布（单表单：本地 tar / 镜像库）/ 仅上传</td><td class="mono">showroom deploy / push / publish</td></tr>
        <tr><td>启动 / 停止 / 回滚 / 删除</td><td class="mono">showroom start / stop / rollback / rm</td></tr>
        <tr><td>日志 / 环境变量</td><td class="mono">showroom logs / showroom env</td></tr>
        <tr><td>SQL 执行 / 表清单 / 预览</td><td class="mono">showroom db sql / tables / preview</td></tr>
        <tr><td>备份下载 / 恢复上传 / 重置</td><td class="mono">showroom db dump / restore / reset</td></tr>
      </tbody>
    </table></div>

    <h2>常见错误码</h2>
    <div class="tbl-wrap"><table>
      <thead><tr><th>错误码</th><th>含义与处理</th></tr></thead>
      <tbody>
        <tr><td class="mono">E_AUTH</td><td class="wrap">登录凭据校验未通过（常见于本设备登录状态过期或被收回、更换设备）。重新用账号密码登录即可自动修复（CLI 同：showroom login 重登）；仍失败可用 <span class="mono">showroom doctor</span> 排查时钟偏差。</td></tr>
        <tr><td class="mono">E_NAME</td><td class="wrap">命名不符合规则 <span class="mono">^[a-zA-Z0-9][a-zA-Z0-9-]{0,30}$</span> 或使用了保留名（v2/_api/_bootstrap/_console）。</td></tr>
        <tr><td class="mono">E_QUOTA</td><td class="wrap">超出限额：内存配额 / 导入体积 / 磁盘空间（扣除预留）不足；请调低内存配置、精简镜像，磁盘不足时可在「镜像库」删除旧镜像后重试。</td></tr>
        <tr><td class="mono">E_NOTFOUND</td><td class="wrap">项目或上传/下载会话不存在。</td></tr>
        <tr><td class="mono">E_STATE</td><td class="wrap">当前状态不允许该操作（如危险 SQL 未确认、容器状态冲突）。</td></tr>
        <tr><td class="mono">E_NET</td><td class="wrap">网络或服务不可用，稍后重试。</td></tr>
        <tr><td class="mono">502</td><td class="wrap">项目服务异常（容器未就绪或已崩溃），请联系管理员。</td></tr>
      </tbody>
    </table></div>
  </section>

  <!-- 环境变量模态（§6 键值 + 中文说明） -->
  <dialog id="dlg-env" aria-labelledby="dlg-env-title">
    <div class="dlg-head">
      <h2 id="dlg-env-title">环境变量</h2>
      <button type="button" id="dlg-env-close">关闭</button>
    </div>
    <div class="tbl-wrap"><table id="env-tbl">
      <thead><tr><th>键</th><th>当前值</th><th>用途</th></tr></thead>
      <tbody></tbody>
    </table></div>
  </dialog>

  <!-- 修改密码（plan-16 §2.2 pw 三件序列）：当前密码本地校验（复用 OPAQUE login 序列，不产生登录态）
       → pw-begin {user,m1} → 本地 reg finish → pw-commit {user,record}（后两者均 SR-SIG1 常规签名） -->
  <dialog id="dlg-pw" aria-labelledby="dlg-pw-title">
    <div class="dlg-head">
      <h2 id="dlg-pw-title">修改密码</h2>
      <button type="button" id="pw-close">关闭</button>
    </div>
    <label class="field" for="pw-cur"><span>当前密码（先校验本人旧密码，再替换为新密码）</span>
      <input type="password" id="pw-cur" size="18" autocomplete="current-password" aria-describedby="pw-cur-err"></label>
    <p class="ferr" id="pw-cur-err" aria-live="polite"></p>
    <label class="field mt-2" for="pw-new"><span>新密码</span>
      <input type="password" id="pw-new" size="18" autocomplete="new-password" aria-describedby="pw-new-err"></label>
    <p class="ferr" id="pw-new-err" aria-live="polite"></p>
    <label class="field mt-2" for="pw-new2"><span>确认新密码</span>
      <input type="password" id="pw-new2" size="18" autocomplete="new-password" aria-describedby="pw-new2-err"></label>
    <p class="ferr" id="pw-new2-err" aria-live="polite"></p>
    <div class="row">
      <button type="button" id="pw-submit">确认修改</button>
      <span class="fb" id="pw-fb" aria-live="polite"></span>
    </div>
    <p class="note">修改成功后请使用新密码重新登录。新旧密码均只在本机参与盲化，全程不明文上线。</p>
  </dialog>
</template>

<!-- ———— 管理员标签（SPEC §12.2）：仅 whoami admin=true 时克隆进文档流；非管理员的 DOM 不存在 ———— -->
<template id="admin-tpl">
  <div id="admin-root">
    <section id="tab-admin" class="hidden" role="tabpanel" aria-labelledby="tabbtn-admin">
      <!-- R5 E1：管理页二级导航（复用主 tab 栏样式，尺寸小一档）；五面板互斥，默认「账号」 -->
      <nav id="admin-subnav" role="tablist" aria-label="管理功能分区">
        <button data-adp="users" class="on" role="tab" id="adpbtn-users" aria-selected="true" aria-controls="adp-users">账号</button>
        <button data-adp="projects" role="tab" id="adpbtn-projects" aria-selected="false" aria-controls="adp-projects">全部项目</button>
        <button data-adp="status" role="tab" id="adpbtn-status" aria-selected="false" aria-controls="adp-status">平台状态</button>
        <button data-adp="host" role="tab" id="adpbtn-host" aria-selected="false" aria-controls="adp-host">宿主配置</button>
        <button data-adp="events" role="tab" id="adpbtn-events" aria-selected="false" aria-controls="adp-events">实时事件</button>
      </nav>

      <!-- —— 面板：账号（账号/设备表 / 发卡 / 补发） —— -->
      <div id="adp-users" role="tabpanel" aria-labelledby="adpbtn-users">
        <h2>账号</h2>
        <div class="row">
          <!-- 自动刷新（管理员数据源 30s 定时与事件驱动，无需手动刷新 -->
          <button id="ad-user-add">发放新账号</button>
          <span class="fb" id="ad-fb" aria-live="polite"></span>
        </div>
        <div class="tbl-wrap">
          <table id="ad-users-tbl">
            <thead><tr><th>设备</th><th>登录时间</th><th>操作</th></tr></thead>
            <tbody><tr><td colspan="3" class="note">正在加载…</td></tr></tbody>
          </table>
        </div>
        <p class="note">管理员是账号属性：该账号登录即具管理权限。</p>
      </div>

      <!-- —— 面板：全部项目（跨用户；GET /_api/admin/projects 全量 + owner） —— -->
      <div id="adp-projects" class="hidden" role="tabpanel" aria-labelledby="adpbtn-projects">
        <h2>全部项目</h2>
        <p class="note">全部账号的项目（管理员）。</p>
        <div class="tbl-wrap tbl-page">
          <table id="ad-projects-tbl">
            <thead><tr><th>项目</th><th>所属账号</th><th>状态</th><th class="num">更新</th><th>操作</th></tr></thead>
            <tbody><tr><td colspan="5" class="note">正在加载…</td></tr></tbody>
          </table>
        </div>
        <p class="fb" id="ad-proj-fb" aria-live="polite"></p>
      </div>

      <!-- —— 面板：平台状态 —— -->
      <div id="adp-status" class="hidden" role="tabpanel" aria-labelledby="adpbtn-status">
        <h2>平台状态</h2>
        <!-- R4 用户裁决：30 秒自动刷新恒开，无开关 UI（加载失败走顶部条） -->
        <div id="ad-status" class="note" aria-live="polite">（正在加载…）</div>
      </div>

      <!-- —— 面板：宿主配置（期望状态 + 中间件 + policy + 漂移/池 + 两段式） —— -->
      <div id="adp-host" class="hidden" role="tabpanel" aria-labelledby="adpbtn-host">
        <h2>主机编排（期望状态 · 两段式变更）</h2>
        <div class="row">
          <span class="fb" id="hs-fb" aria-live="polite"></span>
        </div>

        <h3>中间件集合（host.env MIDDLEWARE）</h3>
        <div class="row">
          <label class="row" for="hs-mw-postgres"><input type="checkbox" id="hs-mw-postgres"><span>postgres</span></label>
          <label class="row" for="hs-mw-redis"><input type="checkbox" id="hs-mw-redis"><span>redis</span></label>
          <label class="row" for="hs-mw-registry"><input type="checkbox" id="hs-mw-registry"><span>registry</span></label>
        </div>
        <p class="note">取消勾选即禁用，重新勾选即启用。</p>

        <h3>主机开关与 FRP（host.env 其余键 · 通用键值展示）</h3>
        <div class="tbl-wrap tbl-low"><table id="hs-kv-tbl">
          <thead><tr><th>键</th><th>当前值</th></tr></thead>
          <tbody><tr><td colspan="2" class="note">（正在加载…）</td></tr></tbody>
        </table></div>

        <h3>参数值（policy.env）</h3>
        <div class="grid">
          <label class="field" for="hs-p-redisdbs"><span>REDIS_DBS<span class="q" title="Redis 逻辑库池上限 · 只读，修改走「扩容」流">&#63;</span></span>
            <input type="number" id="hs-p-redisdbs" readonly class="mono"></label>
          <label class="field" for="hs-p-disk"><span>DISK_RESERVE_GB<span class="q" title="磁盘预留">&#63;</span></span>
            <input type="number" id="hs-p-disk" readonly min="0" step="1" class="mono"></label>
          <label class="field" for="hs-p-mem"><span>RESERVE_MEM_MB（内存预留）</span>
            <input type="number" id="hs-p-mem" readonly min="0" step="1" class="mono"></label>
          <label class="field" for="hs-p-factor"><span>UPLOAD_SPACE_FACTOR<span class="q" title="上传空间估算膨胀因子">&#63;</span></span>
            <input type="number" id="hs-p-factor" readonly min="1" step="0.1" class="mono"></label>
        </div>

        <h3>漂移清单与 Redis 池</h3>
        <div id="hs-drift" aria-live="polite"><p class="note m-0">（正在加载…）</p></div>
        <div id="hs-pool" class="mt-3" aria-live="polite">
          <div id="hs-pool-warn" class="warnbar hidden">
            <span id="hs-pool-warn-txt"></span>
            <button type="button" id="hs-pool-expand">扩容</button>
          </div>
          <p class="note hidden m-0" id="hs-pool-ok"></p>
        </div>

        <h3 class="mt-3">变更流程（修改 → 查看变更 → 确认执行）</h3>
        <div class="row">
          <button id="hs-apply">查看变更</button>
          <button id="hs-confirm" class="danger hidden">确认执行</button>
        </div>
        <div id="hs-review" class="hidden mt-2">
          <div id="hs-review-sum" class="note" aria-live="polite"></div>
          <div class="tbl-wrap tbl-mid"><table id="hs-actions-tbl">
            <thead><tr><th>动作</th><th>目标</th><th>说明</th></tr></thead>
            <tbody><tr><td colspan="3" class="note">（空）</td></tr></tbody>
          </table></div>
          <div id="hs-impact"></div>
        </div>
        <div id="hs-report" class="hidden mt-2" aria-live="polite"></div>
      </div>

      <!-- —— 面板：实时事件 —— -->
      <div id="adp-events" class="hidden" role="tabpanel" aria-labelledby="adpbtn-events">
        <h2>实时事件</h2>
        <div class="row">
          <span class="note">连接状态：<span class="mono" id="ev-state" aria-live="polite">未连接</span></span>
          <span class="note">最近 20 条。</span>
        </div>
        <pre class="out mono" id="st-events" aria-live="polite">（暂无事件）</pre>
      </div>
    </section>

    <!-- 发放新账号（plan-16 §1.4/§1.5 + B7 统一账号密码认证）：主路径=账号 + 自动生成的登录
         初始密码（打开对话框即客户端 crypto 随机 16 位生成并暂存，不展示）→ user-add
         {user,password[,admin]}；结果两行一次性密码（登录初始 + registry）；公钥直登记路径已删除（发卡恒设密码） -->
    <dialog id="dlg-user-add" aria-labelledby="dlg-user-add-title">
      <div class="dlg-head">
        <h2 id="dlg-user-add-title">发放新账号</h2>
        <button type="button" id="ad-na-close">关闭</button>
      </div>
      <label class="field" for="ad-na-user"><span>账号名（<span class="mono">^[a-z0-9][a-z0-9-]{0,30}$</span>）</span>
        <input type="text" id="ad-na-user" size="14" aria-describedby="ad-na-user-err"></label>
      <p class="ferr" id="ad-na-user-err" aria-live="polite"></p>
      <div class="row">
        <span class="fb" id="ad-na-fb" aria-live="polite"></span>
      </div>
      <label class="row mt-3" for="ad-na-admin"><input type="checkbox" id="ad-na-admin"><span>同时授予管理员<span class="q" title="可管理账号与平台状态">&#63;</span></span></label>
      <div class="row">
        <button type="button" id="ad-na-submit">发放</button>
      </div>
      <div id="ad-na-result" class="hidden mt-3" aria-live="polite">
        <p class="note note-warn">发放成功：以下密码均<b>仅显示一次</b>，请立即交予发布者妥善保存，关闭后无法再查。</p>
        <div class="row combo" id="ad-na-login-row">
          <span class="note nowrap">登录初始密码（登录控制台 / CLI）</span>
          <code id="ad-na-login-pw" class="pub mono"></code>
          <button type="button" id="ad-na-copy-login">复制密码</button>
        </div>
        <div class="row combo mt-1">
          <span class="note nowrap">镜像库密码（docker push 推送用）</span>
          <code id="ad-na-pw" class="pub mono"></code>
          <button type="button" id="ad-na-copy">复制密码</button>
        </div>
        <p class="note mt-1">发布者用「账号 + 登录密码」经 <span class="mono">showroom login</span> 或控制台登录即可，无需分发任何额外材料。</p>
      </div>
    </dialog>

    <!-- 补发密码（plan-16 §1.5 passwd-set）：confirm → 生成新密码一次性展示（旧密码即刻失效，其他设备不受影响） -->
    <dialog id="dlg-passwd-set" aria-labelledby="dlg-passwd-set-title">
      <div class="dlg-head">
        <h2 id="dlg-passwd-set-title">补发密码</h2>
        <button type="button" id="ad-ps-close">关闭</button>
      </div>
      <p class="note note-warn mt-3">已为账号 <span class="mono" id="ad-ps-user"></span> 生成新的登录初始密码——<b>仅显示一次</b>，请立即交予发布者妥善保存；原密码即刻失效，其他设备不受影响。</p>
      <div class="row combo mt-2">
        <code id="ad-ps-pw" class="pub mono"></code>
        <button type="button" id="ad-ps-copy">复制密码</button>
      </div>
    </dialog>

    <!-- §15.3 Redis 逻辑库扩容对话框：输入新 databases 值 → 服务端提示原文（重启约 3 秒/AOF 持久/自动重连）→ 我已了解，执行扩容 → 结果回报 -->
    <dialog id="dlg-redis-x" aria-labelledby="dlg-redis-x-title">
      <div class="dlg-head">
        <h2 id="dlg-redis-x-title">Redis 逻辑库扩容</h2>
        <button type="button" id="hs-rx-close">关闭</button>
      </div>
      <label class="field" for="hs-rx-n"><span>新的 databases 值（16–256 的整数，且需大于当前已分配的最大库编号，否则会截断在用库）</span>
        <input type="number" id="hs-rx-n" min="16" max="256" step="1" class="mono" placeholder="如 256…" aria-describedby="hs-rx-n-err"></label>
      <p class="ferr" id="hs-rx-n-err" aria-live="polite"></p>
      <div class="row">
        <button type="button" id="hs-rx-preview">获取确认提示</button>
        <button type="button" id="hs-rx-run" class="danger hidden">我已了解，执行扩容</button>
      </div>
      <pre id="hs-rx-prompt" class="hidden mt-2" aria-live="polite"></pre>
      <p class="fb" id="hs-rx-fb" aria-live="polite"></p>
    </dialog>
  </div>
</template>

<div id="app"></div>

<script type="module" src="js/app.mjs"></script>
</body>
</html>
