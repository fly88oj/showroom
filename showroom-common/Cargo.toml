[package]
name = "showroom-common"
version = "0.1.0"
edition = "2021"

# cdylib：wasm32 控制台垫片（src/wasm_shim.rs，SPEC §8.3）；rlib 供原生 crate 复用
[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
ed25519-dalek = "2"
rsa = "0.9"
hmac = "0.12" # plan-18 §3.3：SRTP 密钥下发 OPAQUE 绑定（HMAC-SHA256）
aes-gcm = "0.10"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
hex = "0.4"
# plan-16（SPEC §16）OPAQUE 登录：default-features=false 免 getrandom "js"（§8.3 禁引
# wasm-bindgen；wasm 熵走既有 custom 后端桥，见 wasm_shim.rs）；ristretto255-voprf 即 Suite 全集。
opaque-ke = { version = "3", default-features = false, features = ["ristretto255-voprf"] }
# rwd 硬化（argon2id）：纯 Rust 无 C 工具链可交叉 wasm32；只用核心 hash_password_into。
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }

# wasm32 专用：getrandom 无该目标默认后端（js feature 会引 wasm-bindgen，SPEC §8.3 禁用），
# 走 "custom" 后端桥到熵池（见 lib.rs register_custom_getrandom / wasm_shim.rs）；
# zstd 为浏览器上传压缩会话（wasm_shim sr_zstd_*；zstd-sys 的 C 源经 clang 交叉编译该目标，
# 原生侧的解压消费方在 showroomctl——那里已直接依赖 zstd，common 原生构建不重复引入）
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["custom"] }
zstd = "0.13"
